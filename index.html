<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PatchinPennies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
:root{
  --bg:#fdf6f9;--bg2:#fff0f7;--card:#ffffff;--card2:#fef3fb;
  --border:#f0d6e8;--border2:#e8c8dc;
  --txt:#4a3048;--txt2:#8a6880;--txt3:#b89aad;
  --pink:#f472b6;--pink-soft:#fce7f3;--pink-glow:rgba(244,114,182,0.2);
  --lavender:#a78bfa;--lav-soft:#ede9fe;--lav-glow:rgba(167,139,250,0.2);
  --mint:#34d399;--mint-soft:#d1fae5;
  --peach:#fb923c;--peach-soft:#ffedd5;
  --sky:#60a5fa;--sky-soft:#dbeafe;
  --rose:#fb7185;--rose-soft:#ffe4e6;
  --yellow:#fbbf24;--yellow-soft:#fef3c7;
  --radius:18px;--font:'Nunito',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 2px 16px rgba(200,140,180,.12);--shadow-lg:0 6px 32px rgba(200,140,180,.2);
}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100%;padding-bottom:86px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,#f9c8e4 1px,transparent 1px);background-size:28px 28px;opacity:.3}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.wordmark{font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--txt)}
.wordmark em{font-style:normal;color:var(--pink)}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow)}
.month-nav button{background:none;border:none;font-size:15px;color:var(--txt2);width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.month-nav button:active{background:var(--pink-soft)}
.month-nav .mlabel{font-size:12px;font-weight:800;color:var(--txt);min-width:62px;text-align:center}
.gear-btn{background:var(--card);border:1.5px solid var(--border);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.gear-btn:active{background:var(--pink-soft)}
.sync-badge{font-size:13px;line-height:1;cursor:default;display:inline-flex;align-items:center}
.sync-badge.syncing{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.addchooser{display:flex;gap:10px;margin-bottom:14px}
.addchooser .seg-opt{flex:1;padding:12px 8px;border:1.5px solid var(--border);border-radius:13px;background:var(--card);font-size:13px}
.addchooser .seg-opt.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.util-wrap{margin:7px 0 2px}
.util-bar{height:13px;border-radius:99px;background:var(--bg2);overflow:hidden}
.util-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.util-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:4px}
.money-subtabs{display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:3px;margin-bottom:14px}
.money-subtabs .seg-opt{padding:8px;border-radius:999px}
.settings-subnav{display:flex;overflow-x:auto;gap:6px;background:var(--bg2);border-radius:999px;padding:3px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.settings-subnav .seg-opt{flex:0 0 auto;padding:8px 14px;border-radius:999px;white-space:nowrap}

/* Cards */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:800;color:var(--txt)}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-toggle{background:var(--pink-soft);border:none;color:var(--pink);font-family:var(--font);font-weight:800;font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer}

/* Health banner */
.health{display:flex;align-items:center;gap:12px;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--border)}
.health-ico{font-size:30px;line-height:1}
.health-title{font-size:14px;font-weight:900;color:var(--txt)}
.health-sub{font-size:11.5px;font-weight:600;color:var(--txt2);margin-top:1px}

/* Person cards */
.person-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.person-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.person-card.patches{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff,#fdf0f8)}
.pc-name{font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.pc-spent{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--txt);letter-spacing:-1px;margin-top:3px}
.pc-remaining{font-size:11px;font-weight:700;margin-top:2px}
.pc-remaining.good{color:var(--mint)}.pc-remaining.warn{color:var(--peach)}.pc-remaining.bad{color:var(--rose)}

/* Totals */
.total-card{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;text-align:center}
.total-eyebrow{font-size:10px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:1px}
.total-amount{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-2px;color:var(--txt);margin:2px 0}
.total-sub{font-size:11px;color:var(--txt2);font-weight:700}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat-lbl{font-size:11px;font-weight:700;color:var(--txt2);display:flex;align-items:center;gap:5px;margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:-.5px}
.stat-val.pink{color:var(--sky)}.stat-val.lav{color:var(--lavender)}
.pip{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Settle-up */
.settle{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1.5px solid var(--yellow);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.settle-msg{font-size:13px;font-weight:800;color:var(--txt);text-align:center;margin-bottom:4px}
.settle-amt{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--peach);text-align:center;letter-spacing:-1px}
.settle-sub{font-size:10.5px;color:var(--txt2);text-align:center;font-weight:700;margin-top:2px}
.settle-btn{width:100%;margin-top:10px;background:var(--peach);color:#fff;border:none;border-radius:12px;padding:10px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer}
.settle-btn:active{transform:scale(.98)}

/* Budget bars */
.bud-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bud-name{font-size:12px;font-weight:700;color:var(--txt)}
.bud-nums{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.track{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:11px}
.track-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.track-fill.safe{background:linear-gradient(90deg,#6ee7b7,#34d399)}
.track-fill.warn{background:linear-gradient(90deg,#fcd34d,#fbbf24)}
.track-fill.danger{background:linear-gradient(90deg,#fda4b8,#fb7185)}
.track-fill.none{background:#e8d5e3}

/* Transaction list */
.tx{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bg2);cursor:pointer}
.tx:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--txt3);font-weight:600;margin-top:1px}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--txt);flex-shrink:0}
.tx-badge{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;margin-left:5px;text-transform:uppercase;letter-spacing:.3px}
.badge-both{background:var(--lav-soft);color:var(--lavender)}
.badge-recur{background:var(--mint-soft);color:#059669}
.badge-card{background:var(--sky-soft);color:var(--sky)}

/* Forms */
.fgroup{margin-bottom:14px}
.flabel{display:block;font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.finput{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--font);font-size:15px;font-weight:600;color:var(--txt);outline:none}
.finput:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-glow)}
.finput.big{font-family:var(--mono);font-size:26px;font-weight:500;text-align:center;letter-spacing:-1px}
textarea.finput{resize:none;min-height:60px}
.cpill-wrap{display:flex;flex-wrap:wrap;gap:7px}
.cpill{display:flex;align-items:center;gap:5px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;transition:all .15s}
.cpill.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.cpill .ci{font-size:14px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg-opt{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12px;font-weight:800;color:var(--txt2);cursor:pointer;transition:all .15s;min-width:60px}
.seg-opt.on{background:var(--card);color:var(--pink);box-shadow:var(--shadow)}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--pink),var(--lavender));color:#fff;border:none;border-radius:14px;padding:15px;font-family:var(--font);font-weight:900;font-size:15px;cursor:pointer;box-shadow:var(--shadow-lg)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.6}
.btn-ghost{width:100%;background:var(--card);color:var(--txt2);border:1.5px solid var(--border);border-radius:12px;padding:12px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}
.btn-danger{width:100%;background:var(--rose-soft);color:var(--rose);border:1.5px solid var(--rose);border-radius:12px;padding:12px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}

/* Quick adds */
.qa-row{display:flex;flex-wrap:wrap;gap:8px}
.qa-btn{flex:1 1 calc(33.33% - 6px);min-width:88px;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s}
.qa-btn:active{transform:scale(.96);background:var(--pink-soft)}
.qa-ico{font-size:19px;display:block;margin-bottom:3px}
.qa-name{font-size:11px;font-weight:800;color:var(--txt);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-amt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--txt3);display:block;margin-top:2px}
.disclose{width:100%;background:none;border:none;color:var(--txt2);font-family:var(--font);font-size:12px;font-weight:800;cursor:pointer;padding:8px;margin-bottom:6px}
.catfind{margin-bottom:8px;padding:9px 12px;font-size:13px}
.catnone{width:100%;font-size:12px;color:var(--txt3);font-weight:600;margin-bottom:6px;line-height:1.4}
.catnone span{color:var(--pink);cursor:pointer;text-decoration:underline}
.actfind{margin-bottom:8px;padding:10px 13px;font-size:14px}
.act-sum{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--txt2);padding:2px 2px 0}
/* Needs-attention list */
.attn{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1.5px solid var(--border)}
.attn:last-of-type{border-bottom:none}
.attn-ico{font-size:19px;width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--bg2)}
.attn-now .attn-ico{background:var(--peach-soft)}
.attn-soon .attn-ico{background:var(--yellow-soft)}
.attn-setup .attn-ico{background:var(--sky-soft)}
.attn-body{flex:1;min-width:0}
.attn-title{font-size:13px;font-weight:800;color:var(--txt);line-height:1.3}
.attn-sub{font-size:11px;font-weight:600;color:var(--txt2);line-height:1.4;margin-top:2px}
.attn-cta{flex:0 0 auto;align-self:center;background:var(--card2);border:1.5px solid var(--border);border-radius:9px;padding:7px 10px;font-family:var(--font);font-size:11px;font-weight:800;color:var(--txt);cursor:pointer;white-space:nowrap}
.attn-cta:active{transform:scale(.96)}
.attn-dot{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:5px;border-radius:999px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;text-align:center}
.attn-clear{display:flex;align-items:center;gap:11px}
.attn-clear-h{font-size:13px;font-weight:800;color:var(--txt)}
.attn-clear-s{font-size:11px;font-weight:600;color:var(--txt2);margin-top:1px}
.pv-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pv-back{background:var(--card);border:1.5px solid var(--border);border-radius:11px;width:34px;height:34px;font-size:19px;font-weight:800;color:var(--txt2);cursor:pointer;line-height:1}
.pv-who{font-size:19px;font-weight:900;color:var(--txt)}
.pv-dds{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.pv-dd{flex:1 1 30%;min-width:104px;padding:9px 8px;font-size:12px}
.pv-note{font-size:11px;font-weight:600;color:var(--txt2);text-align:center;margin-top:9px}
.pv-cat{margin-bottom:11px;cursor:pointer}
.debt-note{background:var(--peach-soft);border-radius:11px;padding:9px 11px;font-size:11.5px;font-weight:600;color:var(--txt);line-height:1.45;margin-bottom:10px}

/* Goals */
.goal-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.goal-name{font-size:14px;font-weight:800;color:var(--txt)}
.goal-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:99px;margin-top:3px;display:inline-block}
.gt-savings{background:var(--mint-soft);color:#059669}
.gt-debt{background:var(--rose-soft);color:var(--rose)}
.goal-pct{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--txt2)}
.goal-nums{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:11px}
.goal-actions{display:flex;gap:7px;margin-top:11px}
.goal-actions button{flex:1;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px;font-family:var(--font);font-weight:800;font-size:11px;color:var(--txt2);cursor:pointer}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px}
.nav-ico{font-size:21px;filter:grayscale(1) opacity(.45);transition:all .15s}
.nav-lbl{font-size:9px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px}
.nav-item.on .nav-ico{filter:none;transform:translateY(-1px)}
.nav-item.on .nav-lbl{color:var(--pink)}
.nav-add{background:linear-gradient(135deg,var(--pink),var(--lavender));width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:var(--shadow-lg);font-size:26px;color:#fff;border:3px solid var(--bg);cursor:pointer}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(74,48,72,.4);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));width:100%;max-width:480px;box-shadow:0 -8px 40px rgba(0,0,0,.2);animation:slideUp .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{font-size:17px;font-weight:900;text-align:center;margin-bottom:6px}
.modal-sub{font-size:12.5px;color:var(--txt2);text-align:center;font-weight:600;margin-bottom:16px}
.modal-cancel{width:100%;background:var(--bg2);border:none;color:var(--txt2);border-radius:12px;padding:13px;font-family:var(--font);font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}

/* Misc */
.seed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--mint-soft),var(--sky-soft));border:1.5px solid var(--mint);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.seed-text{font-size:12.5px;font-weight:800;color:var(--txt)}
.seed-text small{display:block;font-size:10.5px;font-weight:600;color:var(--txt2);margin-top:1px}
.seed-go{background:var(--mint);color:#fff;border:none;border-radius:10px;padding:9px 13px;font-family:var(--font);font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}
.empty{text-align:center;padding:34px 16px;color:var(--txt3)}
.empty-ico{font-size:38px;margin-bottom:8px}
.empty-h{font-size:14px;font-weight:800;color:var(--txt2);margin-bottom:3px}
.empty-s{font-size:12px;font-weight:600}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:200;box-shadow:var(--shadow-lg);animation:toastIn .3s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.section-title{font-size:12px;font-weight:900;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin:4px 2px 10px}
.chart-wrap{position:relative;height:200px;margin-top:6px}
.recap-stat{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bg2)}
.recap-stat:last-child{border-bottom:none}
.recap-lbl{font-size:13px;font-weight:700;color:var(--txt2)}
.recap-val{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--txt)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px}
.loading-cat{font-size:44px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* Cash flow (sankey) */
.cf-card{background:linear-gradient(150deg,#3a2338,#241426);border:1.5px solid #5a3a55;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-lg)}
.cf-eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;color:#c9a3bd;text-transform:uppercase;letter-spacing:2.5px}
.cf-svg{width:100%;height:auto;display:block;margin-top:10px}
.cf-lbl{font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;fill:#fdf6f9}
.cf-amt{font-family:'DM Mono',monospace;font-size:9.5px;fill:#c9a3bd}

<body>
<div id="app"></div>
<div id="toast-host"></div>
<script>
// ─── Constants ──────────────────────────────────────────────────────────────
const LS = {
  people:'pp:people', accounts:'pp:accounts', categories:'pp:categories',
  recurring:'pp:recurring', goals:'pp:goals', debts:'pp:debts',
  debtPayments:'pp:debtPayments', contributions:'pp:contributions',
  cardCharges:'pp:cardCharges', transactions:'pp:transactions', settings:'pp:settings',
  insights:'pp:insights', ledger:'pp:ledger'
};
const BOTH='both';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ACCT_TYPES = {checking:'🏦 Checking',savings:'🌱 Savings',hysa:'🌱 High-yield savings',investment:'📈 Investment / Roth IRA',retirement:'🌅 Retirement / 401k',credit:'💳 Credit card'};
const ACCT_ICONS = {checking:'🏦',savings:'🌱',hysa:'🌱',investment:'📈',retirement:'🌅',credit:'💳'};
const FREQS = {weekly:'Weekly',biweekly:'Every 2 weeks',semimonthly:'Twice a month',monthly:'Monthly'};
const FALLBACK_COLORS=['#93c5fd','#fdba74','#c4b5fd','#6ee7b7','#fde68a','#f0abfc','#a5f3fc','#fca5a5'];
const CARD_LIMIT_DEFAULT = 1000;

// ─── Helpers ────────────────────────────────────────────────────────────────
function uuid(){ return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);})); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); } // safe for embedding inside onclick="...('...')"
function parseAmt(v){ if(typeof v==='number')return v; return parseFloat(String(v||'').replace(/[$,]/g,''))||0; }
const f$ = n => '$'+(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0 = n => (n<0?'-':'')+'$'+Math.round(Math.abs(+n||0)).toLocaleString('en-US');

// ─── Storage layer ────────────────────────────────────────────────────────────
function loadKey(key,fallback){ try{ const v=JSON.parse(localStorage.getItem(key)); return v==null?fallback:v; }catch(e){ return fallback; } }
const D = {}; // in-memory mirror of all localStorage data
function commit(name){ localStorage.setItem(LS[name], JSON.stringify(D[name])); }

function seedPeople(){ return [{id:'ateeq',name:'Ateeq',emoji:'🧔'},{id:'celeste',name:'Celeste',emoji:'👩'}]; }
function seedCategories(){
  return [
    {id:uuid(),name:'Groceries',icon:'🛒',color:'#93c5fd',budget:600,kind:'flex'},
    {id:uuid(),name:'Dining Out',icon:'🍽️',color:'#fdba74',budget:200,kind:'flex'},
    {id:uuid(),name:'Entertainment',icon:'🎮',color:'#c4b5fd',budget:150,kind:'flex'},
    {id:uuid(),name:'Transportation',icon:'🚗',color:'#6ee7b7',budget:100,kind:'flex'},
    {id:uuid(),name:'Utilities',icon:'💡',color:'#fde68a',budget:150,kind:'bill'},
    {id:uuid(),name:'Health',icon:'🏥',color:'#fda4b8',budget:100,kind:'flex'},
    {id:uuid(),name:'Shopping',icon:'🛍️',color:'#f0abfc',budget:150,kind:'flex'},
    {id:uuid(),name:'Personal/Misc',icon:'📦',color:'#f9a8d4',budget:100,kind:'flex'},
    {id:uuid(),name:"Patches' Expenses",icon:'🐱',color:'#fbcfe8',budget:75,kind:'flex'},
  ];
}
function seedSettings(){
  return {budgetsOpen:true, strategy:'snowball', person:'All', moneyTab:'overview', settingsTab:'accounts',
    milestones:{}, moneyDate:{}, netWorthSnapshots:{}};
}

function initData(){
  D.people = loadKey(LS.people, null) || seedPeople();
  D.accounts = loadKey(LS.accounts, null) || [];
  D.categories = loadKey(LS.categories, null) || seedCategories();
  D.recurring = loadKey(LS.recurring, []);
  D.goals = loadKey(LS.goals, []);
  D.debts = loadKey(LS.debts, []);
  D.debtPayments = loadKey(LS.debtPayments, []);
  D.contributions = loadKey(LS.contributions, []);
  D.cardCharges = loadKey(LS.cardCharges, []);
  D.transactions = loadKey(LS.transactions, []);
  D.settings = loadKey(LS.settings, null) || seedSettings();
  D.insights = loadKey(LS.insights, null) || {prevCategoryTotals:{}, monthly:[]};
  D.ledger = loadKey(LS.ledger, []);   // every month, for the per-person views
  Object.keys(LS).forEach(k=>commit(k));
}

// ─── Category helpers (single live source — fixes "categories don't persist") ─
function getCategories(){ return D.categories; }
function catByName(name){ return D.categories.find(c=>c.name===name); }
function catIcon(name){ const c=catByName(name); return c?c.icon:'📦'; }
function catColor(name){ const c=catByName(name); return c?c.color:'#f9a8d4'; }
function catBudget(name){ const c=catByName(name); return c?(+c.budget||0):0; }
function catKind(name){ const c=catByName(name); return c&&c.kind==='bill'?'bill':'flex'; }
function flexCategories(){ return D.categories.filter(c=>c.kind!=='bill'); }
function billCategories(){ return D.categories.filter(c=>c.kind==='bill'); }

// ─── People helpers ───────────────────────────────────────────────────────────
function personById(id){ return D.people.find(p=>p.id===id); }
function personName(id){ if(id===BOTH)return 'Both'; const p=personById(id); return p?p.name:'—'; }
function personEmoji(id){ if(id===BOTH)return '👫'; const p=personById(id); return p?p.emoji:'🙂'; }
function payerOptions(){ return [...D.people, {id:BOTH,name:'Both',emoji:'👫'}]; }
function cardholderId(){ const c=cards()[0]; if(c&&c.owner&&c.owner!=='shared') return c.owner; return D.people[0]?D.people[0].id:'ateeq'; }
// A charge belongs to whoever holds that specific card - with more than one
// card on the account, assuming the first person would misattribute spending.
function cardOwnerId(accountId){ const c=acctById(accountId); return (c&&c.owner&&c.owner!=='shared')?c.owner:cardholderId(); }
function fromServerPerson(name){ name=String(name||'').trim(); if(name==='Celeste') return 'celeste'; if(name==='Both') return BOTH; return 'ateeq'; }
function toServerPerson(id){ if(id===BOTH) return 'Both'; const p=personById(id); return p?p.name:'Ateeq'; }
function fromServerOwner(name){ name=String(name||'').trim(); if(name==='Celeste') return 'celeste'; if(name==='Ateeq') return 'ateeq'; return 'shared'; }
function toServerOwner(id){ if(!id||id==='shared') return 'Both'; return toServerPerson(id); }

// ─── Sync engine: Google Sheets is the source of truth; localStorage is the ───
// ─── offline cache (last-loaded snapshot) + a queue of writes made while offline.
const DEFAULT_SERVER_URL = 'https://script.google.com/macros/s/AKfycbxle4CS8BPQIjudoTNofO-L2Rx3zyucyZYCPJ16-bfKgU7g_dTSPqtcJjtozhpuWKf3dQ/exec';
const SERVERURL_LS='pp:serverUrl', QUEUE_LS='pp:pendingWrites', DIDSETUP_LS='pp:didSetup';
function getServerUrl(){ return localStorage.getItem(SERVERURL_LS)||DEFAULT_SERVER_URL; }
function setServerUrl(v){ if(v&&v.trim())localStorage.setItem(SERVERURL_LS,v.trim()); else localStorage.removeItem(SERVERURL_LS); }

function pendingQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_LS)||'[]'); }catch(e){ return []; } }
function savePendingQueue(q){ localStorage.setItem(QUEUE_LS, JSON.stringify(q)); }
function queueWrite(action,params){ const q=pendingQueue(); q.push({qid:uuid(),action,params,ts:Date.now()}); savePendingQueue(q); }

async function apiCall(action,params){
  const url=getServerUrl();
  const qp=Object.assign({action:action},params||{});
  const clean={}; Object.keys(qp).forEach(k=>{ if(qp[k]!=null) clean[k]=String(qp[k]); });
  const resp=await fetch(url+'?'+new URLSearchParams(clean));
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const data=await resp.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

// Fire a write in the background: already-applied locally (client-generated id),
// so success/failure never blocks the UI — failure just queues it for later.
async function syncOp(action,params){
  try{
    const r=await apiCall(action,params);
    setSyncStatus('online');
    return r;
  }catch(e){
    setSyncStatus('offline');
    queueWrite(action,params);
    return null;
  }
}

function setSyncStatus(s){ if(S.syncStatus!==s){ S.syncStatus=s; render(); } else S.syncStatus=s; }

async function flushQueue(){
  let q=pendingQueue();
  if(!q.length) return true;
  S.syncing=true; render();
  while(q.length){
    const item=q[0];
    try{ await apiCall(item.action,item.params); }
    catch(e){ setSyncStatus('offline'); S.syncing=false; render(); return false; }
    q.shift(); savePendingQueue(q);
  }
  setSyncStatus('online');
  S.syncing=false;
  return true;
}

// ─── Server <-> client field mapping ───────────────────────────────────────────
function fromServerTx(t){
  return { id:t.ID, date:t.Date, desc:t.Description, category:t.Category, payer:fromServerPerson(t.PaidBy),
    amount:+t.Amount||0, kind:'expense', need:(t.Need||'need').toLowerCase()==='want'?'want':'need',
    sub:String(t.Sub||'').toLowerCase()==='yes', notes:t.Notes||'', txType:t.TxType==='Recurring'?'recurring':'one-time',
    cardSettled: String(t.Notes||'').indexOf('CARD_SETTLED')>-1 };
}
function toServerTxParams(t){
  return { id:t.id, date:t.date, description:t.desc, category:t.category, paidBy:toServerPerson(t.payer),
    amount:t.amount, txType:t.txType==='recurring'?'Recurring':'One-time', notes:t.notes||'', need:t.need||'', sub:t.sub?'yes':'' };
}
function fromServerIncome(i){
  return { id:i.ID, date:i.Date, desc:i.Description, category:'', payer:fromServerPerson(i.Source), amount:+i.Amount||0,
    kind:'income', notes:i.Notes||'', txType:'one-time' };
}
function toServerIncomeParams(t){ return { id:t.id, date:t.date, description:t.desc, source:toServerPerson(t.payer), amount:t.amount, notes:t.notes||'' }; }
function fromServerAcct(a){ return { id:a.ID, name:a.Name, owner:fromServerOwner(a.Owner), type:a.Type||'checking', balance:+a.Balance||0, apy:+a.APY||0, lastReconciled:a.LastReconciled||'', limit:+a.Limit||0 }; }
function fromServerDebt(d){ return { id:d.ID, name:d.Name, owner:fromServerOwner(d.Owner), startBalance:+d.StartBalance||0, balance:+d.Balance||0, apr:+d.APR||0, minPayment:+d.MinPayment||0, highPriority:!!d.HighPriority, created:d.Created||'' }; }
function fromServerDebtPayment(p){ return { id:p.ID, debtId:p.DebtID, date:p.Date, amount:+p.Amount||0, payer:fromServerPerson(p.PaidBy), notes:'' }; }
function fromServerGoal(g){ return { id:g.ID, name:g.Name, target:+g.Target||0, saved:+g.Saved||0, targetDate:g.TargetDate||'', notes:g.Notes||'', created:'' }; }
function fromServerFlow(f){ return { id:f.ID, name:f.Name, kind:'transfer', category:'', amount:+f.Amount||0, payer:fromServerOwner(f.Owner),
  frequency:f.Frequency||'monthly', dayOfMonth:f.DayOfMonth||1, destType:f.GoalID?'goal':'account', destId:f.GoalID||f.AccountID||'',
  flowType:f.FlowType==='divest'?'divest':'invest', active:f.Active!==false, lastRun:f.LastRun||'' }; }
function fromServerBill(b){ return { id:b.ID, name:b.Description, kind:'bill', category:b.Category, amount:+b.Amount||0, payer:fromServerPerson(b.PaidBy),
  frequency:b.Frequency||'monthly', dayOfMonth:b.DayOfMonth||1, destType:'', destId:'', flowType:'', active:b.Active!==false, lastRun:b.LastRun||'' }; }
function fromServerContrib(c){ return { id:c.ID, date:c.Date, flowType:c.FlowType==='divest'?'divest':'invest', amount:+c.Amount||0,
  accountId:c.AccountID||'', goalId:c.GoalID||'', payer:fromServerOwner(c.Owner), notes:c.Notes||'', source:c.Source||'manual' }; }
function fromServerCharge(c){ return { id:c.ID, accountId:c.AccountID, date:c.Date, desc:c.Description, category:c.Category, payer:fromServerPerson(c.PaidBy), amount:+c.Amount||0, settled:!!c.Settled, notes:'' }; }
function fromServerCat(c){ return { id:c.ID, name:c.Name, icon:c.Icon||'📦', color:c.Color||'#f9a8d4', budget:+c.Budget||0, kind:c.Kind==='bill'?'bill':'flex' }; }

function applyServerData(data){
  D.transactions=[].concat((data.transactions||[]).map(fromServerTx), (data.income||[]).map(fromServerIncome));
  D.accounts=(data.accounts||[]).map(fromServerAcct);
  D.debts=(data.debts||[]).map(fromServerDebt);
  D.debtPayments=(data.payments||[]).map(fromServerDebtPayment);
  D.goals=(data.goals||[]).map(fromServerGoal);
  D.recurring=[].concat((data.recurringBills||[]).map(fromServerBill), (data.flows||[]).map(fromServerFlow));
  D.contributions=(data.contributions||[]).map(fromServerContrib);
  D.cardCharges=(data.cardCharges||[]).map(fromServerCharge);
  if(data.categories && data.categories.length) D.categories=data.categories.map(fromServerCat);
  if(data.insights) D.insights={prevCategoryTotals:data.insights.prevCategoryTotals||{}, monthly:data.insights.monthly||[]};
  ['transactions','accounts','debts','debtPayments','goals','recurring','contributions','cardCharges','categories','insights'].forEach(k=>commit(k));
}

// Loads the currently-selected month. If there's an unsynced queue we trust the
// local cache (which already has those optimistic edits baked in) instead of
// overwriting it with a fresh fetch — the queue drains first, then the next
// load is safe to treat the server as canonical again.
async function loadForMonth(){
  S.syncStatus = navigator.onLine===false ? 'offline' : (S.syncStatus||'unknown');
  render();
  const q=pendingQueue();
  if(q.length){
    // try to drain first; only refetch once fully caught up
    const drained=await flushQueue();
    if(!drained){ render(); return; } // still offline/queued — keep showing cached D.*
  }
  if(!localStorage.getItem(DIDSETUP_LS)){
    try{ await apiCall('runSetup',{}); localStorage.setItem(DIDSETUP_LS,'1'); }catch(e){ /* will retry next load */ }
  }
  try{
    const data=await apiCall('getAll',{month:S.month,year:S.year});
    applyServerData(data);
    setSyncStatus('online');
  }catch(e){
    setSyncStatus('offline');
    // fall back to whatever's cached in localStorage from the last successful load
  }
  render();
}

// ─── Account helpers ──────────────────────────────────────────────────────────
function acctById(id){ return D.accounts.find(a=>a.id===id); }
function goalById(id){ return D.goals.find(g=>g.id===id); }
function cards(){ return D.accounts.filter(a=>a.type==='credit'); }
function spendAccounts(){ return D.accounts.filter(a=>a.type!=='credit'); }

// ─── UI state (ephemeral, not persisted) ──────────────────────────────────────
const now0=new Date();
const S = {
  view:'home', month:now0.getMonth()+1, year:now0.getFullYear(),
  modal:null,
  addMode:'expense', addDetails:false, focusAmount:false, catFilter:'', refocus:null,

// ─── Month filter ─────────────────────────────────────────────────────────────
function inMonth(dateStr,m,y){
  const s=String(dateStr||''); const p=s.split('-');
  if(p.length===3 && +p[0]) return +p[0]===y && +p[1]===m;
  const d=new Date(s); // tolerate stray non-ISO dates (e.g. "7/31/2026")
  return !isNaN(d) && d.getFullYear()===y && d.getMonth()+1===m;
}
function txForMonth(){ return D.transactions.filter(t=>inMonth(t.date,S.month,S.year)); }
function contribsForMonth(){ return D.contributions.filter(c=>inMonth(c.date,S.month,S.year)); }
function debtPaysForMonth(){ return D.debtPayments.filter(p=>inMonth(p.date,S.month,S.year)); }

// ─── Computations ─────────────────────────────────────────────────────────────
function totalExpenses(){ return txForMonth().filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0); }
function catTotals(){
  const o={};
  txForMonth().filter(t=>t.kind==='expense').forEach(t=>{ const c=t.category||'Personal/Misc'; o[c]=(o[c]||0)+t.amount; });
  return o;
}
function personTotals(){
  const totals={}; D.people.forEach(p=>totals[p.id]=0);
  txForMonth().filter(t=>t.kind==='expense').forEach(t=>{
    if(t.payer===BOTH){ D.people.forEach(p=>totals[p.id]+=t.amount/D.people.length); }
    else if(totals[t.payer]!=null) totals[t.payer]+=t.amount;
  });
  return totals;
}
function settleUp(){
  // ateeqNet = what Ateeq covered out of pocket minus what he owed (only meaningful for 2-person households)
  if(D.people.length<2) return {net:0,aId:null,bId:null};
  const aId=D.people[0].id, bId=D.people[1].id;
  let aPaid=0,aOwes=0;
  txForMonth().filter(t=>t.kind==='expense').forEach(t=>{
    const a=t.amount;
    if(t.payer===BOTH){ aPaid+=a/2; aOwes+=a/2; }
    else if(t.payer===aId){ aPaid+=a; aOwes+=a; }
  });
  return {net:aPaid-aOwes, aId, bId};
}
function incomeTotals(){
  const totals={}; D.people.forEach(p=>totals[p.id]=0); let total=0;
  txForMonth().filter(t=>t.kind==='income').forEach(t=>{
    total+=t.amount;
    if(t.payer===BOTH){ D.people.forEach(p=>totals[p.id]+=t.amount/D.people.length); }
    else if(totals[t.payer]!=null) totals[t.payer]+=t.amount;
  });
  return {byPerson:totals, total};
}
function monthHealth(){
  const exp=totalExpenses(), inc=incomeTotals().total, net=inc-exp;
  if(inc===0 && exp===0) return {emoji:'🐱',title:'Fresh start',sub:'Log something to get going',score:'neutral'};
  if(net>=inc*0.2 && inc>0) return {emoji:'😻',title:'Crushing it',sub:`Saved ${f0(net)} so far this month`,score:'great'};
  if(net>=0) return {emoji:'😺',title:'On track',sub:`${f0(net)} left of this month's income`,score:'good'};
  if(net>-inc*0.15) return {emoji:'🙀',title:'Cutting it close',sub:`${f0(Math.abs(net))} over income`,score:'warn'};
  return {emoji:'😿',title:'Over budget',sub:`${f0(Math.abs(net))} more spent than earned`,score:'bad'};
}
function goalPct(g){ const saved=+g.saved||0, target=+g.target||0; return target>0?Math.min((saved/target)*100,100):0; }
function debtPctPaid(d){ return d.startBalance>0?Math.min(((d.startBalance-d.balance)/d.startBalance)*100,100):0; }
function daysUntil(d){ if(!d)return null; const diff=Math.ceil((new Date(d)-new Date())/864e5); return diff>0?diff:null; }

// ─── Recurring math ────────────────────────────────────────────────────────────
// Auto-logging recurring bills/flows now happens server-side (Apps Script daily
// triggers) so it runs whether or not anyone has the app open, and never double-
// logs across two people's devices. The client just displays what the server has run.
function flowMonthly(amount,freq){
  switch(freq){ case 'weekly': return amount*52/12; case 'biweekly': return amount*26/12; case 'semimonthly': return amount*2; default: return amount; }
}

// ─── Transactions (expense / income / transfer) ───────────────────────────────
function addTransactionRaw(t){ t.id=t.id||uuid(); D.transactions.push(t); commit('transactions'); return t; }
function deleteTransactionById(id){ D.transactions=D.transactions.filter(t=>t.id!==id); commit('transactions'); }

// ─── Contributions (invest = money into account/goal, divest = out) ──────────
function addContributionRaw(c){
  c.id=c.id||uuid();
  const amt=+c.amount||0, sign=c.flowType==='divest'?-1:1;
  if(c.accountId){ const a=acctById(c.accountId); if(a) a.balance=(+a.balance||0)+sign*amt; }
  if(c.goalId){ const g=goalById(c.goalId); if(g){ if(c.flowType==='divest') g.saved=Math.max((+g.saved||0)-amt,0); else g.saved=(+g.saved||0)+amt; } }
  D.contributions.push(c);
  commit('contributions'); commit('accounts'); commit('goals');
  return c;
}

// ─── Credit card queue (FIFO settle) ─────────────────────────────────────────
function chargeCard(accountId,{date,desc,category,payer,amount,notes}){
  const card=acctById(accountId); if(!card) return null;
  const amt=+amount||0;
  card.balance=(+card.balance||0)+amt;
  const charge={id:uuid(),accountId,date:date||todayStr(),desc,category,payer:payer||'ateeq',amount:amt,settled:false,notes:notes||''};
  D.cardCharges.push(charge);
  commit('accounts'); commit('cardCharges');
  return charge;
}
function payCard(accountId,amount,fromAccountId){
  const card=acctById(accountId); if(!card) return {error:'Card not found'};
  const bal=+card.balance||0;
  const applied=Math.min(+amount||0,bal);
  card.balance=bal-applied;
  if(fromAccountId){ const src=acctById(fromAccountId); if(src) src.balance=(+src.balance||0)-applied; }
  let remaining=applied, settledCount=0;
  const unsettled=D.cardCharges.filter(c=>c.accountId===accountId && !c.settled).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for(const charge of unsettled){
    if(remaining<=0.001) break;
    if(charge.amount<=remaining+0.001){
      charge.settled=true;
      addTransactionRaw({date:charge.date,desc:charge.desc,category:charge.category,payer:charge.payer,amount:charge.amount,kind:'expense',need:'need',sub:false,notes:'Card charge — taken as charged',txType:'one-time',cardSettled:true});
      remaining-=charge.amount; settledCount++;
    } else {
      addTransactionRaw({date:charge.date,desc:charge.desc+' (partial)',category:charge.category,payer:charge.payer,amount:remaining,kind:'expense',need:'need',sub:false,notes:'Card charge — taken as charged',txType:'one-time',cardSettled:true});
      charge.amount-=remaining;
      remaining=0; settledCount++;
    }
  }
  commit('accounts'); commit('cardCharges');
  return {success:true, paid:applied, newBalance:card.balance, settled:settledCount};
}

// ─── Plan ("every dollar has a job") ─────────────────────────────────────────
// "Every dollar has a job", written as an equation a human can actually read:
// income − bills − debt minimums − auto-savings − everyday budgets = left over.
// Bills come from the recurring list (real commitments, converted to a monthly
// equivalent), not from category budgets, so a bill never counts twice.
function planTotals(){
  const income=incomeTotals().total;
  const bills=D.recurring.filter(r=>r.active!==false && r.kind==='bill').reduce((s,r)=>s+flowMonthly(+r.amount||0,r.frequency),0);
  const savings=D.recurring.filter(r=>r.active!==false && r.kind==='transfer' && (r.flowType||'invest')==='invest').reduce((s,r)=>s+flowMonthly(+r.amount||0,r.frequency),0);
  const debtMins=D.debts.filter(d=>d.balance>0).reduce((s,d)=>s+(+d.minPayment||0),0);
  const flexBudget=flexCategories().reduce((s,c)=>s+(+c.budget||0),0);
  return {income,bills,savings,debtMins,flexBudget,leftover:income-bills-savings-debtMins-flexBudget};
}
// Everyday-spending money math for the current view month.
// Spend in a category nobody's defined counts as everyday, so nothing hides.
function flexTotals(){
  const cats=catTotals();
  const budget=flexCategories().reduce((s,c)=>s+(+c.budget||0),0);
  const known=new Set(D.categories.map(c=>c.name));
  let spent=flexCategories().reduce((s,c)=>s+(cats[c.name]||0),0);
  Object.keys(cats).forEach(k=>{ if(!known.has(k)) spent+=cats[k]; });
  return {budget,spent,left:budget-spent};
}

// ─── Whole-history ledger ────────────────────────────────────────────────────
// The app normally holds one month. The per-person view asks for "last 3 months"
// and "this year", so it pulls every row once and caches it. Offline it falls
// back to the month already in memory rather than showing an empty screen.
async function loadLedger(force){
  if(D.ledger.length && !force) return D.ledger;
  S.pv.loading=true;
  try{
    const data=await apiCall('getLedger',{});
    D.ledger=[].concat((data.transactions||[]).map(fromServerTx),(data.income||[]).map(fromServerIncome));
    commit('ledger');
  }catch(e){ /* keep whatever is cached; ledgerRows() degrades to this month */ }
  S.pv.loading=false; render();
  return D.ledger;
}
function ledgerRows(){ return D.ledger.length?D.ledger:D.transactions; }

const PERIODS=[['month','This month'],['last','Last month'],['3mo','Last 3 months'],
               ['6mo','Last 6 months'],['ytd','This year'],['all','All time']];
const SORTS=[['amount-desc','Biggest first'],['amount-asc','Smallest first'],
             ['date-desc','Newest first'],['date-asc','Oldest first'],['cat','By category']];
function periodRange(p){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const first=(yy,mm)=>iso(new Date(yy,mm,1));
  const lastDay=(yy,mm)=>iso(new Date(yy,mm+1,0));
  if(p==='month')  return {from:first(y,m),        to:lastDay(y,m)};
  if(p==='last')   return {from:first(y,m-1),      to:lastDay(y,m-1)};
  if(p==='3mo')    return {from:first(y,m-2),      to:lastDay(y,m)};
  if(p==='6mo')    return {from:first(y,m-5),      to:lastDay(y,m)};
  if(p==='ytd')    return {from:first(y,0),        to:lastDay(y,m)};
  return {from:'0000-01-01', to:'9999-12-31'};
}
function periodMonths(p){ return p==='month'?1:p==='last'?1:p==='3mo'?3:p==='6mo'?6:
  p==='ytd'?(new Date().getMonth()+1):Math.max(new Set(ledgerRows().map(t=>String(t.date).slice(0,7))).size,1); }

// ─── What needs your attention ───────────────────────────────────────────────
// One prioritised list, doing the job an onboarding wizard and a nag system
// would each do separately. Setup gaps ("no accounts yet") and live problems
// ("$1,100 of debt minimums committed, nothing logged this month") are the same
// kind of thing: a specific next action. A wizard would be dead weight for a
// household already running; this stays useful in both states.
//
// Only ever computed for the month you are actually in - "attention" on a month
// that already closed is just noise you cannot act on.
function isCurrentMonth(){ const n=new Date(); return S.month===n.getMonth()+1 && S.year===n.getFullYear(); }
function attentionItems(){
  if(!isCurrentMonth()) return [];
  const out=[], day=new Date().getDate();
  const push=(o)=>out.push(o);

  // ── Setup gaps ──
  if(!D.accounts.length) push({id:'no-accounts',sev:'setup',tab:'accounts',icon:'🏦',
    title:'Add where your money lives',
    sub:'Checking, savings, credit cards. Net worth and safe-to-spend need these to mean anything.',
    action:"goSettings('accounts')", cta:'Add accounts'});
  if(D.categories.length && !flexCategories().some(c=>+c.budget>0)) push({id:'no-budgets',sev:'setup',tab:'categories',icon:'🗂',
    title:'Set a budget on your everyday categories',
    sub:'Without one there is no "left to spend" number — just a running total.',
    action:"goSettings('categories')", cta:'Set budgets'});
  if(!D.recurring.filter(r=>r.active!==false).length) push({id:'no-recurring',sev:'setup',tab:'recurring',icon:'🔁',
    title:'Add your recurring bills',
    sub:'Rent, utilities, subscriptions. Once they are here they log themselves and stop eating your everyday money by surprise.',
    action:"goSettings('recurring')", cta:'Add recurring'});

  // ── Live problems ──
  // Debt. "Nothing logged this month" was too soft when nothing has EVER been
  // logged - it implied a bookkeeping slip rather than a balance nobody has
  // touched. Say which it is, and for how long.
  const openDebts=D.debts.filter(d=>(+d.balance||0)>0);
  const debtMins=openDebts.reduce((s,d)=>s+(+d.minPayment||0),0);
  const debtOwed=openDebts.reduce((s,d)=>s+(+d.balance||0),0);
  const paidThisMonth=debtPaysForMonth().reduce((s,p)=>s+(+p.amount||0),0);
  const owners=[...new Set(openDebts.map(d=>personName(d.owner)))];
  if(openDebts.length && !D.debtPayments.length){
    const ms=openDebts.map(monthsUntouched).filter(m=>m!=null);
    const longest=ms.length?Math.max.apply(null,ms):null;
    push({id:'debt-never-paid',sev:'now',tab:null,icon:'💸',
      title:`${f0(debtOwed)} of debt, no payment ever logged`,
      sub:`${owners.join(' & ')}${longest?` · untouched for ${longest} month${longest===1?'':'s'}`:''}. Balances are not moving and payoff dates stay hidden until there is a real payment to forecast from.`,
      action:"go('goals')", cta:'Go to Goals'});
  } else if(debtMins>0 && paidThisMonth<debtMins && day>=5){
    push({id:'debt-mins',sev:'now',tab:null,icon:'💸',
      title:paidThisMonth>0?`${f0(debtMins-paidThisMonth)} of this month's debt minimums still unlogged`
                           :`${f0(debtMins)} in debt minimums, nothing logged this month`,
      sub:`Committed every month${owners.length?' · '+owners.join(' & '):''}. If you have paid, log it so the payoff dates are real; if not, this is the most expensive thing on the list.`,
      action:"go('goals')", cta:'Go to Goals'});
  }
  // Every projection is computed from the rate. At 0% the app silently models
  // frozen balances, which for federal loans is simply wrong.
  const noApr=debtsNeedingApr();
  if(noApr.length) push({id:'no-apr',sev:'soon',tab:null,icon:'📈',
    title:`${noApr.length} debt${noApr.length===1?'':'s'} with no interest rate set`,
    sub:'Shown as 0%, so the app treats these balances as frozen. Add the real rates and the payoff maths stops flattering you.',
    action:"go('goals')", cta:'Add rates'});
  // Over-budget everyday categories, worst first. Framed as a number, not a scolding.
  const cats=catTotals();
  flexCategories().filter(c=>+c.budget>0 && (cats[c.name]||0)>+c.budget)
    .map(c=>({c,over:(cats[c.name]||0)-(+c.budget||0)}))
    .sort((a,b)=>b.over-a.over).slice(0,2)
    .forEach(({c,over})=>push({id:'over-'+c.name,sev:'soon',tab:'categories',icon:c.icon,
      title:`${c.name} is ${f0(over)} over`,
      sub:`${f0(cats[c.name]||0)} spent against a ${f0(c.budget)} budget. Either the budget is wrong or the habit is — both are fixable.`,
      action:`S.act={q:'',cat:'${jsEsc(c.name)}',kind:'expense'};S.moneyTab='activity';go('money')`, cta:'See the spending'}));
  // Utilisation is a credit-score input, not just a balance.
  cards().filter(c=>(+c.limit||0)>0 && (+c.balance||0)/(+c.limit||1)>0.3)
    .forEach(c=>push({id:'util-'+c.id,sev:'soon',tab:'accounts',icon:'💳',
      title:`${c.name} is at ${Math.round((+c.balance||0)/(+c.limit||1)*100)}% of its limit`,
      sub:`Under 30% is the usual guidance for credit scoring. Paying it down before the statement date is what moves that number.`,
      action:`openPayCardModal('${jsEsc(c.id)}')`, cta:'Pay it down'}));
  if(incomeTotals().total===0 && day>=5) push({id:'no-income',sev:'soon',tab:null,icon:'💰',
    title:'No income logged this month',
    sub:'Every "left to spend" and per-person figure is measured against income, so they are all understated until this is in.',
    action:"openAdd();setAddMode('income')", cta:'Log income'});
  // Anything stuck offline is silent data loss from the user's point of view.
  const q=pendingQueue().length;
  if(q) push({id:'queued',sev:'now',tab:'app',icon:'📡',
    title:`${q} change${q===1?'':'s'} not yet saved to the sheet`,
    sub:'Saved on this device and waiting for a connection. They will send themselves — nothing is lost.',
    action:"flushQueue()", cta:'Try now'});
  if(!localStorage.getItem(APIKEY_LS)) push({id:'no-key',sev:'setup',tab:'app',icon:'📸',
    title:'Turn on statement scanning',
    sub:'Add an Anthropic API key and you can photograph a statement instead of typing rows in by hand.',
    action:"goSettings('app')", cta:'Add key'});

  const rank={now:0,soon:1,setup:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}
function attentionCount(tab){ return attentionItems().filter(i=>i.tab===tab).length; }

// ─── Money tab math ───────────────────────────────────────────────────────────
function byOwner(list){ return S.person==='All'?list:list.filter(x=>(x.owner||'shared')===S.person||(x.owner||'shared')==='shared'); }
// How much of an owned thing counts toward the person currently in view.
// "All" counts everything once; a person counts what's theirs in full and an
// even slice of anything marked shared — so the two individual views always
// add back up to the household total instead of double-counting shared items.
function ownerShare(ownerId,personId){
  const p=personId||S.person;
  if(p==='All') return 1;
  const o=ownerId||'shared';
  if(o===p) return 1;
  if(o==='shared'||o===BOTH) return 1/Math.max(D.people.length,1);
  return 0;
}
// Every liability in one list: standalone debts plus any credit card with a
// balance. A card is real debt owned by its cardholder, and because the balance
// is the sum of unsettled charges it grows the moment a charge is queued.
function allDebts(){
  const fromDebts=D.debts.map(d=>({id:d.id,name:d.name,owner:d.owner||'shared',balance:+d.balance||0,
    startBalance:+d.startBalance||0,apr:+d.apr||0,minPayment:+d.minPayment||0,highPriority:!!d.highPriority,source:'debt'}));
  const fromCards=cards().filter(c=>(+c.balance||0)>0).map(c=>({id:c.id,name:c.name,owner:c.owner||'shared',
    balance:+c.balance||0,startBalance:+c.limit||0,apr:0,minPayment:0,highPriority:false,source:'card',limit:+c.limit||0}));
  return fromDebts.concat(fromCards);
}
function netWorth(personId){
  const p=personId||S.person;
  const assets=spendAccounts().reduce((s,a)=>s+(+a.balance||0)*ownerShare(a.owner,p),0);
  const owed=allDebts().reduce((s,d)=>s+d.balance*ownerShare(d.owner,p),0);
  return {assets,owed,net:assets-owed};
}
function snapshotNetWorth(){
  const ym=todayStr().slice(0,7);
  D.settings.netWorthSnapshots[ym]=netWorth().net;
  commit('settings');
}
function prevMonthKey(){ let m=S.month-1,y=S.year; if(m<1){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
function netWorthChange(){
  const prev=D.settings.netWorthSnapshots[prevMonthKey()];
  if(prev==null) return null;
  return netWorth().net-prev;
}
// Payment history facts, kept separate from projection so nothing can quietly
// assume a payment that never happened.
function debtPayHistory(d){
  const mine=D.debtPayments.filter(p=>p.debtId===d.id);
  if(!mine.length) return {ever:false, count:0, last:null, monthsSince:null};
  const last=mine.map(p=>String(p.date)).sort().pop();
  const dt=new Date(last), now=new Date();
  const months=(now.getFullYear()-dt.getFullYear())*12+(now.getMonth()-dt.getMonth());
  return {ever:true, count:mine.length, last, monthsSince:Math.max(months,0)};
}
// How long this debt has been sitting untouched. Falls back to when it was first
// tracked, so "never paid" still carries a duration instead of just a claim.
function monthsUntouched(d){
  const h=debtPayHistory(d);
  if(h.ever) return h.monthsSince;
  const from=d.created||D.debts.reduce((m,x)=>x.created&&(!m||x.created<m)?x.created:m,'');
  if(!from) return null;
  const dt=new Date(from), now=new Date();
  if(isNaN(dt)) return null;
  return Math.max((now.getFullYear()-dt.getFullYear())*12+(now.getMonth()-dt.getMonth()),0);
}
function aprMissing(d){ return !(+d.apr>0); }
function debtsNeedingApr(){ return D.debts.filter(d=>(+d.balance||0)>0 && aprMissing(d)); }
function debtPace(d){
  const cutoff=new Date(Date.now()-90*864e5);
  const paid90=D.debtPayments.filter(p=>p.debtId===d.id && new Date(p.date)>=cutoff).reduce((s,p)=>s+p.amount,0);
  return Math.max(paid90/3, +d.minPayment||0);
}
function strategyNext(){
  const open=byOwner(D.debts).filter(d=>d.balance>0);
  if(!open.length) return null;
  const sorted=[...open].sort((a,b)=> D.settings.strategy==='avalanche' ? ((+b.apr||0)-(+a.apr||0))||(a.balance-b.balance) : (a.balance-b.balance));
  return sorted[0];
}

// ─── Per-person spending ─────────────────────────────────────────────────────
// Tapping a person opens their own view rather than just filtering the month.
// Shared rows count as half here, matching ownerShare() elsewhere, so the two
// people's totals still add up to the household's instead of double-counting.
function openPerson(id){
  S.pv.id=id; S.pv.cat=''; S.view='person'; window.scrollTo(0,0); render();
  if(!D.ledger.length) loadLedger();
}
function setPV(k,v){ S.pv[k]=v; render(); }
function personRows(){
  const id=S.pv.id, r=periodRange(S.pv.period);
  return ledgerRows().filter(t=>{
    if(t.kind!=='expense') return false;
    const d=String(t.date||''); if(d<r.from||d>r.to) return false;
    if(S.pv.cat && (t.category||'')!==S.pv.cat) return false;
    return (t.payer||BOTH)===id || (t.payer||BOTH)===BOTH;
  });
}
function pvShare(t){ return (t.payer||BOTH)===BOTH?1/Math.max(D.people.length,1):1; }
function personIncomeTotal(){
  const id=S.pv.id, r=periodRange(S.pv.period);
  return ledgerRows().filter(t=>t.kind==='income').filter(t=>{
    const d=String(t.date||''); return d>=r.from&&d<=r.to;
  }).reduce((s,t)=>s+t.amount*((t.payer||BOTH)===BOTH?1/Math.max(D.people.length,1):(t.payer===id?1:0)),0);
}
function personHTML(){
  const id=S.pv.id, p=personById(id);
  if(!p) return `<div class="card"><div class="empty"><div class="empty-h">Nobody selected</div></div></div>`;
  const rows=personRows();
  const spent=rows.reduce((s,t)=>s+t.amount*pvShare(t),0);
  const earned=personIncomeTotal();
  const months=periodMonths(S.pv.period);

  const byCat={};
  rows.forEach(t=>{ const c=t.category||'Uncategorised'; byCat[c]=(byCat[c]||0)+t.amount*pvShare(t); });
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=cats.length?cats[0][1]:0;
  const catBars=cats.map(([c,v])=>`<div class="pv-cat" onclick="setPV('cat','${jsEsc(S.pv.cat===c?'':c)}')">
      <div class="bud-row"><span class="bud-name">${catIcon(c)} ${esc(c)}${S.pv.cat===c?' ✓':''}</span>
        <span class="bud-nums">${f0(v)} · ${Math.round(v/(spent||1)*100)}%</span></div>
      <div class="track"><div class="track-fill" style="width:${max?(v/max)*100:0}%;background:${catColor(c)}"></div></div>
    </div>`).join('');

  const sorted=[...rows].sort((a,b)=>{
    const s=S.pv.sort;
    if(s==='amount-desc') return b.amount-a.amount;
    if(s==='amount-asc')  return a.amount-b.amount;
    if(s==='date-asc')    return String(a.date).localeCompare(String(b.date));
    if(s==='cat')         return String(a.category||'').localeCompare(String(b.category||''))||b.amount-a.amount;
    return String(b.date).localeCompare(String(a.date));
  });

  const dd=(k,opts)=>`<select class="finput pv-dd" onchange="setPV('${k}',this.value)">${
    opts.map(([v,l])=>`<option value="${esc(v)}" ${S.pv[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const catOpts=[['','All categories']].concat(categoriesByUse().map(c=>[c.name,`${c.icon} ${c.name}`]));

  return `
    <div class="pv-head">
      <button class="pv-back" onclick="go('home')">‹</button>
      <div class="pv-who">${p.emoji} ${esc(p.name)}</div>
    </div>
    <div class="card">
      <div class="pv-dds">${dd('period',PERIODS)}${dd('cat',catOpts)}${dd('sort',SORTS)}</div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-val">${f0(spent)}</div><div class="stat-lbl">spent</div></div>
        <div class="stat"><div class="stat-val">${f0(spent/months)}</div><div class="stat-lbl">per month</div></div>
        <div class="stat"><div class="stat-val" style="color:${earned-spent>=0?'var(--mint)':'var(--peach)'}">${earned-spent>=0?'+':'−'}${f0(Math.abs(earned-spent))}</div><div class="stat-lbl">vs ${f0(earned)} in</div></div>
      </div>
      <div class="pv-note">${rows.length} purchase${rows.length===1?'':'s'}${S.pv.cat?` in ${esc(S.pv.cat)}`:''} · shared costs counted at ${Math.round(100/Math.max(D.people.length,1))}%${S.pv.loading?' · loading full history…':''}</div>
    </div>
    ${cats.length?`<div class="card"><div class="card-title-row" style="margin-bottom:8px"><span class="card-title">🗂 By category</span>${S.pv.cat?`<button class="card-toggle" onclick="setPV('cat','')">Clear</button>`:''}</div>${catBars}</div>`:''}
    <div class="card">
      <div class="card-title-row" style="margin-bottom:6px"><span class="card-title">🧾 Every purchase</span><span style="font-size:11px;font-weight:700;color:var(--txt3)">${esc((SORTS.find(x=>x[0]===S.pv.sort)||[])[1]||'')}</span></div>
      ${sorted.length?sorted.map(t=>txRowHTML(t)).join(''):`<div class="empty"><div class="empty-ico">🍃</div><div class="empty-h">Nothing in this period</div><div class="empty-s">Try a wider time range</div></div>`}
    </div>`;
}

// ─── Render router ────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  let body='';
  if(S.view==='home') body=homeHTML();
  else if(S.view==='add') body=addHTML();
  else if(S.view==='money') body=moneyHTML();
  else if(S.view==='goals') body=goalsHTML();
  else if(S.view==='recap') body=recapHTML();
  else if(S.view==='settings') body=settingsHTML();
  else if(S.view==='moneydate') body=moneydateHTML();
  else if(S.view==='person') body=personHTML();
  else body=homeHTML();
  app.innerHTML = topbarHTML() + body + navHTML() + (S.milestone?milestoneHTML():'') + (S.modal?modalHTML():'');
  if(S.view==='money' && S.moneyTab==='trends') (window.requestAnimationFrame||setTimeout)(drawCharts);
  // One-shot: put the cursor in the amount box when the Add sheet opens, so the
  // keyboard is already up. Deliberately NOT on every render - re-focusing after
  // a category tap would yank the keyboard open unasked.
  if(S.focusAmount){ S.focusAmount=false; const el=app.querySelector('.finput.big');
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } }
  // Restore focus for a field that had to re-render to do its job.
  if(S.refocus){ const sel=S.refocus; S.refocus=null; const el=app.querySelector(sel);
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } }
}
function go(v){ S.view=v; window.scrollTo(0,0); render(); }
function shiftMonth(d){ let m=S.month+d,y=S.year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} S.month=m;S.year=y; render(); loadForMonth(); }
function toggleBudgets(){ D.settings.budgetsOpen=!D.settings.budgetsOpen; commit('settings'); render(); }

function syncBadgeHTML(){
  const n=pendingQueue().length;
  if(S.syncing) return `<span class="sync-badge syncing" title="Syncing…">🔄</span>`;
  if(S.syncStatus==='offline') return `<span class="sync-badge offline" title="Offline — showing your last synced data${n?', '+n+' change'+(n!==1?'s':'')+' waiting to sync':''}">📴${n?' '+n:''}</span>`;
  if(S.syncStatus==='online') return `<span class="sync-badge online" title="Synced with Google Sheets">🟢</span>`;
  return '';
}
function topbarHTML(){

  return `<div class="nav">

// ─── HOME ─────────────────────────────────────────────────────────────────────
function txRowHTML(t){
  const isIncome=t.kind==='income', isTransfer=t.kind==='transfer';
  const cat=t.category||'Personal/Misc';
  const icon = isIncome?'💰':isTransfer?'🔁':catIcon(cat);
  const bg = isIncome?'var(--mint-soft)':isTransfer?'var(--sky-soft)':catColor(cat)+'33';
  const isRecur=t.txType==='recurring';
  const badges = (t.payer===BOTH?`<span class="tx-badge badge-both">Split</span>`:'') + (isRecur?`<span class="tx-badge badge-recur">Auto</span>`:'') + (t.cardSettled?`<span class="tx-badge badge-card">Card</span>`:'') + (t.queued?`<span class="tx-badge badge-card">Queued</span>`:'');
  const dt=String(t.date||'').slice(5).replace('-','/');
  const amtColor = isIncome?'var(--mint)':'var(--txt)';
  const amtPrefix = isIncome?'+':'';
  // A queued charge has no transaction row behind it yet, so there is nothing
  // for the detail modal to open. Say what it is instead of failing silently.
  const tap = t.queued?`onclick="showToast('💳 Queued on ${jsEsc(t.accountName||'card')} — counts as spending when the card is paid off')"`:`onclick="openTxDetail('${t.id}')"`;
  return `<div class="tx" ${tap}>
    <div class="tx-ico" style="background:${bg}">${icon}</div>
    <div class="tx-body"><div class="tx-desc">${esc(t.desc||'—')}${badges}</div><div class="tx-meta">${isIncome?'Income':isTransfer?'Transfer':esc(cat)} · ${personName(t.payer)} · ${dt}</div></div>
    <div class="tx-amt" style="color:${amtColor}">${amtPrefix}${f$(t.amount)}</div>
  </div>`;
}

// The one number that answers "can I buy this?": everyday budget minus
// everyday spend. Bills, debt, and savings live elsewhere and aren't touched.
function safeToSpendHTML(){
  const f=flexTotals();
  if(!f.budget) return '';
  const now=new Date();
  const isCurrent = S.month===now.getMonth()+1 && S.year===now.getFullYear();
  const daysInMonth=new Date(S.year,S.month,0).getDate();
  const daysLeft=Math.max(daysInMonth-now.getDate()+1,1);
  const pct=Math.min((f.spent/f.budget)*100,100);
  const cls=pct<70?'safe':pct<95?'warn':'danger';
  const over=f.left<0;
  let sub;
  if(!isCurrent) sub=`${f0(f.spent)} of the ${f0(f.budget)} everyday budget`;
  else if(over) sub=`over by ${f0(-f.left)} — bills, savings & debt aren't affected. Next month is a fresh start.`;
  else sub=`≈ ${f0(f.left/daysLeft)}/day for the next ${daysLeft} day${daysLeft!==1?'s':''}`;
  return `<div class="total-card" style="background:linear-gradient(135deg,${over?'var(--peach-soft),var(--yellow-soft)':'var(--mint-soft),var(--sky-soft)'})">
    <div class="total-eyebrow">Left for everyday spending · ${MONTHS[S.month-1]}</div>
    <div class="total-amount" style="color:${over?'var(--peach)':'var(--txt)'}">${over?'−':''}${f0(Math.abs(f.left))}</div>
    <div class="util-wrap" style="max-width:280px;margin:6px auto 2px"><div class="util-bar"><div class="util-fill track-fill ${cls}" style="width:${pct}%"></div></div></div>
    <div class="total-sub">${sub}</div>
  </div>`;
}
// Top categories with a vs-last-month delta, so "what are we spending most on"
// is answered on the first screen instead of buried in Trends.
function topCatsHTML(){
  const cats=catTotals();
  const entries=Object.entries(cats).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,4);
  if(!entries.length) return '';
  const prev=(D.insights&&D.insights.prevCategoryTotals)||{};
  const max=entries[0][1];
  const rows=entries.map(([c,v])=>{
    const p=+prev[c]||0, d=v-p;
    const delta = p===0&&d>0 ? '' : Math.abs(d)<1 ? `<span style="color:var(--txt3)">≈ same as last mo</span>`
      : d>0 ? `<span style="color:var(--peach)">▲ ${f0(d)} vs last mo</span>` : `<span style="color:var(--mint)">▼ ${f0(-d)} vs last mo</span>`;
    return `<div style="margin-bottom:10px">
      <div class="bud-row"><span class="bud-name">${catIcon(c)} ${esc(c)}</span><span class="bud-nums">${f0(v)}</span></div>
      <div class="track" style="margin-bottom:2px"><div class="track-fill" style="width:${(v/max)*100}%;background:${catColor(c)}"></div></div>
      <div style="font-size:10px;font-weight:700;text-align:right">${delta}</div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-title-row"><span class="card-title">🏆 Where it's going</span><button class="card-toggle" onclick="S.moneyTab='trends';go('money')">Charts →</button></div>${rows}</div>`;
}
// The monthly plan as a legible equation instead of one mystery number.
function planCardHTML(){
  const p=planTotals();
  if(p.income===0) return '';
  const u=Math.round(p.leftover);
  const line=(lbl,val,color)=>`<div class="recap-stat" style="padding:7px 0"><span class="recap-lbl" style="font-size:12px">${lbl}</span><span class="recap-val" style="font-size:13px;${color?'color:'+color:''}">${val}</span></div>`;
  const verdict = Math.abs(u)<1 ? {t:'Every dollar has a job 🎉',c:'var(--mint)'}
    : u>0 ? {t:`${f0(u)} not yet assigned — give it a job (savings? debt?)`,c:'var(--peach)'}
    : {t:`Plan is ${f0(-u)} more than income — trim budgets or debt extras`,c:'var(--peach)'};
  return `<div class="card" onclick="goSettings('recurring')" style="cursor:pointer">
    <div class="card-title-row" style="margin-bottom:4px"><span class="card-title">🧮 This month's plan</span></div>
    ${line('💰 Income',f$(p.income),'var(--mint)')}
    ${line('🏠 Bills (recurring)','−'+f$(p.bills))}
    ${line('💳 Debt minimums','−'+f$(p.debtMins))}
    ${p.savings>0?line('🌱 Auto-savings','−'+f$(p.savings)):''}
    ${line('🛒 Everyday budgets','−'+f$(p.flexBudget))}
    <div style="border-top:1.5px dashed var(--border);margin-top:4px;padding-top:8px;font-size:12px;font-weight:800;color:${verdict.c}">${verdict.t}</div>
  </div>`;
}
function cardStripHTML(){
  const cs=cards(); if(!cs.length) return '';
  return cs.map(c=>{
    const lim=+c.limit||0, used=+c.balance||0;
    const pct=lim>0?Math.min((used/lim)*100,100):0;
    const col=pct<30?'var(--mint)':pct<70?'#fbbf24':'var(--rose)';
    return `<div class="card" onclick="openPayCardModal('${c.id}')" style="cursor:pointer">
      <div class="card-title-row" style="margin-bottom:2px"><span class="card-title">💳 ${esc(c.name)}</span><span style="font-family:var(--mono);font-size:13px;font-weight:500;color:${col}">${f0(used)} / ${f0(lim)}</span></div>
      <div class="util-wrap"><div class="util-bar"><div class="util-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="util-lbls"><span>${Math.round(pct)}% used${pct>=30?' · aim under 30%':''}</span><span>${used>0?'tap to pay off →':'paid off 🎉'}</span></div></div>
    </div>`;
  }).join('');
}

function homeHTML(){
  const persons=personTotals();
  const inc=incomeTotals(), total=totalExpenses(), net=inc.total-total;
  const cats=catTotals();
  const settle=settleUp();
  const health=monthHealth();
  const healthBg = health.score==='great'?'linear-gradient(135deg,#d1fae5,#dbeafe)':health.score==='good'?'linear-gradient(135deg,#fce7f3,#ede9fe)':health.score==='warn'?'linear-gradient(135deg,#fef3c7,#ffedd5)':health.score==='bad'?'linear-gradient(135deg,#ffe4e6,#fce7f3)':'linear-gradient(135deg,#fce7f3,#ede9fe)';

  const patches = catByName("Patches' Expenses");
  const patchesBudget = patches?(+patches.budget||0):0;
  const patchesSpent = cats["Patches' Expenses"]||0;

  // Everyday budgets: only flexible categories, only ones that matter this month
  const flexBars = flexCategories().filter(c=>(+c.budget||0)>0 || (cats[c.name]||0)>0).map(c=>{
    const spent=cats[c.name]||0, budget=+c.budget||0;
    const pct=budget>0?Math.min((spent/budget)*100,100):0;
    const cls=budget===0?'none':pct<70?'safe':pct<90?'warn':'danger';
    return `<div><div class="bud-row"><span class="bud-name">${c.icon} ${esc(c.name)}</span><span class="bud-nums">${f0(spent)}${budget>0?' / '+f0(budget):''}</span></div><div class="track"><div class="track-fill ${cls}" style="width:${pct}%"></div></div></div>`;
  }).join('');
  // Bills: fixed commitments, shown as a compact ledger instead of budget bars
  const billRows = billCategories().filter(c=>(cats[c.name]||0)>0 || (+c.budget||0)>0).map(c=>{
    const spent=cats[c.name]||0;
    return `<div class="recap-stat" style="padding:6px 0"><span class="recap-lbl" style="font-size:12px">${c.icon} ${esc(c.name)}</span><span class="recap-val" style="font-size:13px">${f0(spent)}</span></div>`;
  }).join('');
  const billTotal = billCategories().reduce((s,c)=>s+(cats[c.name]||0),0);

  let settleCard='';
  if(settle.aId && Math.abs(settle.net)>=1){
    const aAhead=settle.net>0;
    settleCard=`<div class="settle">
      <div class="settle-msg">${aAhead?personName(settle.bId)+' owes '+personName(settle.aId):personName(settle.aId)+' owes '+personName(settle.bId)}</div>
      <div class="settle-amt">${f0(Math.abs(settle.net))}</div>
      <div class="settle-sub">Based on who paid for shared costs this month</div>
      <button class="settle-btn" onclick="settleConfirm(${Math.abs(settle.net).toFixed(2)},${aAhead})">Settle up 💸</button>
    </div>`;
  }

  const recent=[...D.transactions].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);
  const recentList = recent.length?recent.map(t=>txRowHTML(t)).join(''):`<div class="empty"><div class="empty-ico">🐾</div><div class="empty-h">No spending yet</div><div class="empty-s">Tap ＋ to log your first one</div></div>`;

  const personCards = D.people.map(p=>`<div class="person-card" onclick="openPerson('${p.id}')" style="cursor:pointer">
    <div class="pc-name">${p.emoji} ${esc(p.name)}</div>
    <div class="pc-spent">${f0(persons[p.id]||0)}</div>
    <div class="pc-remaining ${(inc.byPerson[p.id]||0)>=(persons[p.id]||0)?'good':'warn'}">spent · earned ${f0(inc.byPerson[p.id]||0)} ›</div>
  </div>`).join('');

  const expCount = txForMonth().filter(t=>t.kind==='expense').length;

  return `
    ${attentionHTML()}
    <div class="health" style="background:${healthBg}">
      <div class="health-ico">${health.emoji}</div>
      <div><div class="health-title">${health.title}</div><div class="health-sub">${health.sub}</div></div>
    </div>

    ${safeToSpendHTML()}

    <div class="person-cards">
      ${personCards}
      ${patches?`<div class="person-card patches">
        <div><div class="pc-name">🐱 Patches</div><div class="pc-spent">${f0(patchesSpent)}</div></div>
        <div style="text-align:right"><div class="pc-remaining ${patchesSpent>patchesBudget?'bad':patchesSpent>patchesBudget*.7?'warn':'good'}">${patchesBudget-patchesSpent>=0?f0(patchesBudget-patchesSpent)+' left':f0(patchesSpent-patchesBudget)+' over'}</div></div>
      </div>`:''}
    </div>

    ${topCatsHTML()}

    ${settleCard}

    ${cardStripHTML()}

    <div class="card">
      <div class="card-title-row">
        <span class="card-title">📊 Everyday budgets</span>
        <button class="card-toggle" onclick="toggleBudgets()">${D.settings.budgetsOpen?'▲ Hide':'▼ Show'}</button>
      </div>
      ${D.settings.budgetsOpen?(flexBars||`<div style="font-size:12px;color:var(--txt3);font-weight:600">Add categories in Settings to see budget bars</div>`):`<div style="font-size:12px;color:var(--txt3);font-weight:600">Tap show to see category budgets</div>`}
      ${D.settings.budgetsOpen&&billRows?`<div style="border-top:1.5px dashed var(--border);margin-top:10px;padding-top:8px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:11px;font-weight:900;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px">🏠 Bills</span><span class="bud-nums">${f0(billTotal)} this month</span></div>
        ${billRows}
      </div>`:''}
    </div>

    ${planCardHTML()}

    <div class="card">
      <div class="card-title-row"><span class="card-title">🧾 Recent · ${expCount} this month · ${f0(total)} spent${net>=0?'':' · '+f0(-net)+' over income'}</span>${D.transactions.length>6?`<button class="card-toggle" onclick="go('recap')">See all</button>`:''}</div>
      ${recentList}
      ${D.transactions.length>6?`<button class="btn-ghost" onclick="S.moneyTab='activity';go('money')">See all activity →</button>`:''}
    </div>
  `;
}

function addHTML(){

// One-tap prefill built from what you actually buy. Everything here is derived
// from your own logged history - an earlier Quick Add shipped hardcoded values
// and fired a canned $1,000 charge, so nothing is baked in any more.
let QUICK=[];
function frequentTx(n){
  const src=D.transactions.filter(t=>t.kind==='expense')
    .concat(D.cardCharges.map(c=>({desc:c.desc,category:c.category,amount:c.amount,date:c.date})));
  const map=new Map();
  src.forEach(t=>{
    const d=String(t.desc||'').trim(); if(!d) return;
    const key=d.toLowerCase()+'|'+(t.category||'');
    const e=map.get(key);
    if(e){ e.count++; e.total+=+t.amount||0; if(String(t.date||'')>String(e.date)){ e.date=t.date; e.desc=d; } }
    else map.set(key,{desc:d,category:t.category||'',count:1,total:+t.amount||0,date:t.date||''});
  });
  return [...map.values()]
    .sort((a,b)=>b.count-a.count||String(b.date).localeCompare(String(a.date)))
    .slice(0,n)
    .map(e=>Object.assign({},e,{amount:Math.round((e.total/e.count)*100)/100}));
}
function quickAddHTML(){
  QUICK=frequentTx(6);
  if(QUICK.length<2) return '';
  const btns=QUICK.map((q,i)=>`<div class="qa-btn" onclick="quickFill(${i})">
    <span class="qa-ico">${catIcon(q.category)}</span>
    <span class="qa-name">${esc(q.desc)}</span>
    <span class="qa-amt">${q.count>1?'~':''}${f$(q.amount)}</span>
  </div>`).join('');
  return `<div class="card"><div class="card-title-row" style="margin-bottom:8px"><span class="card-title">\u26a1 Again?</span></div><div class="qa-row">${btns}</div></div>`;
}
// Prefills only - it never submits for you. The amount is your average for that
// item, so the common case is "tap, glance, save" and an unusual one is a quick edit.
function quickFill(i){

// Categories ranked by how often you actually use them, so the pills you reach
// for are first instead of whatever order they were created in. Ties keep the
// existing order, so the list stays stable rather than reshuffling every save.
function categoriesByUse(){
  const use={};
  D.transactions.filter(t=>t.kind==='expense').forEach(t=>{ if(t.category) use[t.category]=(use[t.category]||0)+1; });
  D.cardCharges.forEach(c=>{ if(c.category) use[c.category]=(use[c.category]||0)+1; });
  return D.categories.map((c,i)=>({c,i,n:use[c.name]||0}))
    .sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.c);
}

  const host=document.getElementById('toast-host');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; host.appendChild(t);
  setTimeout(()=>t.remove(),2200);

function submitTx(){
  const f=S.form;
  const amt=parseFloat(f.amount);
  if(!amt||isNaN(amt)||amt<=0){ showToast('⚠️ Enter an amount'); return; }
  if(!f.desc.trim()){ showToast('⚠️ Add a description'); return; }
  if(!f.cat){ showToast('⚠️ Add a category in Settings first'); return; }
  if(f.payWith && f.payWith!=='cash'){
    const charge=chargeCard(f.payWith,{date:f.date,desc:f.desc,category:f.cat,payer:cardOwnerId(f.payWith),amount:amt,notes:''});
    syncOp('chargeCard',{id:charge.id,accountId:f.payWith,date:f.date,description:f.desc,category:f.cat,paidBy:toServerPerson(cardOwnerId(f.payWith)),amount:amt,notes:''});
    showToast('💳 Charged to card — queued until paid off');
  } else {
    const tx=addTransactionRaw({date:f.date,desc:f.desc,category:f.cat,payer:f.payer,amount:amt,kind:'expense',need:f.need,sub:!!f.sub,notes:'',txType:'one-time'});
    syncOp('addTransaction',toServerTxParams(tx));
    showToast('✅ Added!');
  }
  S.form={ desc:'',amount:'',cat:f.cat,payer:f.payer,date:todayStr(),notes:'',need:'need',sub:false,payWith:f.payWith };
  go('home');
}

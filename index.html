<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PatchinPennies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
:root{
  --bg:#fdf6f9;--bg2:#fff0f7;--card:#ffffff;--card2:#fef3fb;
  --border:#f0d6e8;--border2:#e8c8dc;
  --txt:#4a3048;--txt2:#8a6880;--txt3:#b89aad;
  --pink:#f472b6;--pink-soft:#fce7f3;--pink-glow:rgba(244,114,182,0.2);
  --lavender:#a78bfa;--lav-soft:#ede9fe;--lav-glow:rgba(167,139,250,0.2);
  --mint:#34d399;--mint-soft:#d1fae5;
  --peach:#fb923c;--peach-soft:#ffedd5;
  --sky:#60a5fa;--sky-soft:#dbeafe;
  --rose:#fb7185;--rose-soft:#ffe4e6;
  --yellow:#fbbf24;--yellow-soft:#fef3c7;
  --radius:18px;--font:'Nunito',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 2px 16px rgba(200,140,180,.12);--shadow-lg:0 6px 32px rgba(200,140,180,.2);
}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100%;padding-bottom:86px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,#f9c8e4 1px,transparent 1px);background-size:28px 28px;opacity:.3}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.wordmark{font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--txt)}
.wordmark em{font-style:normal;color:var(--pink)}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow)}
.month-nav button{background:none;border:none;font-size:15px;color:var(--txt2);width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.month-nav button:active{background:var(--pink-soft)}
.month-nav .mlabel{font-size:12px;font-weight:800;color:var(--txt);min-width:62px;text-align:center}
.gear-btn{background:var(--card);border:1.5px solid var(--border);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.gear-btn:active{background:var(--pink-soft)}
.addchooser{display:flex;gap:10px;margin-bottom:14px}
.addchooser .seg-opt{flex:1;padding:12px 8px;border:1.5px solid var(--border);border-radius:13px;background:var(--card);font-size:13px}
.addchooser .seg-opt.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.util-wrap{margin:7px 0 2px}
.util-bar{height:13px;border-radius:99px;background:var(--bg2);overflow:hidden}
.util-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.util-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:4px}
.money-subtabs{display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:3px;margin-bottom:14px}
.money-subtabs .seg-opt{padding:8px;border-radius:999px}
.settings-subnav{display:flex;overflow-x:auto;gap:6px;background:var(--bg2);border-radius:999px;padding:3px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.settings-subnav .seg-opt{flex:0 0 auto;padding:8px 14px;border-radius:999px;white-space:nowrap}

/* Cards */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:800;color:var(--txt)}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-toggle{background:var(--pink-soft);border:none;color:var(--pink);font-family:var(--font);font-weight:800;font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer}

/* Health banner */
.health{display:flex;align-items:center;gap:12px;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--border)}
.health-ico{font-size:30px;line-height:1}
.health-title{font-size:14px;font-weight:900;color:var(--txt)}
.health-sub{font-size:11.5px;font-weight:600;color:var(--txt2);margin-top:1px}

/* Person cards */
.person-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.person-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.person-card.patches{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff,#fdf0f8)}
.pc-name{font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.pc-spent{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--txt);letter-spacing:-1px;margin-top:3px}
.pc-remaining{font-size:11px;font-weight:700;margin-top:2px}
.pc-remaining.good{color:var(--mint)}.pc-remaining.warn{color:var(--peach)}.pc-remaining.bad{color:var(--rose)}

/* Totals */
.total-card{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;text-align:center}
.total-eyebrow{font-size:10px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:1px}
.total-amount{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-2px;color:var(--txt);margin:2px 0}
.total-sub{font-size:11px;color:var(--txt2);font-weight:700}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat-lbl{font-size:11px;font-weight:700;color:var(--txt2);display:flex;align-items:center;gap:5px;margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:-.5px}
.stat-val.pink{color:var(--sky)}.stat-val.lav{color:var(--lavender)}
.pip{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Settle-up */
.settle{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1.5px solid var(--yellow);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.settle-msg{font-size:13px;font-weight:800;color:var(--txt);text-align:center;margin-bottom:4px}
.settle-amt{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--peach);text-align:center;letter-spacing:-1px}
.settle-sub{font-size:10.5px;color:var(--txt2);text-align:center;font-weight:700;margin-top:2px}
.settle-btn{width:100%;margin-top:10px;background:var(--peach);color:#fff;border:none;border-radius:12px;padding:10px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer}
.settle-btn:active{transform:scale(.98)}

/* Budget bars */
.bud-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bud-name{font-size:12px;font-weight:700;color:var(--txt)}
.bud-nums{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.track{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:11px}
.track-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.track-fill.safe{background:linear-gradient(90deg,#6ee7b7,#34d399)}
.track-fill.warn{background:linear-gradient(90deg,#fcd34d,#fbbf24)}
.track-fill.danger{background:linear-gradient(90deg,#fda4b8,#fb7185)}
.track-fill.none{background:#e8d5e3}

/* Transaction list */
.tx{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bg2);cursor:pointer}
.tx:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--txt3);font-weight:600;margin-top:1px}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--txt);flex-shrink:0}
.tx-badge{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;margin-left:5px;text-transform:uppercase;letter-spacing:.3px}
.badge-both{background:var(--lav-soft);color:var(--lavender)}
.badge-recur{background:var(--mint-soft);color:#059669}
.badge-card{background:var(--sky-soft);color:var(--sky)}

/* Forms */
.fgroup{margin-bottom:14px}
.flabel{display:block;font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.finput{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--font);font-size:15px;font-weight:600;color:var(--txt);outline:none}
.finput:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-glow)}
.finput.big{font-family:var(--mono);font-size:26px;font-weight:500;text-align:center;letter-spacing:-1px}
textarea.finput{resize:none;min-height:60px}
.cpill-wrap{display:flex;flex-wrap:wrap;gap:7px}
.cpill{display:flex;align-items:center;gap:5px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;transition:all .15s}
.cpill.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.cpill .ci{font-size:14px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg-opt{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12px;font-weight:800;color:var(--txt2);cursor:pointer;transition:all .15s;min-width:60px}
.seg-opt.on{background:var(--card);color:var(--pink);box-shadow:var(--shadow)}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--pink),var(--lavender));color:#fff;border:none;border-radius:14px;padding:15px;font-family:var(--font);font-weight:900;font-size:15px;cursor:pointer;box-shadow:var(--shadow-lg)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.6}
.btn-ghost{width:100%;background:var(--card);color:var(--txt2);border:1.5px solid var(--border);border-radius:12px;padding:12px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}
.btn-danger{width:100%;background:var(--rose-soft);color:var(--rose);border:1.5px solid var(--rose);border-radius:12px;padding:12px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}

/* Quick adds */
.qa-row{display:flex;flex-wrap:wrap;gap:8px}
.qa-btn{flex:1 1 calc(33.33% - 6px);min-width:88px;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s}
.qa-btn:active{transform:scale(.96);background:var(--pink-soft)}
.qa-ico{font-size:19px;display:block;margin-bottom:3px}
.qa-name{font-size:11px;font-weight:800;color:var(--txt);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Goals */
.goal-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.goal-name{font-size:14px;font-weight:800;color:var(--txt)}
.goal-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:99px;margin-top:3px;display:inline-block}
.gt-savings{background:var(--mint-soft);color:#059669}
.gt-debt{background:var(--rose-soft);color:var(--rose)}
.goal-pct{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--txt2)}
.goal-nums{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:11px}
.goal-actions{display:flex;gap:7px;margin-top:11px}
.goal-actions button{flex:1;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px;font-family:var(--font);font-weight:800;font-size:11px;color:var(--txt2);cursor:pointer}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px}
.nav-ico{font-size:21px;filter:grayscale(1) opacity(.45);transition:all .15s}
.nav-lbl{font-size:9px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px}
.nav-item.on .nav-ico{filter:none;transform:translateY(-1px)}
.nav-item.on .nav-lbl{color:var(--pink)}
.nav-add{background:linear-gradient(135deg,var(--pink),var(--lavender));width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:var(--shadow-lg);font-size:26px;color:#fff;border:3px solid var(--bg);cursor:pointer}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(74,48,72,.4);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));width:100%;max-width:480px;box-shadow:0 -8px 40px rgba(0,0,0,.2);animation:slideUp .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{font-size:17px;font-weight:900;text-align:center;margin-bottom:6px}
.modal-sub{font-size:12.5px;color:var(--txt2);text-align:center;font-weight:600;margin-bottom:16px}
.modal-cancel{width:100%;background:var(--bg2);border:none;color:var(--txt2);border-radius:12px;padding:13px;font-family:var(--font);font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}

/* Misc */
.seed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--mint-soft),var(--sky-soft));border:1.5px solid var(--mint);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.seed-text{font-size:12.5px;font-weight:800;color:var(--txt)}
.seed-text small{display:block;font-size:10.5px;font-weight:600;color:var(--txt2);margin-top:1px}
.seed-go{background:var(--mint);color:#fff;border:none;border-radius:10px;padding:9px 13px;font-family:var(--font);font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}
.empty{text-align:center;padding:34px 16px;color:var(--txt3)}
.empty-ico{font-size:38px;margin-bottom:8px}
.empty-h{font-size:14px;font-weight:800;color:var(--txt2);margin-bottom:3px}
.empty-s{font-size:12px;font-weight:600}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:200;box-shadow:var(--shadow-lg);animation:toastIn .3s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.section-title{font-size:12px;font-weight:900;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin:4px 2px 10px}
.chart-wrap{position:relative;height:200px;margin-top:6px}
.recap-stat{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bg2)}
.recap-stat:last-child{border-bottom:none}
.recap-lbl{font-size:13px;font-weight:700;color:var(--txt2)}
.recap-val{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--txt)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px}
.loading-cat{font-size:44px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* Cash flow (sankey) */
.cf-card{background:linear-gradient(150deg,#3a2338,#241426);border:1.5px solid #5a3a55;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-lg)}
.cf-eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;color:#c9a3bd;text-transform:uppercase;letter-spacing:2.5px}
.cf-svg{width:100%;height:auto;display:block;margin-top:10px}
.cf-lbl{font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;fill:#fdf6f9}
.cf-amt{font-family:'DM Mono',monospace;font-size:9.5px;fill:#c9a3bd}
.cf-totals{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #5a3a5588}
.cf-tot-lbl{font-size:9.5px;font-weight:800;color:#c9a3bd;text-transform:uppercase;letter-spacing:.6px}
.cf-tot-val{font-family:var(--mono);font-size:15px;font-weight:500;color:#fdf6f9;letter-spacing:-.5px;margin-top:2px}
/* Money tab */
.person-toggle{display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:3px;margin-bottom:12px}
.person-toggle .seg-opt{padding:7px;border-radius:999px}
.acct{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bg2);cursor:pointer}
.acct:last-child{border-bottom:none}
.acct-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--sky-soft)}
.acct-body{flex:1;min-width:0}
.acct-name{font-size:13px;font-weight:800;color:var(--txt)}
.acct-meta{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:1px}
.acct-bal{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--txt);text-align:right}
.acct-recon{font-size:9.5px;font-weight:800;color:var(--sky);text-align:right;margin-top:1px}
.acct-recon.stale{color:var(--peach)}
.melt-wrap{margin:8px 0 4px}
.melt{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden;display:flex}
.melt-fill{height:100%;background:linear-gradient(90deg,#fda4b8,#fb7185);transition:width .8s cubic-bezier(.4,0,.2,1)}
.melt-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:4px}
.debt{padding:11px 0;border-bottom:1px solid var(--bg2)}
.debt:last-child{border-bottom:none}
.debt-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.debt-name{font-size:13px;font-weight:800;color:var(--txt);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debt-bal{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--rose)}
.debt-proj{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:2px}
.debt-proj b{color:var(--sky);font-weight:800}
.debt-pri{display:inline-block;font-size:8.5px;font-weight:900;background:var(--rose-soft);color:var(--rose);padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.4px}
.debt-actions{display:flex;gap:6px;margin-top:7px}
.debt-actions button{border:1.5px solid var(--border);background:var(--card);border-radius:9px;padding:6px 10px;font-family:var(--font);font-weight:800;font-size:10.5px;color:var(--txt2);cursor:pointer}
.strategy{background:linear-gradient(135deg,var(--sky-soft),var(--lav-soft));border:1.5px solid var(--sky);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.strategy-msg{font-size:12.5px;font-weight:700;color:var(--txt);margin-top:9px;line-height:1.5}
.strategy-msg b{color:var(--sky)}
/* Unallocated / plan */
.plan{border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--border);cursor:pointer}
.plan-title{font-size:13px;font-weight:900;color:var(--txt)}
.plan-sub{font-size:11px;font-weight:600;color:var(--txt2);margin-top:2px}
.plan-amt{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-1px;margin-top:3px}
/* Flows (settings) */
.flow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2)}
.flow:last-child{border-bottom:none}
.flow-body{flex:1;min-width:0;cursor:pointer}
.flow-name{font-size:13px;font-weight:800;color:var(--txt)}
.flow-meta{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:1px}
.flow-amt{font-family:var(--mono);font-size:13px;font-weight:500}
.flow-amt.invest{color:var(--mint)}.flow-amt.divest{color:var(--peach)}
.switch{width:38px;height:22px;border-radius:99px;background:#e8d5e3;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.switch.on{background:var(--mint)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:18px}
/* Money date */
.md-step{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--bg2)}
.md-step:last-child{border-bottom:none}
.md-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;cursor:pointer;color:transparent;transition:all .2s}
.md-check.done{background:var(--mint);border-color:var(--mint);color:#fff}
.md-body{flex:1}
.md-title{font-size:13.5px;font-weight:800;color:var(--txt)}
.md-sub{font-size:11px;color:var(--txt2);font-weight:600;margin-top:2px;line-height:1.5}
.md-link{font-size:11px;font-weight:800;color:var(--pink);cursor:pointer;margin-top:4px;display:inline-block}
/* Confetti */
.confetti-host{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(660deg);opacity:.7}}
.milestone-pop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--pink);border-radius:20px;padding:20px 26px;z-index:301;text-align:center;box-shadow:var(--shadow-lg);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.milestone-ico{font-size:38px}
.milestone-h{font-size:16px;font-weight:900;margin-top:4px}
.milestone-s{font-size:12px;color:var(--txt2);font-weight:700;margin-top:2px}
/* Settings rows */
.setrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--bg2)}
.setrow:last-child{border-bottom:none}
.setrow-body{flex:1;min-width:0;cursor:pointer}
.setrow-name{font-size:13px;font-weight:800;color:var(--txt)}
.setrow-meta{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:1px}
.iconbtn{border:none;background:none;font-size:16px;cursor:pointer;padding:6px;color:var(--txt3)}
.iconbtn.danger{color:var(--rose)}
.formbox{background:var(--card2);border-radius:13px;padding:12px;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toast-host"></div>
<script>
// ─── Constants ──────────────────────────────────────────────────────────────
const LS = {
  people:'pp:people', accounts:'pp:accounts', categories:'pp:categories',
  recurring:'pp:recurring', goals:'pp:goals', debts:'pp:debts',
  debtPayments:'pp:debtPayments', contributions:'pp:contributions',
  cardCharges:'pp:cardCharges', transactions:'pp:transactions', settings:'pp:settings'
};
const BOTH='both';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ACCT_TYPES = {checking:'🏦 Checking',savings:'🌱 Savings',hysa:'🌱 High-yield savings',investment:'📈 Investment / Roth IRA',credit:'💳 Credit card'};
const ACCT_ICONS = {checking:'🏦',savings:'🌱',hysa:'🌱',investment:'📈',credit:'💳'};
const FREQS = {weekly:'Weekly',biweekly:'Every 2 weeks',semimonthly:'Twice a month',monthly:'Monthly'};
const FALLBACK_COLORS=['#93c5fd','#fdba74','#c4b5fd','#6ee7b7','#fde68a','#f0abfc','#a5f3fc','#fca5a5'];
const CARD_LIMIT_DEFAULT = 1000;

// ─── Helpers ────────────────────────────────────────────────────────────────
function uuid(){ return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);})); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); } // safe for embedding inside onclick="...('...')"
function parseAmt(v){ if(typeof v==='number')return v; return parseFloat(String(v||'').replace(/[$,]/g,''))||0; }
const f$ = n => '$'+(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0 = n => (n<0?'-':'')+'$'+Math.round(Math.abs(+n||0)).toLocaleString('en-US');

// ─── Storage layer ────────────────────────────────────────────────────────────
function loadKey(key,fallback){ try{ const v=JSON.parse(localStorage.getItem(key)); return v==null?fallback:v; }catch(e){ return fallback; } }
const D = {}; // in-memory mirror of all localStorage data
function commit(name){ localStorage.setItem(LS[name], JSON.stringify(D[name])); }

function seedPeople(){ return [{id:'ateeq',name:'Ateeq',emoji:'🧔'},{id:'celeste',name:'Celeste',emoji:'👩'}]; }
function seedCategories(){
  return [
    {id:uuid(),name:'Groceries',icon:'🛒',color:'#93c5fd',budget:600},
    {id:uuid(),name:'Dining Out',icon:'🍽️',color:'#fdba74',budget:200},
    {id:uuid(),name:'Entertainment',icon:'🎮',color:'#c4b5fd',budget:150},
    {id:uuid(),name:'Transportation',icon:'🚗',color:'#6ee7b7',budget:100},
    {id:uuid(),name:'Utilities',icon:'💡',color:'#fde68a',budget:150},
    {id:uuid(),name:'Health',icon:'🏥',color:'#fda4b8',budget:100},
    {id:uuid(),name:'Shopping',icon:'🛍️',color:'#f0abfc',budget:150},
    {id:uuid(),name:'Personal/Misc',icon:'📦',color:'#f9a8d4',budget:100},
    {id:uuid(),name:"Patches' Expenses",icon:'🐱',color:'#fbcfe8',budget:75},
  ];
}
function seedSettings(){
  return {budgetsOpen:true, strategy:'snowball', person:'All', moneyTab:'overview', settingsTab:'accounts',
    milestones:{}, moneyDate:{}, netWorthSnapshots:{}};
}

function initData(){
  D.people = loadKey(LS.people, null) || seedPeople();
  D.accounts = loadKey(LS.accounts, null) || [];
  D.categories = loadKey(LS.categories, null) || seedCategories();
  D.recurring = loadKey(LS.recurring, []);
  D.goals = loadKey(LS.goals, []);
  D.debts = loadKey(LS.debts, []);
  D.debtPayments = loadKey(LS.debtPayments, []);
  D.contributions = loadKey(LS.contributions, []);
  D.cardCharges = loadKey(LS.cardCharges, []);
  D.transactions = loadKey(LS.transactions, []);
  D.settings = loadKey(LS.settings, null) || seedSettings();
  Object.keys(LS).forEach(k=>commit(k));
}

// ─── Category helpers (single live source — fixes "categories don't persist") ─
function getCategories(){ return D.categories; }
function catByName(name){ return D.categories.find(c=>c.name===name); }
function catIcon(name){ const c=catByName(name); return c?c.icon:'📦'; }
function catColor(name){ const c=catByName(name); return c?c.color:'#f9a8d4'; }
function catBudget(name){ const c=catByName(name); return c?(+c.budget||0):0; }

// ─── People helpers ───────────────────────────────────────────────────────────
function personById(id){ return D.people.find(p=>p.id===id); }
function personName(id){ if(id===BOTH)return 'Both'; const p=personById(id); return p?p.name:'—'; }
function personEmoji(id){ if(id===BOTH)return '👫'; const p=personById(id); return p?p.emoji:'🙂'; }
function payerOptions(){ return [...D.people, {id:BOTH,name:'Both',emoji:'👫'}]; }
function cardholderId(){ return D.people[0]?D.people[0].id:'ateeq'; } // sole cardholder per spec

// ─── Account helpers ──────────────────────────────────────────────────────────
function acctById(id){ return D.accounts.find(a=>a.id===id); }
function goalById(id){ return D.goals.find(g=>g.id===id); }
function cards(){ return D.accounts.filter(a=>a.type==='credit'); }
function spendAccounts(){ return D.accounts.filter(a=>a.type!=='credit'); }

// ─── UI state (ephemeral, not persisted) ──────────────────────────────────────
const now0=new Date();
const S = {
  view:'home', month:now0.getMonth()+1, year:now0.getFullYear(),
  modal:null,
  addMode:'expense',
  form:{ desc:'', amount:'', cat:'', payer:'ateeq', date:todayStr(), notes:'', need:'need', sub:false, payWith:'cash' },
  incomeForm:{ desc:'', amount:'', source:'ateeq', date:todayStr() },
  moveForm:{ amount:'', from:'', to:'', owner:BOTH },
  goalForm:{ name:'', target:'', saved:'', date:'' },
  acctFormOpen:false, acctForm:{ name:'', owner:'shared', type:'checking', balance:'', apy:'', limit:'' }, acctEditId:null,
  debtFormOpen:false, debtForm:{ name:'', owner:'celeste', balance:'', apr:'', minPayment:'', highPriority:false }, debtEditId:null,
  goalFormOpen:false,
  catForm:{ name:'', icon:'', budget:'' }, catEditId:null,
  recurFormOpen:false, recurForm:{ name:'', kind:'bill', category:'', amount:'', payer:'ateeq', frequency:'monthly', dayOfMonth:'1', destType:'account', destId:'', flowType:'invest' }, recurEditId:null,
  peopleForm:null,
  moneyTab:'overview', person:'All',
  milestone:null,
  scan:{ status:'idle', error:'', imageDataUrl:'', imageB64:'', mediaType:'', rows:null, payer:BOTH },
};

// ─── Month filter ─────────────────────────────────────────────────────────────
function inMonth(dateStr,m,y){ const p=String(dateStr||'').split('-'); return +p[0]===y && +p[1]===m; }
function txForMonth(){ return D.transactions.filter(t=>inMonth(t.date,S.month,S.year)); }
function contribsForMonth(){ return D.contributions.filter(c=>inMonth(c.date,S.month,S.year)); }
function debtPaysForMonth(){ return D.debtPayments.filter(p=>inMonth(p.date,S.month,S.year)); }

// ─── Computations ─────────────────────────────────────────────────────────────
function totalExpenses(){ return txForMonth().filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0); }
function catTotals(){
  const o={};
  txForMonth().filter(t=>t.kind==='expense').forEach(t=>{ const c=t.category||'Personal/Misc'; o[c]=(o[c]||0)+t.amount; });
  return o;
}
function personTotals(){
  const totals={}; D.people.forEach(p=>totals[p.id]=0);
  txForMonth().filter(t=>t.kind==='expense').forEach(t=>{
    if(t.payer===BOTH){ D.people.forEach(p=>totals[p.id]+=t.amount/D.people.length); }
    else if(totals[t.payer]!=null) totals[t.payer]+=t.amount;
  });
  return totals;
}
function settleUp(){
  // ateeqNet = what Ateeq covered out of pocket minus what he owed (only meaningful for 2-person households)
  if(D.people.length<2) return {net:0,aId:null,bId:null};
  const aId=D.people[0].id, bId=D.people[1].id;
  let aPaid=0,aOwes=0;
  txForMonth().filter(t=>t.kind==='expense').forEach(t=>{
    const a=t.amount;
    if(t.payer===BOTH){ aPaid+=a/2; aOwes+=a/2; }
    else if(t.payer===aId){ aPaid+=a; aOwes+=a; }
  });
  return {net:aPaid-aOwes, aId, bId};
}
function incomeTotals(){
  const totals={}; D.people.forEach(p=>totals[p.id]=0); let total=0;
  txForMonth().filter(t=>t.kind==='income').forEach(t=>{
    total+=t.amount;
    if(t.payer===BOTH){ D.people.forEach(p=>totals[p.id]+=t.amount/D.people.length); }
    else if(totals[t.payer]!=null) totals[t.payer]+=t.amount;
  });
  return {byPerson:totals, total};
}
function monthHealth(){
  const exp=totalExpenses(), inc=incomeTotals().total, net=inc-exp;
  if(inc===0 && exp===0) return {emoji:'🐱',title:'Fresh start',sub:'Log something to get going',score:'neutral'};
  if(net>=inc*0.2 && inc>0) return {emoji:'😻',title:'Crushing it',sub:`Saved ${f0(net)} so far this month`,score:'great'};
  if(net>=0) return {emoji:'😺',title:'On track',sub:`${f0(net)} left of this month's income`,score:'good'};
  if(net>-inc*0.15) return {emoji:'🙀',title:'Cutting it close',sub:`${f0(Math.abs(net))} over income`,score:'warn'};
  return {emoji:'😿',title:'Over budget',sub:`${f0(Math.abs(net))} more spent than earned`,score:'bad'};
}
function goalPct(g){ const saved=+g.saved||0, target=+g.target||0; return target>0?Math.min((saved/target)*100,100):0; }
function debtPctPaid(d){ return d.startBalance>0?Math.min(((d.startBalance-d.balance)/d.startBalance)*100,100):0; }
function daysUntil(d){ if(!d)return null; const diff=Math.ceil((new Date(d)-new Date())/864e5); return diff>0?diff:null; }

// ─── Recurring engine (weekly / biweekly / twice-monthly / monthly) ──────────
function flowMonthly(amount,freq){
  switch(freq){ case 'weekly': return amount*52/12; case 'biweekly': return amount*26/12; case 'semimonthly': return amount*2; default: return amount; }
}
function daysBetween(a,b){ return Math.floor((b-a)/864e5); }
function dueFrequency(freq,last,now){
  if(!last) return true;
  if(freq==='weekly') return daysBetween(last,now)>=7;
  if(freq==='biweekly') return daysBetween(last,now)>=14;
  if(freq==='semimonthly'){
    const half=d=>d.getDate()<15?'a':'b';
    return (now.getFullYear()+'-'+now.getMonth()+half(now)) !== (last.getFullYear()+'-'+last.getMonth()+half(last));
  }
  return now.getFullYear()!==last.getFullYear() || now.getMonth()!==last.getMonth();
}
function runDueRecurring(){
  const now=new Date();
  let changed=false;
  D.recurring.filter(r=>r.active!==false).forEach(r=>{
    const last=r.lastRun?new Date(r.lastRun+'T00:00:00'):null;
    if(!dueFrequency(r.frequency,last,now)) return;
    if(r.kind==='bill'){
      addTransactionRaw({date:todayStr(),desc:r.name,category:r.category,payer:r.payer,amount:+r.amount,kind:'expense',need:r.need||'need',sub:!!r.sub,notes:'Auto-logged recurring bill',txType:'recurring',recurringId:r.id});
    } else {
      addContributionRaw({date:todayStr(),flowType:r.flowType||'invest',amount:+r.amount,accountId:r.destType==='account'?r.destId:'',goalId:r.destType==='goal'?r.destId:'',payer:r.payer,notes:'Auto-logged recurring: '+r.name,source:'auto'});
    }
    r.lastRun=todayStr();
    changed=true;
  });
  if(changed) commit('recurring');
}

// ─── Transactions (expense / income / transfer) ───────────────────────────────
function addTransactionRaw(t){ t.id=t.id||uuid(); D.transactions.push(t); commit('transactions'); return t; }
function deleteTransactionById(id){ D.transactions=D.transactions.filter(t=>t.id!==id); commit('transactions'); }

// ─── Contributions (invest = money into account/goal, divest = out) ──────────
function addContributionRaw(c){
  c.id=c.id||uuid();
  const amt=+c.amount||0, sign=c.flowType==='divest'?-1:1;
  if(c.accountId){ const a=acctById(c.accountId); if(a) a.balance=(+a.balance||0)+sign*amt; }
  if(c.goalId){ const g=goalById(c.goalId); if(g){ if(c.flowType==='divest') g.saved=Math.max((+g.saved||0)-amt,0); else g.saved=(+g.saved||0)+amt; } }
  D.contributions.push(c);
  commit('contributions'); commit('accounts'); commit('goals');
  return c;
}

// ─── Credit card queue (FIFO settle) ─────────────────────────────────────────
function chargeCard(accountId,{date,desc,category,payer,amount,notes}){
  const card=acctById(accountId); if(!card) return null;
  const amt=+amount||0;
  card.balance=(+card.balance||0)+amt;
  const charge={id:uuid(),accountId,date:date||todayStr(),desc,category,payer:payer||'ateeq',amount:amt,settled:false,notes:notes||''};
  D.cardCharges.push(charge);
  commit('accounts'); commit('cardCharges');
  return charge;
}
function payCard(accountId,amount,fromAccountId){
  const card=acctById(accountId); if(!card) return {error:'Card not found'};
  const bal=+card.balance||0;
  const applied=Math.min(+amount||0,bal);
  card.balance=bal-applied;
  if(fromAccountId){ const src=acctById(fromAccountId); if(src) src.balance=(+src.balance||0)-applied; }
  let remaining=applied, settledCount=0;
  const unsettled=D.cardCharges.filter(c=>c.accountId===accountId && !c.settled).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for(const charge of unsettled){
    if(remaining<=0.001) break;
    if(charge.amount<=remaining+0.001){
      charge.settled=true;
      addTransactionRaw({date:charge.date,desc:charge.desc,category:charge.category,payer:charge.payer,amount:charge.amount,kind:'expense',need:'need',sub:false,notes:'Card charge — taken as charged',txType:'one-time',cardSettled:true});
      remaining-=charge.amount; settledCount++;
    } else {
      addTransactionRaw({date:charge.date,desc:charge.desc+' (partial)',category:charge.category,payer:charge.payer,amount:remaining,kind:'expense',need:'need',sub:false,notes:'Card charge — taken as charged',txType:'one-time',cardSettled:true});
      charge.amount-=remaining;
      remaining=0; settledCount++;
    }
  }
  commit('accounts'); commit('cardCharges');
  return {success:true, paid:applied, newBalance:card.balance, settled:settledCount};
}

// ─── Plan ("every dollar has a job") ─────────────────────────────────────────
function planTotals(){
  const budgetTotal=D.categories.reduce((s,c)=>s+(+c.budget||0),0);
  const flowInvest=D.recurring.filter(r=>r.active!==false && r.kind==='transfer' && (r.flowType||'invest')==='invest').reduce((s,r)=>s+flowMonthly(+r.amount||0,r.frequency),0);
  const debtMins=D.debts.filter(d=>d.balance>0).reduce((s,d)=>s+(+d.minPayment||0),0);
  const oneTimeSaved=contribsForMonth().filter(c=>c.source!=='auto').reduce((s,c)=>s+(c.flowType==='invest'?c.amount:-c.amount),0);
  const income=incomeTotals().total;
  return {income,budgetTotal,flowInvest,debtMins,oneTimeSaved,unalloc:income-(budgetTotal+flowInvest+debtMins+Math.max(oneTimeSaved,0))};
}

// ─── Money tab math ───────────────────────────────────────────────────────────
function byOwner(list){ return S.person==='All'?list:list.filter(x=>(x.owner||'shared')===S.person||(x.owner||'shared')==='shared'); }
function netWorth(){
  const assets=spendAccounts().reduce((s,a)=>s+(+a.balance||0),0);
  const owed=cards().reduce((s,a)=>s+(+a.balance||0),0)+D.debts.reduce((s,d)=>s+(+d.balance||0),0);
  return {assets,owed,net:assets-owed};
}
function snapshotNetWorth(){
  const ym=todayStr().slice(0,7);
  D.settings.netWorthSnapshots[ym]=netWorth().net;
  commit('settings');
}
function prevMonthKey(){ let m=S.month-1,y=S.year; if(m<1){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
function netWorthChange(){
  const prev=D.settings.netWorthSnapshots[prevMonthKey()];
  if(prev==null) return null;
  return netWorth().net-prev;
}
function debtPace(d){
  const cutoff=new Date(Date.now()-90*864e5);
  const paid90=D.debtPayments.filter(p=>p.debtId===d.id && new Date(p.date)>=cutoff).reduce((s,p)=>s+p.amount,0);
  return Math.max(paid90/3, +d.minPayment||0);
}
function strategyNext(){
  const open=byOwner(D.debts).filter(d=>d.balance>0);
  if(!open.length) return null;
  const sorted=[...open].sort((a,b)=> D.settings.strategy==='avalanche' ? ((+b.apr||0)-(+a.apr||0))||(a.balance-b.balance) : (a.balance-b.balance));
  return sorted[0];
}

// ─── Render router ────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  let body='';
  if(S.view==='home') body=homeHTML();
  else if(S.view==='add') body=addHTML();
  else if(S.view==='money') body=moneyHTML();
  else if(S.view==='goals') body=goalsHTML();
  else if(S.view==='recap') body=recapHTML();
  else if(S.view==='settings') body=settingsHTML();
  else if(S.view==='moneydate') body=moneydateHTML();
  else body=homeHTML();
  app.innerHTML = topbarHTML() + body + navHTML() + (S.milestone?milestoneHTML():'') + (S.modal?modalHTML():'');
  if(S.view==='money' && S.moneyTab==='trends') requestAnimationFrame(drawCharts);
}
function go(v){ S.view=v; window.scrollTo(0,0); render(); }
function shiftMonth(d){ let m=S.month+d,y=S.year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} S.month=m;S.year=y; render(); }
function toggleBudgets(){ D.settings.budgetsOpen=!D.settings.budgetsOpen; commit('settings'); render(); }

function topbarHTML(){
  const showMonth = ['home','money','recap','moneydate'].includes(S.view);
  return `<div class="topbar">
    <div class="wordmark">Patchin<em>Pennies</em></div>
    <div style="display:flex;align-items:center;gap:10px">
      ${showMonth?`<div class="month-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <span class="mlabel">${MONTHS_SHORT[S.month-1]} ${S.year}</span>
        <button onclick="shiftMonth(1)">›</button>

function txRowHTML(t){

  const icon = isIncome?'💰':isTransfer?'🔁':catIcon(cat);
  const bg = isIncome?'var(--mint-soft)':isTransfer?'var(--sky-soft)':catColor(cat)+'33';

  const badges = (t.payer===BOTH?`<span class="tx-badge badge-both">Split</span>`:'') + (isRecur?`<span class="tx-badge badge-recur">Auto</span>`:'') + (t.cardSettled?`<span class="tx-badge badge-card">Card</span>`:'');

function planCardHTML(){

function resetScan(){ S.scan={status:'idle',error:'',imageDataUrl:'',imageB64:'',mediaType:'',rows:null,payer:S.scan.payer||BOTH}; }
function cancelScan(){ resetScan(); render(); }

function handleStatementFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxDim=1800;
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      S.scan.imageDataUrl=canvas.toDataURL('image/jpeg',0.9);
      S.scan.imageB64=S.scan.imageDataUrl.split(',')[1];
      S.scan.mediaType='image/jpeg';
      S.scan.status='ready'; S.scan.error='';
      render();
    };
    img.onerror=()=>showToast('⚠️ Could not read that image');
    img.src=reader.result;
  };
  reader.onerror=()=>showToast('⚠️ Could not read that file');
  reader.readAsDataURL(file);
}

function findLikelyDuplicate(parsed){
  const kind=parsed.kind==='income'?'income':'expense';
  const amt=Math.abs(+parsed.amount||0);
  const pd=new Date(parsed.date+'T00:00:00'); if(isNaN(pd)) return null;
  return D.transactions.find(t=>{
    if(t.kind!==kind) return false;
    if(Math.abs(t.amount-amt)>0.01) return false;
    const td=new Date(t.date+'T00:00:00'); if(isNaN(td)) return false;
    return Math.abs(td-pd)<=864e5;
  });
}

async function runStatementScan(){
  const key=getApiKey();
  if(!key){ S.scan.status='error'; S.scan.error='Add your Anthropic API key in Settings → App first.'; render(); return; }
  if(!S.scan.imageB64){ showToast('⚠️ Choose a photo first'); return; }
  S.scan.status='scanning'; S.scan.error=''; render();
  const categoryNames=D.categories.map(c=>c.name);
  const schema={
    type:'object',
    properties:{ transactions:{ type:'array', items:{ type:'object', properties:{
      date:{type:'string'}, description:{type:'string'}, amount:{type:'number'},
      kind:{type:'string',enum:['expense','income','skip']}, category:{type:'string'}
    }, required:['date','description','amount','kind','category'], additionalProperties:false } } },
    required:['transactions'], additionalProperties:false
  };
  const prompt=`You are reading a photo of a bank or credit card statement. Extract every line-item transaction you can see.

Today's date is ${todayStr()}. If a printed date has no year, infer it from the statement's own dates or from today's date — never invent a future date unless the statement is clearly future-dated.

For each transaction output:
- date: YYYY-MM-DD
- description: the merchant/payee as printed (clean up obvious OCR noise but keep it recognizable)
- amount: a positive number, no currency symbol
- kind: "expense" for a purchase/charge/debit, "income" for a deposit/refund/credit paid TO the account holder, or "skip" for anything that isn't a real transaction to log (statement balance lines, minimum-payment lines, the card's own autopay/payment line, running totals, headers/footers)
- category: pick the single closest match from this exact list (copy the text exactly): ${JSON.stringify(categoryNames)} — if nothing fits well, use ""

Return every transaction you can read, even if partially obscured — do your best rather than skipping unclear ones.`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:getScanModel(),
        max_tokens:8000,
        output_config:{format:{type:'json_schema',schema}},
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:S.scan.mediaType,data:S.scan.imageB64}},
          {type:'text',text:prompt}
        ]}]
      })
    });
    const data=await resp.json();
    if(!resp.ok) throw new Error((data&&data.error&&data.error.message)||('HTTP '+resp.status));
    if(data.stop_reason==='refusal') throw new Error('Claude declined to read this image'+(data.stop_details&&data.stop_details.explanation?': '+data.stop_details.explanation:'.'));
    const textBlock=(data.content||[]).find(b=>b.type==='text');
    if(!textBlock) throw new Error('No response content');
    const parsed=JSON.parse(textBlock.text);
    const txns=(parsed.transactions||[]).filter(t=>t&&t.date&&t.kind);
    if(!txns.length) throw new Error('Could not find any transactions in that image');
    S.scan.rows=txns.map((t,i)=>{
      const dup=t.kind!=='skip'?findLikelyDuplicate(t):null;
      const kind=t.kind==='income'?'income':t.kind==='skip'?'skip':'expense';
      return { id:i, date:t.date, desc:t.description||'', amount:Math.abs(+t.amount||0), kind,
        category:categoryNames.includes(t.category)?t.category:(categoryNames[0]||''),
        include: kind!=='skip' && !dup, duplicate:!!dup };
    });
    S.scan.status='results';
  }catch(e){
    S.scan.error=e.message||'Something went wrong reading that image';
    S.scan.status='error';
  }
  render();
}

  if(key==='kind') r.include = (val!=='skip');

function importScanRows(){

  rows.forEach(r=>{

  });
  showToast(`✅ Imported ${rows.length} transaction${rows.length!==1?'s':''}`);
  resetScan();
  go('home');

function sankeyHTML(){
  const income=incomeTotals().total;
  const invested=contribsForMonth().filter(c=>c.flowType==='invest').reduce((s,c)=>s+c.amount,0);
  const debtPaid=debtPaysForMonth().reduce((s,p)=>s+p.amount,0);
  const catsArr=Object.entries(catTotals()).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const MAXB=5;
  const branches=[];
  if(invested>0) branches.push({name:'Invested & saved',amt:invested,color:'#34d399'});
  if(debtPaid>0) branches.push({name:'Debt payoff',amt:debtPaid,color:'#60a5fa'});
  const big=catsArr.slice(0,MAXB), rest=catsArr.slice(MAXB);
  big.forEach(([c,v])=>branches.push({name:c,amt:v,color:catColor(c)}));
  const restSum=rest.reduce((s,[,v])=>s+v,0);
  if(restSum>0) branches.push({name:'Everything else',amt:restSum,color:'#b89aad'});
  const outSum=branches.reduce((s,b)=>s+b.amt,0);
  if(!outSum) return `<div class="card"><div class="cf-eyebrow" style="color:var(--txt3)">Cash flow · ${MONTHS[S.month-1]}</div><div class="empty" style="padding:20px 8px"><div class="empty-ico">🌊</div><div class="empty-h">Nothing to flow yet</div><div class="empty-s">Log spending or income to see it here</div></div></div>`;
  const leftover=income-outSum;
  if(income>0&&leftover>0.5) branches.push({name:'Unspent',amt:leftover,color:'#fbbf24'});
  const total=Math.max(income,outSum);
  if(total<=0) return '';

  const W=340, x1=16, x2=228, labelX=236, gap=8, minT=5, pad=8;
  const flowPx=Math.max(branches.length*26, 150);
  const scale=flowPx/total;
  const th=branches.map(b=>Math.max(b.amt*scale,minT));
  const H=pad*2+th.reduce((s,t)=>s+t,0)+gap*(branches.length-1);
  const srcH=th.reduce((s,t)=>s+t,0);
  const srcY=(H-srcH)/2;
  let sy=srcY, ty=pad;
  const defs=[], ribbons=[], labels=[];
  branches.forEach((b,i)=>{
    const t=th[i], mid=(x1+6+x2)/2;
    const ys0=sy, ys1=sy+t, yt0=ty, yt1=ty+t;
    defs.push(`<linearGradient id="cfg${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635" stop-opacity=".55"/><stop offset="1" stop-color="${b.color}" stop-opacity=".9"/></linearGradient>`);
    ribbons.push(`<path d="M${x1+6},${ys0} C${mid},${ys0} ${mid},${yt0} ${x2},${yt0} L${x2},${yt1} C${mid},${yt1} ${mid},${ys1} ${x1+6},${ys1} Z" fill="url(#cfg${i})"/>`);
    ribbons.push(`<rect x="${x2}" y="${yt0}" width="3.5" height="${t}" rx="1.5" fill="${b.color}"/>`);
    const pct=Math.round((b.amt/total)*100);
    const lblY=yt0+t/2;
    labels.push(`<text class="cf-lbl" x="${labelX}" y="${lblY-1}">${esc(b.name.length>17?b.name.slice(0,16)+'…':b.name)}</text>`);
    labels.push(`<text class="cf-amt" x="${labelX}" y="${lblY+10}">${f0(b.amt)} (${pct}%)</text>`);
    sy=ys1; ty=yt1+gap;
  });
  const cashflow=income-totalExpenses()-invested-debtPaid;
  return `<div class="cf-card">
    <div class="cf-eyebrow">Cash flow · ${MONTHS[S.month-1]}</div>
    <svg class="cf-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>${defs.join('')}</defs>
      <rect x="${x1}" y="${srcY}" width="4" height="${srcH}" rx="2" fill="#a3e635"/>
      ${income>0?`<text class="cf-amt" x="${x1}" y="${Math.max(srcY-6,9)}">In: ${f0(income)}</text>`:''}
      ${ribbons.join('')}
      ${labels.join('')}
    </svg>
    <div class="cf-totals">
      <div><div class="cf-tot-lbl">Total income</div><div class="cf-tot-val">${f0(income)}</div></div>
      <div><div class="cf-tot-lbl">Total expenses</div><div class="cf-tot-val">${f0(totalExpenses())}</div></div>
      <div style="text-align:right"><div class="cf-tot-lbl">Cash flow / mo</div><div class="cf-tot-val" style="color:${cashflow>=0?'#6ee7b7':'#fda4b8'}">${cashflow>=0?'+':'−'}${f0(Math.abs(cashflow))}</div></div>
    </div>
  </div>`;
}

let _charts={};
function drawCharts(){
  Object.values(_charts).forEach(c=>{try{c.destroy()}catch(e){}}); _charts={};
  const cats=catTotals();
  const entries=Object.entries(cats).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const catCanvas=document.getElementById('catChart');
  if(catCanvas&&entries.length){
    _charts.cat=new Chart(catCanvas,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:entries.map(e=>catColor(e[0])),borderWidth:2,borderColor:'#fff'}]},options:{plugins:{legend:{position:'bottom',labels:{font:{family:'Nunito',weight:'700',size:10},padding:9,boxWidth:11,usePointStyle:true}}},cutout:'62%',maintainAspectRatio:false}});
  }
  const trendCanvas=document.getElementById('trendChart');
  if(trendCanvas){
    const labels=[],exp=[],inc=[];
    for(let i=5;i>=0;i--){
      let m=S.month-i,y=S.year; while(m<=0){m+=12;y--;}
      labels.push(MONTHS_SHORT[m-1]);
      const monthTx=D.transactions.filter(t=>inMonth(t.date,m,y));
      exp.push(monthTx.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0));
      inc.push(monthTx.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount,0));
    }
    _charts.trend=new Chart(trendCanvas,{type:'line',data:{labels,datasets:[
      {label:'Spent',data:exp,borderColor:'#f472b6',backgroundColor:'#f472b622',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:'#f472b6'},
      {label:'Income',data:inc,borderColor:'#34d399',backgroundColor:'#34d39911',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:'#34d399'}
    ]},options:{plugins:{legend:{position:'bottom',labels:{font:{family:'Nunito',weight:'700',size:10},usePointStyle:true,boxWidth:9}}},scales:{y:{ticks:{font:{family:'DM Mono',size:9},callback:v=>'$'+v},grid:{color:'#f0d6e833'}},x:{ticks:{font:{family:'Nunito',weight:'700',size:10}},grid:{display:false}}},maintainAspectRatio:false}});
  }
  const pc=document.getElementById('personChart');
  if(pc){
    const persons=personTotals();
    _charts.person=new Chart(pc,{type:'bar',data:{labels:D.people.map(p=>p.name),datasets:[{data:D.people.map(p=>persons[p.id]||0),backgroundColor:D.people.map((p,i)=>['#60a5fa','#a78bfa','#fbcfe8'][i%3]),borderRadius:8,barThickness:38}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{font:{family:'DM Mono',size:9},callback:v=>'$'+v},grid:{color:'#f0d6e833'}},x:{ticks:{font:{family:'Nunito',weight:'800',size:11}},grid:{display:false}}},maintainAspectRatio:false}});
  }
}

    ${next?`<div class="strategy">
      <div class="card-title-row" style="margin-bottom:0"><span class="card-title">🧭 Extra dollars go to…</span>
        <div class="seg" style="background:rgba(255,255,255,.6)">${['snowball','avalanche'].map(s=>`<div class="seg-opt ${D.settings.strategy===s?'on':''}" onclick="setStrategy('${s}')">${s==='snowball'?'⛄ Snowball':'🏔️ Avalanche'}</div>`).join('')}</div>
      </div>
      <div class="strategy-msg">Next target: <b>${esc(next.name)}</b> (${f0(next.balance)})${D.settings.strategy==='snowball'?' — smallest balance first for quick wins.':allZeroApr?' — add interest rates (✏️ Edit) so avalanche can rank by rate.':' — highest interest rate first to save the most.'}</div>
    </div>`:''}`:`<div class="card">
      <div class="card-title-row"><span class="card-title">💳 Debt payoff</span><button class="card-toggle" onclick="toggleDebtForm()">＋ Add</button></div>
      ${S.debtFormOpen?debtFormHTML():`<div class="empty"><div class="empty-ico">🕊️</div><div class="empty-h">No debts</div><div class="empty-s">Nothing to pay off — living the dream</div></div>`}

// ─── Goals actions ─────────────────────────────────────────────────────────────
function submitDebt(){
  const f=S.debtForm;
  const bal=parseFloat(f.balance);
  if(!f.name.trim()||!bal||isNaN(bal)){ showToast('⚠️ Name + balance needed'); return; }
  if(S.debtEditId){
    const d=D.debts.find(x=>x.id===S.debtEditId);
    if(d){ d.name=f.name; d.owner=f.owner; d.balance=bal; d.apr=parseFloat(f.apr)||0; d.minPayment=parseFloat(f.minPayment)||0; d.highPriority=!!f.highPriority; commit('debts'); }
    showToast('✏️ Debt updated');
  } else {
    D.debts.push({id:uuid(),name:f.name,owner:f.owner,startBalance:bal,balance:bal,apr:parseFloat(f.apr)||0,minPayment:parseFloat(f.minPayment)||0,highPriority:!!f.highPriority,created:todayStr()});
    commit('debts');
    showToast('💳 Debt added');
  }
  S.debtFormOpen=false; S.debtEditId=null; S.debtForm={name:'',owner:'celeste',balance:'',apr:'',minPayment:'',highPriority:false};
  render();
}
function openDebtEdit(id){
  const d=D.debts.find(x=>x.id===id); if(!d)return;
  S.debtForm={name:d.name,owner:d.owner,balance:String(d.balance),apr:String(d.apr||''),minPayment:String(d.minPayment||''),highPriority:!!d.highPriority};
  S.debtEditId=id; S.debtFormOpen=true; render();
}
function removeDebt(id){
  const d=D.debts.find(x=>x.id===id); if(!d)return;
  confirmModal(`Delete "${esc(d.name)}" and its payment history?`,'Delete',`D.debts=D.debts.filter(x=>x.id!=='${id}');D.debtPayments=D.debtPayments.filter(x=>x.debtId!=='${id}');commit('debts');commit('debtPayments');showToast('🗑 Deleted');render();`);
}
function removeGoal(id){
  const g=D.goals.find(x=>x.id===id); if(!g)return;
  confirmModal(`Delete "${esc(g.name)}"?`,'Delete',`D.goals=D.goals.filter(x=>x.id!=='${id}');commit('goals');showToast('🗑 Deleted');render();`);
}
function submitGoal(){
  const f=S.goalForm;
  const target=parseFloat(f.target);
  if(!f.name.trim()||!target||isNaN(target)){ showToast('⚠️ Name + target needed'); return; }
  D.goals.push({id:uuid(),name:f.name,target,saved:parseFloat(f.saved)||0,targetDate:f.date||'',notes:'',created:todayStr()});
  commit('goals');
  showToast('🎯 Goal created!');
  S.goalForm={name:'',target:'',saved:'',date:''}; S.goalFormOpen=false;
  render();
}

function recapHTML(){
  const inc=incomeTotals(), exp=totalExpenses(), net=inc.total-exp;
  const cats=catTotals();
  const top=Object.entries(cats).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const persons=personTotals();
  const all=[...txForMonth()].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const txList=all.length?all.map(t=>txRowHTML(t)).join(''):`<div class="empty"><div class="empty-ico">🐾</div><div class="empty-h">No transactions</div></div>`;
  const wants=txForMonth().filter(t=>t.kind==='expense'&&t.need==='want').reduce((s,t)=>s+t.amount,0);
  const subs=txForMonth().filter(t=>t.kind==='expense'&&t.sub).reduce((s,t)=>s+t.amount,0);
  const invested=contribsForMonth().filter(c=>c.flowType==='invest').reduce((s,c)=>s+c.amount,0);
  const debtPaid=debtPaysForMonth().reduce((s,p)=>s+p.amount,0);
  const nwChange=netWorthChange();
  const budgetRows = D.categories.filter(c=>(+c.budget||0)>0).map(c=>{
    const spent=cats[c.name]||0, budget=+c.budget||0, pct=budget>0?Math.min((spent/budget)*100,100):0;
    const cls=pct<70?'safe':pct<90?'warn':'danger';
    return `<div><div class="bud-row"><span class="bud-name">${c.icon} ${esc(c.name)}</span><span class="bud-nums">${f0(spent)} / ${f0(budget)}</span></div><div class="track"><div class="track-fill ${cls}" style="width:${pct}%"></div></div></div>`;
  }).join('');
  return `
    <div class="section-title">${MONTHS[S.month-1]} recap</div>
    <div class="card" onclick="go('moneydate')" style="cursor:pointer;background:linear-gradient(135deg,var(--pink-soft),var(--yellow-soft))">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="card-title">💞 Money date</div><div style="font-size:11.5px;color:var(--txt2);font-weight:600;margin-top:2px">Close out the month together — 10 minutes</div></div>
        <span style="font-size:20px;color:var(--txt3)">›</span>
      </div>
    </div>
    <div class="card">
      <div class="recap-stat"><span class="recap-lbl">💰 Income</span><span class="recap-val" style="color:var(--mint)">${f$(inc.total)}</span></div>
      <div class="recap-stat"><span class="recap-lbl">💸 Spent</span><span class="recap-val" style="color:var(--pink)">${f$(exp)}</span></div>
      <div class="recap-stat"><span class="recap-lbl">✨ …of which wants</span><span class="recap-val" style="color:var(--peach)">${f$(wants)}</span></div>
      <div class="recap-stat"><span class="recap-lbl">📱 …subscriptions</span><span class="recap-val" style="color:var(--lavender)">${f$(subs)}<span style="font-size:10px;color:var(--txt3)"> · ${f0(subs*12)}/yr pace</span></span></div>
      <div class="recap-stat"><span class="recap-lbl">🌱 Invested / saved</span><span class="recap-val" style="color:var(--mint)">${f$(invested)}</span></div>
      <div class="recap-stat"><span class="recap-lbl">💳 Debt paid</span><span class="recap-val" style="color:var(--sky)">${f$(debtPaid)}</span></div>
      <div class="recap-stat"><span class="recap-lbl">${net>=0?'🎉 Net':'⚠️ Net'}</span><span class="recap-val" style="color:${net>=0?'var(--mint)':'var(--rose)'}">${net>=0?'+':'-'}${f$(Math.abs(net))}</span></div>
      ${nwChange!=null?`<div class="recap-stat"><span class="recap-lbl">📈 Net worth change</span><span class="recap-val" style="color:${nwChange>=0?'var(--mint)':'var(--rose)'}">${nwChange>=0?'+':'-'}${f$(Math.abs(nwChange))}</span></div>`:''}
      ${D.people.map(p=>`<div class="recap-stat"><span class="recap-lbl">${p.emoji} ${esc(p.name)} spent</span><span class="recap-val">${f$(persons[p.id]||0)}</span></div>`).join('')}
    </div>
    ${budgetRows?`<div class="card"><div class="card-title-row"><span class="card-title">📊 Spending vs budget</span></div>${budgetRows}</div>`:''}
    ${top.length?`<div class="card"><div class="card-title-row"><span class="card-title">🏆 Top categories</span></div>
      ${top.map(([c,v],i)=>`<div class="recap-stat"><span class="recap-lbl">${['🥇','🥈','🥉'][i]} ${catIcon(c)} ${esc(c)}</span><span class="recap-val">${f$(v)}</span></div>`).join('')}
    </div>`:''}
    ${D.goals.length?`<div class="card"><div class="card-title-row"><span class="card-title">🎯 Goal progress this month</span></div>
      ${D.goals.map(g=>{
        const added=contribsForMonth().filter(c=>c.goalId===g.id).reduce((s,c)=>s+(c.flowType==='invest'?c.amount:-c.amount),0);
        return `<div class="recap-stat"><span class="recap-lbl">${esc(g.name)}</span><span class="recap-val" style="color:${added>=0?'var(--mint)':'var(--rose)'}">${added>=0?'+':'-'}${f$(Math.abs(added))}</span></div>`;
      }).join('')}
    </div>`:''}
    <div class="card">
      <div class="card-title-row"><span class="card-title">🧾 All transactions (${all.length})</span></div>
      ${txList}
    </div>
  `;
}

// ─── Money date ritual ─────────────────────────────────────────────────────────
function mdKey(){ return S.year+'-'+String(S.month).padStart(2,'0'); }
function mdState(){ return D.settings.moneyDate[mdKey()] || {recap:false,plan:false,celebrated:false}; }
function mdSet(st){ D.settings.moneyDate[mdKey()]=st; commit('settings'); }
function mdToggle(k){ const st=mdState(); st[k]=!st[k]; mdSet(st); render(); }

function moneydateHTML(){
  const st=mdState();
  const allRecon = D.accounts.length>0 && D.accounts.every(a=>a.lastReconciled && a.lastReconciled.slice(0,7)===todayStr().slice(0,7));
  const steps=[
    {done:allRecon, title:'Reconcile every account', sub:allRecon?'All balances checked in this month — nice.':'Tap each account in Money and enter what the bank actually says.', link:'money', linkLbl:'Open Money →', auto:true},
    {done:st.recap, title:'Review the recap together', sub:'Where did it go? Wants vs needs, top categories, who spent what.', link:'recap', linkLbl:'Open Recap →', key:'recap'},
    {done:st.plan, title:"Set next month's plan", sub:'Adjust budgets, recurring bills & investments, and debt payments until every dollar has a job.', link:'settings', linkLbl:'Open Settings →', key:'plan'},
  ];
  const doneCount=steps.filter(s=>s.done).length;
  if(doneCount===3 && !st.celebrated){ st.celebrated=true; mdSet(st); confettiBurst(); }
  return `
    <div class="section-title"><span onclick="go('recap')" style="cursor:pointer;color:var(--pink)">‹ Recap</span> · Money date 💞</div>
    <div class="total-card" style="background:linear-gradient(135deg,var(--pink-soft),var(--yellow-soft))">
      <div class="total-eyebrow">${MONTHS[S.month-1]} check-in</div>
      <div class="total-amount">${doneCount}/3</div>
      <div class="total-sub">${doneCount===3?'Money date complete — treat yourselves 🍰':'Ten minutes, once a month, together'}</div>
    </div>
    <div class="card">
      ${steps.map(s=>`<div class="md-step">
        <div class="md-check ${s.done?'done':''}" ${s.auto?'':`onclick="mdToggle('${s.key}')"`}>✓</div>
        <div class="md-body"><div class="md-title">${s.title}</div><div class="md-sub">${s.sub}</div><span class="md-link" onclick="go('${s.link}')">${s.linkLbl}</span></div>
      </div>`).join('')}
    </div>
  `;
}

// ── Statement scan (bring-your-own Claude API key) ──
// Stored OUTSIDE the pp:* export map on purpose: exportData()/importData() only
// ever touch Object.keys(LS), so this key can never end up in a shared backup file.
const APIKEY_LS='pp:anthropicApiKey', MODEL_LS='pp:anthropicModel';
const SCAN_MODELS={'claude-opus-5':'Opus 5 (most accurate, default)','claude-sonnet-5':'Sonnet 5 (faster, cheaper)','claude-haiku-4-5-20251001':'Haiku 4.5 (fastest, cheapest)'};
function getApiKey(){ return localStorage.getItem(APIKEY_LS)||''; }
function getScanModel(){ return localStorage.getItem(MODEL_LS)||'claude-opus-5'; }
function settingsStatementScanHTML(){
  const key=getApiKey();
  return `<div class="card">
    <div class="card-title-row"><span class="card-title">📷 Statement scanning</span></div>
    <div style="font-size:12px;color:var(--txt2);font-weight:600;line-height:1.6;margin-bottom:10px">Upload a photo of a bank/card statement from the ＋ button and Claude reads the line items for you. This calls the Claude API directly from your browser with your own API key — it is stored only in this browser (not in the export backup above) and is sent only to api.anthropic.com.</div>
    <div class="fgroup"><label class="flabel">Anthropic API key</label><input class="finput" type="password" placeholder="sk-ant-..." value="${esc(key)}" oninput="saveApiKeyQuiet(this.value)"></div>
    <div class="fgroup"><label class="flabel">Model</label><select class="finput" onchange="setScanModel(this.value)">${Object.entries(SCAN_MODELS).map(([id,label])=>`<option value="${id}" ${getScanModel()===id?'selected':''}>${label}</option>`).join('')}</select></div>
    ${key?`<button class="btn-ghost" onclick="setApiKey('')">Remove key from this browser</button>`:''}
  </div>`;
}
function saveApiKeyQuiet(v){ if(v.trim())localStorage.setItem(APIKEY_LS,v.trim()); else localStorage.removeItem(APIKEY_LS); } // no render() - keeps input focus while typing
function setApiKey(v){ if(v)localStorage.setItem(APIKEY_LS,v.trim()); else localStorage.removeItem(APIKEY_LS); render(); }
function setScanModel(v){ localStorage.setItem(MODEL_LS,v); }
function exportData(){
  const payload={}; Object.keys(LS).forEach(k=>payload[k]=D[k]);
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='patchinpennies-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('⬇️ Backup downloaded');
}
function importData(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      Object.keys(LS).forEach(k=>{ if(data[k]!=null){ D[k]=data[k]; commit(k); } });
      showToast('✅ Backup restored');
      go('home');
    }catch(e){ showToast('⚠️ Could not read that file'); }
  };
  reader.readAsText(file);
  input.value='';
}
function resetAllData(){
  confirmModal('Erase everything in PatchinPennies on this device? This cannot be undone — export a backup first if you want one.','Erase everything',
    `Object.values(LS).forEach(k=>localStorage.removeItem(k));initData();S.view='home';showToast('🗑 All data cleared');render();`);
}

  const d=D.debts.find(x=>x.id===m.debtId); if(!d) return;

  commit('debts');
  D.debtPayments.push({id:uuid(),debtId:m.debtId,date:todayStr(),amount:amt,payer:m.payer,notes:''});
  commit('debtPayments');
  showToast(paidOff?'🎊 DEBT PAID OFF!':'💸 Payment logged');
  closeModal();
  checkMilestones();
}

function openPayCardModal(accountId){
  const c=acctById(accountId); if(!c) return;
  const used=+c.balance||0;
  if(used<=0){ showToast('🎉 Nothing owed on this card'); return; }
  const spend=spendAccounts();
  S.modal={type:'payCard', accountId, name:c.name, used, amount:used.toFixed(2), fromId: spend[0]?spend[0].id:''};
  render();
}
function payCardModalInner(m){
  const spend=spendAccounts();
  const amt=parseFloat(m.amount)||0;
  const after=Math.max(m.used-amt,0);
  const opts=[`<option value="" ${!m.fromId?'selected':''}>Don't track a source</option>`].concat(spend.map(a=>`<option value="${a.id}" ${m.fromId===a.id?'selected':''}>${ACCT_ICONS[a.type]||'🏦'} ${esc(a.name)} · ${f0(a.balance)}</option>`));
  return `<div class="modal-h">💳 Pay off ${esc(m.name)}</div>
    <div class="modal-sub">Balance owed: <b>${f$(m.used)}</b></div>
    <div class="fgroup"><label class="flabel">Payment amount</label>
      <input class="finput big" type="text" inputmode="decimal" value="${esc(m.amount)}" oninput="S.modal.amount=this.value;payModalSync()">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button onclick="S.modal.amount='${m.used.toFixed(2)}';render()" style="flex:1;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px;font-family:var(--font);font-weight:800;font-size:11px;color:var(--txt2);cursor:pointer">Full balance</button>
        <button onclick="S.modal.amount='${(m.used/2).toFixed(2)}';render()" style="flex:1;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px;font-family:var(--font);font-weight:800;font-size:11px;color:var(--txt2);cursor:pointer">Half</button>
      </div>
    </div>
    <div class="fgroup"><label class="flabel">Pay from</label><select class="finput" onchange="S.modal.fromId=this.value">${opts.join('')}</select></div>
    <div style="background:var(--bg2);border-radius:12px;padding:11px 13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;font-weight:700;color:var(--txt2)">Card balance after</span>
      <span id="payAfterVal" style="font-family:var(--mono);font-size:15px;font-weight:500;color:${after<=0?'var(--mint)':'var(--txt)'}">${f$(after)}${after<=0?' 🎉':''}</span>
    </div>
    <button class="btn-primary" id="payCardBtn" onclick="submitPayCard()">Pay ${f$(amt)}</button>
    <button class="modal-cancel" onclick="closeModal()">Cancel</button>`;
}
function payModalSync(){
  const m=S.modal; if(!m||m.type!=='payCard') return;
  const amt=parseFloat(m.amount)||0, after=Math.max(m.used-amt,0);
  const afterEl=document.getElementById('payAfterVal');
  if(afterEl){ afterEl.textContent=f$(after)+(after<=0?' 🎉':''); afterEl.style.color=after<=0?'var(--mint)':'var(--txt)'; }
  const btn=document.getElementById('payCardBtn'); if(btn) btn.textContent='Pay '+f$(amt);
}
function submitPayCard(){
  const m=S.modal; const amt=parseFloat(m.amount);
  if(!amt||isNaN(amt)||amt<=0){ showToast('⚠️ Enter an amount'); return; }
  const res=payCard(m.accountId,amt,m.fromId||'');
  closeModal();
  if(res && res.success) showToast(`💳 Paid ${f0(res.paid)} · ${res.settled} charge${res.settled!==1?'s':''} now counted`);
}

function openTxDetail(id){
  const t=D.transactions.find(x=>x.id===id); if(!t) return;
  S.modal={type:'txDetail', id};
  render();
}
function txDetailModalInner(m){
  const t=D.transactions.find(x=>x.id===m.id); if(!t) return '';
  const isIncome=t.kind==='income', isTransfer=t.kind==='transfer';
  return `<div class="modal-h">${isIncome?'💰':isTransfer?'🔁':catIcon(t.category)} ${esc(t.desc||'—')}</div>
    <div class="modal-sub">${f$(t.amount)} · ${isIncome?'Income':isTransfer?'Transfer':esc(t.category)} · ${esc(personName(t.payer))} · ${esc(t.date)}</div>
    <button class="btn-danger" style="margin-top:0" onclick="deleteTx('${t.id}')">🗑 Delete this transaction</button>
    <button class="modal-cancel" onclick="closeModal()">Close</button>`;
}
function deleteTx(id){
  deleteTransactionById(id);
  showToast('🗑 Deleted');
  closeModal();
}

// ─── Milestones & confetti ────────────────────────────────────────────────────
function checkMilestones(){
  const thresholds=[25,50,75,100];
  const st=D.settings.milestones||{}; const fresh=Object.keys(st).length===0; let hit=null;
  const consider=(id,pct,name,isDebt)=>{
    const last=st[id];
    if(last!=null && !fresh){ thresholds.forEach(t=>{ if(pct>=t && last<t) hit={t,name,isDebt}; }); }
    st[id]=pct;
  };
  D.goals.forEach(g=>consider('g_'+g.id, goalPct(g), g.name, false));
  D.debts.forEach(d=>consider('d_'+d.id, debtPctPaid(d), d.name, true));
  D.settings.milestones=st; commit('settings');
  if(hit){
    S.milestone = hit.t===100
      ? {ico:hit.isDebt?'🎊':'🏆', h:hit.isDebt?'DEBT CRUSHED!':'Goal complete!', s:hit.name+(hit.isDebt?' is fully paid off':' — you did it, you two')}
      : {ico:hit.isDebt?'💪':'🌟', h:hit.t+'% '+(hit.isDebt?'paid off':'there'), s:hit.name};
    confettiBurst();
    setTimeout(()=>{ S.milestone=null; render(); }, 3200);
  }
}
function milestoneHTML(){
  const m=S.milestone;
  return `<div class="milestone-pop" onclick="S.milestone=null;render()">
    <div class="milestone-ico">${m.ico}</div><div class="milestone-h">${esc(m.h)}</div><div class="milestone-s">${esc(m.s)}</div>
  </div>`;
}
function confettiBurst(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host=document.createElement('div'); host.className='confetti-host'; document.body.appendChild(host);
  const cols=['#f472b6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb7185'];
  for(let i=0;i<28;i++){
    const p=document.createElement('div'); p.className='confetti';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.4+Math.random()*.9)+'s';
    p.style.animationDelay=(Math.random()*.3)+'s';
    host.appendChild(p);
  }
  setTimeout(()=>host.remove(),2600);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init(){
  initData();
  runDueRecurring();
  snapshotNetWorth();
  checkMilestones();
  render();
}
init();
</script>

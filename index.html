function downscaleImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=1800;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.9);
        resolve({dataUrl, b64:dataUrl.split(',')[1], mediaType:'image/jpeg'});
      };
      img.onerror=()=>reject(new Error('Could not read that image'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}
async function handleStatementFile(input){
  const files=Array.from(input.files||[]); if(!files.length) return;
  for(const file of files){
    try{ S.scan.images.push(await downscaleImageFile(file)); }
    catch(e){ showToast('⚠️ '+e.message); }
  }
  S.scan.status='ready'; S.scan.error='';
  render();
  input.value='';
}
function removeScanImage(i){ S.scan.images.splice(i,1); if(!S.scan.images.length) S.scan.status='idle'; render(); }
function setScanNotes(v){ S.scan.notes=v; }

function findLikelyDuplicate(parsed){
  const kind=parsed.kind==='income'?'income':'expense';
  const amt=Math.abs(+parsed.amount||0);
  const pd=new Date(parsed.date+'T00:00:00'); if(isNaN(pd)) return null;
  return D.transactions.find(t=>{
    if(t.kind!==kind) return false;
    if(Math.abs(t.amount-amt)>0.01) return false;
    const td=new Date(t.date+'T00:00:00'); if(isNaN(td)) return false;
    return Math.abs(td-pd)<=864e5;
  });
}

// Streams a Messages API response and returns the accumulated text + stop reason.
// Streaming avoids the request-timeout risk of a large non-streaming response
// (several photos + a big JSON transaction list can take a while to generate).
async function streamClaudeMessage(key,body){
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify(Object.assign({},body,{stream:true}))
  });
  if(!resp.ok){
    let msg='HTTP '+resp.status;
    try{ const d=await resp.json(); if(d&&d.error&&d.error.message) msg=d.error.message; }catch(e){}
    throw new Error(msg);
  }
  const reader=resp.body.getReader();
  const decoder=new TextDecoder();
  let buf='', text='', stopReason=null;
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=decoder.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n\n'))>-1){
      const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data:')) continue;
        const jsonStr=line.slice(5).trim();
        if(!jsonStr) continue;
        let evt; try{ evt=JSON.parse(jsonStr); }catch(e){ continue; }
        if(evt.type==='content_block_delta' && evt.delta && evt.delta.type==='text_delta') text+=evt.delta.text;
        else if(evt.type==='message_delta' && evt.delta && evt.delta.stop_reason) stopReason=evt.delta.stop_reason;
        else if(evt.type==='error') throw new Error((evt.error&&evt.error.message)||'Stream error');
      }
    }
  }
  return {text,stopReason};
}

async function runStatementScan(){
  const key=getApiKey();
  if(!key){ S.scan.status='error'; S.scan.error='Add your Anthropic API key in Settings → App first.'; render(); return; }
  if(!S.scan.images.length){ showToast('⚠️ Choose at least one photo first'); return; }
  S.scan.status='scanning'; S.scan.error=''; render();
  const categoryNames=D.categories.map(c=>c.name);
  const schema={
    type:'object',
    properties:{ transactions:{ type:'array', items:{ type:'object', properties:{
      date:{type:'string'}, description:{type:'string'}, amount:{type:'number'},
      kind:{type:'string',enum:['expense','income','skip']}, category:{type:'string'}
    }, required:['date','description','amount','kind','category'], additionalProperties:false } } },
    required:['transactions'], additionalProperties:false
  };
  const n=S.scan.images.length;
  const notes=(S.scan.notes||'').trim();
  const prompt=`You are reading ${n>1?`${n} photos`:'a photo'} of a bank/credit card statement and/or individual receipts. They may be multiple pages of the same statement, or separate unrelated receipts — use your judgement. Extract every line-item transaction you can see across all of them.

Today's date is ${todayStr()}. If a printed date has no year, infer it from the statement's own dates or from today's date — never invent a future date unless clearly future-dated.

For each transaction output:
- date: YYYY-MM-DD
- description: the merchant/payee as printed (clean up obvious OCR noise but keep it recognizable)
- amount: a positive number, no currency symbol
- kind: "expense" for a purchase/charge/debit, "income" for a deposit/refund/credit paid TO the account holder, or "skip" for anything that isn't a real transaction to log (statement balance lines, minimum-payment lines, the card's own autopay/payment line, running totals, headers/footers)
- category: pick the single closest match from this exact list (copy the text exactly): ${JSON.stringify(categoryNames)}. Only if nothing on the list is a reasonable fit, propose a sensible NEW category name instead (Title Case, 1-3 words, e.g. "Travel" or "Car Repairs") — do not force a bad match and do not leave it blank.

Return every transaction you can read, even if partially obscured — do your best rather than skipping unclear ones.${notes?`\n\nThe user also gave you this context — it may describe what the photos are, or call out specific transactions (by merchant, date, and/or amount) with corrections to their description or category. Where it's specific about a transaction, prefer the user's description/category for that transaction over what's printed:\n"""\n${notes}\n"""`:''}`;
  try{
    const content=S.scan.images.map(img=>({type:'image',source:{type:'base64',media_type:img.mediaType,data:img.b64}}));
    content.push({type:'text',text:prompt});
    const model=getScanModel();
    const {text,stopReason}=await streamClaudeMessage(key,{
      model,
      max_tokens:model.indexOf('haiku')>-1?8192:32000,
      output_config:{format:{type:'json_schema',schema}},
      messages:[{role:'user',content}]
    });
    if(stopReason==='refusal') throw new Error('Claude declined to read these photos.');
    if(stopReason==='max_tokens') throw new Error(`That's a lot to read in one batch — try scanning fewer photos at a time (e.g. 3-4).`);
    if(!text) throw new Error('No response content');
    let parsed;
    try{ parsed=JSON.parse(text); }
    catch(e){ throw new Error(`Got cut off partway through reading — try scanning fewer photos at a time (e.g. 3-4).`); }
    const txns=(parsed.transactions||[]).filter(t=>t&&t.date&&t.kind);
    if(!txns.length) throw new Error('Could not find any transactions in those photos');
    S.scan.rows=txns.map((t,i)=>{
      const dup=t.kind!=='skip'?findLikelyDuplicate(t):null;
      const kind=t.kind==='income'?'income':t.kind==='skip'?'skip':'expense';
      const proposed=(t.category||'').trim();
      // Keep Claude's proposed category even if it isn't in the list yet —
      // the review screen marks it "(new)" and importing creates it for real.
      return { id:i, date:t.date, desc:t.description||'', amount:Math.abs(+t.amount||0), kind,
        category:proposed||(categoryNames[0]||''), isNewCategory:!!proposed&&!categoryNames.includes(proposed),
        include: kind!=='skip' && !dup, duplicate:!!dup };
    });
    S.scan.status='results';
  }catch(e){
    S.scan.error=e.message||'Something went wrong reading that image';
    S.scan.status='error';
  }
  render();
}

function importScanRows(){
  const rows=(S.scan.rows||[]).filter(r=>r.include && r.kind!=='skip');
  if(!rows.length){ showToast('⚠️ Nothing selected to import'); return; }
  rows.forEach(r=>{
    // A proposed category that doesn't exist yet becomes real on import
    if(r.kind!=='income' && r.category && !catByName(r.category)){
      const c={id:uuid(),name:r.category,icon:'✨',color:FALLBACK_COLORS[D.categories.length%FALLBACK_COLORS.length],budget:0,kind:'flex'};
      D.categories.push(c); commit('categories');
      syncOp('addCategory',{id:c.id,name:c.name,icon:c.icon,color:c.color,budget:0,kind:'flex'});
    }
    const tx=addTransactionRaw({date:r.date,desc:r.desc||'Statement import',category:r.kind==='income'?'':r.category,payer:scanPayer(),amount:Math.abs(r.amount)||0,kind:r.kind,need:'need',sub:false,notes:'Imported from statement scan',txType:'one-time'});
    syncOp(r.kind==='income'?'addIncome':'addTransaction', r.kind==='income'?toServerIncomeParams(tx):toServerTxParams(tx));
  });
  showToast(`✅ Imported ${rows.length} transaction${rows.length!==1?'s':''}`);
  resetScan();
  go('home');
}

function sankeyHTML(){
  const income=incomeTotals().total;
  const invested=contribsForMonth().filter(c=>c.flowType==='invest').reduce((s,c)=>s+c.amount,0);
  const debtPaid=debtPaysForMonth().reduce((s,p)=>s+p.amount,0);
  const catsArr=Object.entries(catTotals()).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const MAXB=5;
  const branches=[];
  if(invested>0) branches.push({name:'Invested & saved',amt:invested,color:'#34d399'});
  if(debtPaid>0) branches.push({name:'Debt payoff',amt:debtPaid,color:'#60a5fa'});
  const big=catsArr.slice(0,MAXB), rest=catsArr.slice(MAXB);
  big.forEach(([c,v])=>branches.push({name:c,amt:v,color:catColor(c)}));
  const restSum=rest.reduce((s,[,v])=>s+v,0);
  if(restSum>0) branches.push({name:'Everything else',amt:restSum,color:'#b89aad'});
  const outSum=branches.reduce((s,b)=>s+b.amt,0);
  if(!outSum) return `<div class="card"><div class="cf-eyebrow" style="color:var(--txt3)">Cash flow · ${MONTHS[S.month-1]}</div><div class="empty" style="padding:20px 8px"><div class="empty-ico">🌊</div><div class="empty-h">Nothing to flow yet</div><div class="empty-s">Log spending or income to see it here</div></div></div>`;
  const leftover=income-outSum;
  if(income>0&&leftover>0.5) branches.push({name:'Unspent',amt:leftover,color:'#fbbf24'});
  const total=Math.max(income,outSum);
  if(total<=0) return '';

  const W=340, x1=16, x2=228, labelX=236, gap=8, minT=5, pad=8;
  const flowPx=Math.max(branches.length*26, 150);
  const scale=flowPx/total;
  const th=branches.map(b=>Math.max(b.amt*scale,minT));
  const H=pad*2+th.reduce((s,t)=>s+t,0)+gap*(branches.length-1);
  const srcH=th.reduce((s,t)=>s+t,0);
  const srcY=(H-srcH)/2;
  let sy=srcY, ty=pad;
  const defs=[], ribbons=[], labels=[];
  branches.forEach((b,i)=>{
    const t=th[i], mid=(x1+6+x2)/2;
    const ys0=sy, ys1=sy+t, yt0=ty, yt1=ty+t;
    defs.push(`<linearGradient id="cfg${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635" stop-opacity=".55"/><stop offset="1" stop-color="${b.color}" stop-opacity=".9"/></linearGradient>`);
    ribbons.push(`<path d="M${x1+6},${ys0} C${mid},${ys0} ${mid},${yt0} ${x2},${yt0} L${x2},${yt1} C${mid},${yt1} ${mid},${ys1} ${x1+6},${ys1} Z" fill="url(#cfg${i})"/>`);
    ribbons.push(`<rect x="${x2}" y="${yt0}" width="3.5" height="${t}" rx="1.5" fill="${b.color}"/>`);
    const pct=Math.round((b.amt/total)*100);
    const lblY=yt0+t/2;
    labels.push(`<text class="cf-lbl" x="${labelX}" y="${lblY-1}">${esc(b.name.length>17?b.name.slice(0,16)+'…':b.name)}</text>`);
    labels.push(`<text class="cf-amt" x="${labelX}" y="${lblY+10}">${f0(b.amt)} (${pct}%)</text>`);
    sy=ys1; ty=yt1+gap;
  });
  const cashflow=income-totalExpenses()-invested-debtPaid;
  return `<div class="cf-card">
    <div class="cf-eyebrow">Cash flow · ${MONTHS[S.month-1]}</div>
    <svg class="cf-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>${defs.join('')}</defs>
      <rect x="${x1}" y="${srcY}" width="4" height="${srcH}" rx="2" fill="#a3e635"/>
      ${income>0?`<text class="cf-amt" x="${x1}" y="${Math.max(srcY-6,9)}">In: ${f0(income)}</text>`:''}
      ${ribbons.join('')}
      ${labels.join('')}
    </svg>
    <div class="cf-totals">
      <div><div class="cf-tot-lbl">Total income</div><div class="cf-tot-val">${f0(income)}</div></div>
      <div><div class="cf-tot-lbl">Total expenses</div><div class="cf-tot-val">${f0(totalExpenses())}</div></div>
      <div style="text-align:right"><div class="cf-tot-lbl">Cash flow / mo</div><div class="cf-tot-val" style="color:${cashflow>=0?'#6ee7b7':'#fda4b8'}">${cashflow>=0?'+':'−'}${f0(Math.abs(cashflow))}</div></div>
    </div>
  </div>`;
}

// ─── Activity: every row for the month, searchable ───────────────────────────
// Queued card charges are folded in as pseudo-rows. They are not transactions
// yet (they only become spending on payoff), but leaving them out meant a
// charge you just logged was nowhere to be found, which reads as data loss.
function activityRows(){
  const charges=D.cardCharges.filter(c=>!c.settled&&inMonth(c.date,S.month,S.year)).map(c=>({
    id:c.id, date:c.date, desc:c.desc, category:c.category, payer:c.payer,
    amount:+c.amount||0, kind:'expense', queued:true,
    accountName:(acctById(c.accountId)||{}).name||'Card'
  }));
  return txForMonth().concat(charges).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function filteredActivity(){
  const q=S.act.q.trim().toLowerCase();
  return activityRows().filter(t=>{
    if(S.act.kind!=='all'){
      if(S.act.kind==='queued'&&!t.queued) return false;
      if(S.act.kind!=='queued'&&t.kind!==S.act.kind) return false;
    }
    if(S.act.cat && (t.category||'')!==S.act.cat) return false;
    if(S.person!=='All' && (t.payer||BOTH)!==S.person && (t.payer||BOTH)!==BOTH) return false;
    if(!q) return true;
    return String(t.desc||'').toLowerCase().includes(q)
      || String(t.category||'').toLowerCase().includes(q)
      || String(t.amount).includes(q)
      || String(personName(t.payer)).toLowerCase().includes(q);
  });
}
function setAct(k,v){ S.act[k]=v; if(k==='q') S.refocus='.actfind'; render(); }

// A payoff date is a forecast of payments you are making. Projecting one from a
// minimum nobody has ever paid produced a confident, false date - the app said
// "debt-free Mar 2028" about a balance that has not moved. Only forecast from
// real payment history; otherwise state the true position.
function debtProjHTML(d){
  if(d.balance<=0) return `<div class="debt-proj" style="color:var(--mint);font-weight:800">Paid off 🎉</div>`;
  const h=debtPayHistory(d);
  const min=+d.minPayment||0;
  if(!h.ever){
    const m=monthsUntouched(d);
    const since=m===null?'':m===0?' · tracked since this month':` · untouched for ${m} month${m===1?'':'s'}`;
    return `<div class="debt-proj" style="color:var(--peach)">No payment logged yet${since}${min>0?` · minimum is ${f0(min)}/mo`:''}</div>`;
  }
  const paid90=D.debtPayments.filter(p=>p.debtId===d.id && new Date(p.date)>=new Date(Date.now()-90*864e5))
    .reduce((s,p)=>s+p.amount,0);
  if(paid90<=0) return `<div class="debt-proj" style="color:var(--peach)">Nothing paid in 90 days · last was ${esc(h.last)}</div>`;
  const pace=paid90/3;
  const months=Math.ceil(d.balance/pace);
  const dt=new Date(); dt.setMonth(dt.getMonth()+months);
  const caveat=aprMissing(d)?' (no interest rate set, so this is optimistic)':'';
  return `<div class="debt-proj">At your actual ~${f0(pace)}/mo · debt-free <b>${MONTHS_SHORT[dt.getMonth()]} ${dt.getFullYear()}</b>${caveat}</div>`;
}

function submitDebt(){
  const f=S.debtForm;
  const bal=parseFloat(f.balance);
  if(!f.name.trim()||!bal||isNaN(bal)){ showToast('⚠️ Name + balance needed'); return; }
  if(S.debtEditId){
    const d=D.debts.find(x=>x.id===S.debtEditId);
    if(d){ d.name=f.name; d.owner=f.owner; d.balance=bal; d.apr=parseFloat(f.apr)||0; d.minPayment=parseFloat(f.minPayment)||0; d.highPriority=!!f.highPriority; commit('debts');
      syncOp('updateDebt',{id:d.id,name:d.name,owner:toServerOwner(d.owner),apr:d.apr,minPayment:d.minPayment,balance:d.balance,highPriority:d.highPriority?'yes':'no'}); }
    showToast('✏️ Debt updated');
  } else {
    const d={id:uuid(),name:f.name,owner:f.owner,startBalance:bal,balance:bal,apr:parseFloat(f.apr)||0,minPayment:parseFloat(f.minPayment)||0,highPriority:!!f.highPriority,created:todayStr()};
    D.debts.push(d);
    commit('debts');
    syncOp('addDebt',{id:d.id,name:d.name,owner:toServerOwner(d.owner),balance:d.balance,apr:d.apr,minPayment:d.minPayment,highPriority:d.highPriority?'yes':'no'});

  }
  S.debtFormOpen=false; S.debtEditId=null; S.debtForm={name:'',owner:'celeste',balance:'',apr:'',minPayment:'',highPriority:false};
  render();
}

// ─── Money date ritual ─────────────────────────────────────────────────────────
function mdKey(){ return S.year+'-'+String(S.month).padStart(2,'0'); }
function mdState(){ return D.settings.moneyDate[mdKey()] || {recap:false,plan:false,celebrated:false}; }
function mdSet(st){ D.settings.moneyDate[mdKey()]=st; commit('settings'); }
function mdToggle(k){ const st=mdState(); st[k]=!st[k]; mdSet(st); render(); }

function moneydateHTML(){
  const st=mdState();
  const allRecon = D.accounts.length>0 && D.accounts.every(a=>a.lastReconciled && a.lastReconciled.slice(0,7)===todayStr().slice(0,7));
  const steps=[
    {done:allRecon, title:'Reconcile every account', sub:allRecon?'All balances checked in this month — nice.':'Tap each account in Money and enter what the bank actually says.', link:'money', linkLbl:'Open Money →', auto:true},
    {done:st.recap, title:'Review the recap together', sub:'Where did it go? Wants vs needs, top categories, who spent what.', link:'recap', linkLbl:'Open Recap →', key:'recap'},
    {done:st.plan, title:"Set next month's plan", sub:'Adjust budgets, recurring bills & investments, and debt payments until every dollar has a job.', link:'settings', linkLbl:'Open Settings →', key:'plan'},
  ];
  const doneCount=steps.filter(s=>s.done).length;
  if(doneCount===3 && !st.celebrated){ st.celebrated=true; mdSet(st); confettiBurst(); }
  return `
    <div class="section-title"><span onclick="go('recap')" style="cursor:pointer;color:var(--pink)">‹ Recap</span> · Money date 💞</div>
    <div class="total-card" style="background:linear-gradient(135deg,var(--pink-soft),var(--yellow-soft))">
      <div class="total-eyebrow">${MONTHS[S.month-1]} check-in</div>
      <div class="total-amount">${doneCount}/3</div>
      <div class="total-sub">${doneCount===3?'Money date complete — treat yourselves 🍰':'Ten minutes, once a month, together'}</div>
    </div>
    <div class="card">
      ${steps.map(s=>`<div class="md-step">
        <div class="md-check ${s.done?'done':''}" ${s.auto?'':`onclick="mdToggle('${s.key}')"`}>✓</div>
        <div class="md-body"><div class="md-title">${s.title}</div><div class="md-sub">${s.sub}</div><span class="md-link" onclick="go('${s.link}')">${s.linkLbl}</span></div>
      </div>`).join('')}
    </div>
  `;
}

function openAcctEdit(id){
  const a=D.accounts.find(x=>x.id===id); if(!a)return;
  S.acctForm={name:a.name,owner:a.owner||'shared',type:a.type,balance:String(a.balance||0),apy:String(a.apy||''),limit:String(a.limit||'')};

function submitAccount(){
  const f=S.acctForm;
  if(!f.name.trim()){ showToast('⚠️ Name the account'); return; }
  if(S.acctEditId){
    const a=D.accounts.find(x=>x.id===S.acctEditId);
    if(a){ a.name=f.name; a.owner=f.owner; a.type=f.type; a.balance=parseFloat(f.balance)||0; a.apy=parseFloat(f.apy)||0; a.limit=parseFloat(f.limit)||(f.type==='credit'?CARD_LIMIT_DEFAULT:0); commit('accounts');

    showToast('✏️ Account updated');
  } else {
    const a={id:uuid(),name:f.name,owner:f.owner,type:f.type,balance:parseFloat(f.balance)||0,apy:parseFloat(f.apy)||0,limit:parseFloat(f.limit)||(f.type==='credit'?CARD_LIMIT_DEFAULT:0),lastReconciled:f.balance?todayStr():''};

    syncOp('addAccount',{id:a.id,name:a.name,owner:toServerOwner(a.owner),type:a.type,balance:a.balance,apy:a.apy,limit:a.limit});
    showToast(f.type==='credit'?'💳 Card added':'🏦 Account added');
  }
  S.acctFormOpen=false; S.acctEditId=null; S.acctForm={name:'',owner:'shared',type:'checking',balance:'',apy:'',limit:''};
  render();

    const c=D.categories.find(x=>x.id===S.catEditId);

    if(!name){ showToast('⚠️ Name the category'); return; }

  render();

  const amt=parseFloat(f.amount);
  if(!f.name.trim()||!amt||isNaN(amt)){ showToast('⚠️ Name + amount needed'); return; }
  if(f.kind==='bill' && !f.category){ showToast('⚠️ Choose a category'); return; }
  if(f.kind==='transfer' && !f.destId){ showToast('⚠️ Choose a destination'); return; }
  const payload={name:f.name,kind:f.kind,category:f.kind==='bill'?f.category:'',amount:amt,payer:f.payer,frequency:f.frequency,dayOfMonth:parseInt(f.dayOfMonth)||1,destType:f.destType,destId:f.kind==='transfer'?f.destId:'',flowType:f.kind==='transfer'?f.flowType:''};
  if(S.recurEditId){
    const r=D.recurring.find(x=>x.id===S.recurEditId);
    if(r){
      Object.assign(r,payload);
      commit('recurring');
      if(r.kind==='bill') syncOp('updateRecurringBill',{id:r.id,description:r.name,category:r.category,paidBy:toServerPerson(r.payer),amount:r.amount,frequency:r.frequency,day:r.dayOfMonth});
      else syncOp('updateFlow',{id:r.id,name:r.name,flowType:r.flowType,amount:r.amount,owner:toServerOwner(r.payer),accountId:r.destType==='account'?r.destId:'',goalId:r.destType==='goal'?r.destId:'',day:r.dayOfMonth,frequency:r.frequency});
    }
    showToast('✏️ Updated');
  } else {
    const r=Object.assign({id:uuid(),active:true,lastRun:'',created:todayStr()},payload);
    D.recurring.push(r);
    commit('recurring');
    if(r.kind==='bill') syncOp('addRecurringBill',{id:r.id,description:r.name,category:r.category,paidBy:toServerPerson(r.payer),amount:r.amount,frequency:r.frequency,day:r.dayOfMonth});
    else syncOp('addFlow',{id:r.id,name:r.name,flowType:r.flowType,amount:r.amount,owner:toServerOwner(r.payer),accountId:r.destType==='account'?r.destId:'',goalId:r.destType==='goal'?r.destId:'',day:r.dayOfMonth,frequency:r.frequency});
    showToast('🔁 Recurring item added');
  }
  S.recurFormOpen=false; S.recurEditId=null;
  render();
}

// ── Statement scan (bring-your-own Claude API key) ──
// Stored OUTSIDE the pp:* export map on purpose: exportData()/importData() only
// ever touch Object.keys(LS), so this key can never end up in a shared backup file.
const APIKEY_LS='pp:anthropicApiKey', MODEL_LS='pp:anthropicModel';
const SCAN_MODELS={'claude-opus-5':'Opus 5 (most accurate, default)','claude-sonnet-5':'Sonnet 5 (faster, cheaper)','claude-haiku-4-5-20251001':'Haiku 4.5 (fastest, cheapest)'};
function getApiKey(){ return localStorage.getItem(APIKEY_LS)||''; }
function getScanModel(){ return localStorage.getItem(MODEL_LS)||'claude-opus-5'; }
function settingsStatementScanHTML(){
  const key=getApiKey();
  return `<div class="card">
    <div class="card-title-row"><span class="card-title">📷 Statement scanning</span></div>
    <div style="font-size:12px;color:var(--txt2);font-weight:600;line-height:1.6;margin-bottom:10px">Upload a photo of a bank/card statement from the ＋ button and Claude reads the line items for you. This calls the Claude API directly from your browser with your own API key — it is stored only in this browser (not in the export backup above) and is sent only to api.anthropic.com.</div>
    <div class="fgroup"><label class="flabel">Anthropic API key</label><input class="finput" type="password" placeholder="sk-ant-..." value="${esc(key)}" oninput="saveApiKeyQuiet(this.value)"></div>
    <div class="fgroup"><label class="flabel">Model</label><select class="finput" onchange="setScanModel(this.value)">${Object.entries(SCAN_MODELS).map(([id,label])=>`<option value="${id}" ${getScanModel()===id?'selected':''}>${label}</option>`).join('')}</select></div>
    ${key?`<button class="btn-ghost" onclick="setApiKey('')">Remove key from this browser</button>`:''}
  </div>`;
}
function saveApiKeyQuiet(v){ if(v.trim())localStorage.setItem(APIKEY_LS,v.trim()); else localStorage.removeItem(APIKEY_LS); } // no render() - keeps input focus while typing
function setApiKey(v){ if(v)localStorage.setItem(APIKEY_LS,v.trim()); else localStorage.removeItem(APIKEY_LS); render(); }
function setScanModel(v){ localStorage.setItem(MODEL_LS,v); }
function exportData(){
  const payload={}; Object.keys(LS).forEach(k=>payload[k]=D[k]);
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='patchinpennies-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('⬇️ Backup downloaded');
}
function importData(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      Object.keys(LS).forEach(k=>{ if(data[k]!=null){ D[k]=data[k]; commit(k); } });
      showToast('✅ Backup restored');
      go('home');
    }catch(e){ showToast('⚠️ Could not read that file'); }
  };
  reader.readAsText(file);
  input.value='';
}
function resetAllData(){
  const n=pendingQueue().length;
  confirmModal(n?`Clear the local cache? ${n} change${n!==1?'s':''} ${n!==1?'haven’t':'hasn’t'} synced yet and will be lost if you clear now — try Sync now first.`:'Clear the local cache and re-download everything fresh from your Google Sheet?','Clear cache',
    `Object.values(LS).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(QUEUE_LS);initData();S.view='home';showToast('🔄 Re-syncing…');render();loadForMonth();`);
}

// ─── Milestones & confetti ────────────────────────────────────────────────────
function checkMilestones(){
  const thresholds=[25,50,75,100];
  const st=D.settings.milestones||{}; const fresh=Object.keys(st).length===0; let hit=null;
  const consider=(id,pct,name,isDebt)=>{
    const last=st[id];
    if(last!=null && !fresh){ thresholds.forEach(t=>{ if(pct>=t && last<t) hit={t,name,isDebt}; }); }
    st[id]=pct;
  };
  D.goals.forEach(g=>consider('g_'+g.id, goalPct(g), g.name, false));
  D.debts.forEach(d=>consider('d_'+d.id, debtPctPaid(d), d.name, true));
  D.settings.milestones=st; commit('settings');
  if(hit){
    S.milestone = hit.t===100
      ? {ico:hit.isDebt?'🎊':'🏆', h:hit.isDebt?'DEBT CRUSHED!':'Goal complete!', s:hit.name+(hit.isDebt?' is fully paid off':' — you did it, you two')}
      : {ico:hit.isDebt?'💪':'🌟', h:hit.t+'% '+(hit.isDebt?'paid off':'there'), s:hit.name};
    confettiBurst();
    setTimeout(()=>{ S.milestone=null; render(); }, 3200);
  }
}
function milestoneHTML(){
  const m=S.milestone;
  return `<div class="milestone-pop" onclick="S.milestone=null;render()">
    <div class="milestone-ico">${m.ico}</div><div class="milestone-h">${esc(m.h)}</div><div class="milestone-s">${esc(m.s)}</div>
  </div>`;
}
function confettiBurst(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host=document.createElement('div'); host.className='confetti-host'; document.body.appendChild(host);
  const cols=['#f472b6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb7185'];
  for(let i=0;i<28;i++){
    const p=document.createElement('div'); p.className='confetti';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.4+Math.random()*.9)+'s';
    p.style.animationDelay=(Math.random()*.3)+'s';
    host.appendChild(p);
  }
  setTimeout(()=>host.remove(),2600);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init(){
  initData(); // instant paint from the local cache (or empty state on a brand-new device)
  render();
  loadForMonth().then(()=>{ snapshotNetWorth(); checkMilestones(); render(); });
  window.addEventListener('online', ()=>loadForMonth());
}
init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PatchinPennies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
:root{
  --bg:#fdf6f9;--bg2:#fff0f7;--card:#ffffff;--card2:#fef3fb;
  --border:#f0d6e8;--border2:#e8c8dc;
  --txt:#4a3048;--txt2:#8a6880;--txt3:#b89aad;
  --pink:#f472b6;--pink-soft:#fce7f3;--pink-glow:rgba(244,114,182,0.2);
  --lavender:#a78bfa;--lav-soft:#ede9fe;--lav-glow:rgba(167,139,250,0.2);
  --mint:#34d399;--mint-soft:#d1fae5;
  --peach:#fb923c;--peach-soft:#ffedd5;
  --sky:#60a5fa;--sky-soft:#dbeafe;
  --rose:#fb7185;--rose-soft:#ffe4e6;
  --yellow:#fbbf24;--yellow-soft:#fef3c7;
  --radius:18px;--font:'Nunito',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 2px 16px rgba(200,140,180,.12);--shadow-lg:0 6px 32px rgba(200,140,180,.2);
}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100%;padding-bottom:86px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,#f9c8e4 1px,transparent 1px);background-size:28px 28px;opacity:.3}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.wordmark{font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--txt)}
.wordmark em{font-style:normal;color:var(--pink)}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow)}
.month-nav button{background:none;border:none;font-size:15px;color:var(--txt2);width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.month-nav button:active{background:var(--pink-soft)}
.month-nav .mlabel{font-size:12px;font-weight:800;color:var(--txt);min-width:62px;text-align:center}

/* Cards */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:800;color:var(--txt)}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-toggle{background:var(--pink-soft);border:none;color:var(--pink);font-family:var(--font);font-weight:800;font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer}

/* Health banner */
.health{display:flex;align-items:center;gap:12px;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--border)}
.health-ico{font-size:30px;line-height:1}
.health-title{font-size:14px;font-weight:900;color:var(--txt)}
.health-sub{font-size:11.5px;font-weight:600;color:var(--txt2);margin-top:1px}

/* Person cards */
.person-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.person-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.person-card.patches{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff,#fdf0f8)}
.pc-name{font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.pc-spent{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--txt);letter-spacing:-1px;margin-top:3px}
.pc-remaining{font-size:11px;font-weight:700;margin-top:2px}
.pc-remaining.good{color:var(--mint)}.pc-remaining.warn{color:var(--peach)}.pc-remaining.bad{color:var(--rose)}

/* Totals */
.total-card{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;text-align:center}
.total-eyebrow{font-size:10px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:1px}
.total-amount{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-2px;color:var(--txt);margin:2px 0}
.total-sub{font-size:11px;color:var(--txt2);font-weight:700}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat-lbl{font-size:11px;font-weight:700;color:var(--txt2);display:flex;align-items:center;gap:5px;margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:-.5px}
.stat-val.pink{color:var(--sky)}.stat-val.lav{color:var(--lavender)}
.pip{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Settle-up */
.settle{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1.5px solid var(--yellow);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.settle-msg{font-size:13px;font-weight:800;color:var(--txt);text-align:center;margin-bottom:4px}
.settle-amt{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--peach);text-align:center;letter-spacing:-1px}
.settle-sub{font-size:10.5px;color:var(--txt2);text-align:center;font-weight:700;margin-top:2px}
.settle-btn{width:100%;margin-top:10px;background:var(--peach);color:#fff;border:none;border-radius:12px;padding:10px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer}
.settle-btn:active{transform:scale(.98)}

/* Budget bars */
.bud-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bud-name{font-size:12px;font-weight:700;color:var(--txt)}
.bud-nums{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.track{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:11px}
.track-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.track-fill.safe{background:linear-gradient(90deg,#6ee7b7,#34d399)}
.track-fill.warn{background:linear-gradient(90deg,#fcd34d,#fbbf24)}
.track-fill.danger{background:linear-gradient(90deg,#fda4b8,#fb7185)}
.track-fill.none{background:#e8d5e3}

/* Transaction list */
.tx{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bg2)}
.tx:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--txt3);font-weight:600;margin-top:1px}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--txt);flex-shrink:0}
.tx-badge{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;margin-left:5px;text-transform:uppercase;letter-spacing:.3px}
.badge-both{background:var(--lav-soft);color:var(--lavender)}
.badge-recur{background:var(--mint-soft);color:#059669}

/* Forms */
.fgroup{margin-bottom:14px}
.flabel{display:block;font-size:11px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.finput{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--font);font-size:15px;font-weight:600;color:var(--txt);outline:none}
.finput:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-glow)}
.finput.big{font-family:var(--mono);font-size:26px;font-weight:500;text-align:center;letter-spacing:-1px}
textarea.finput{resize:none;min-height:60px}
.cpill-wrap{display:flex;flex-wrap:wrap;gap:7px}
.cpill{display:flex;align-items:center;gap:5px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;transition:all .15s}
.cpill.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.cpill .ci{font-size:14px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg-opt{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12px;font-weight:800;color:var(--txt2);cursor:pointer;transition:all .15s}
.seg-opt.on{background:var(--card);color:var(--pink);box-shadow:var(--shadow)}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--pink),var(--lavender));color:#fff;border:none;border-radius:14px;padding:15px;font-family:var(--font);font-weight:900;font-size:15px;cursor:pointer;box-shadow:var(--shadow-lg)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.6}
.btn-ghost{width:100%;background:var(--card);color:var(--txt2);border:1.5px solid var(--border);border-radius:12px;padding:12px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}

/* Receipt */
.receipt-btn{width:100%;background:var(--lav-soft);border:1.5px dashed var(--lavender);color:var(--lavender);border-radius:12px;padding:13px;font-family:var(--font);font-weight:800;font-size:13px;cursor:pointer}
.receipt-spin{display:inline-block;width:13px;height:13px;border:2px solid var(--lavender);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Quick add */
.qa-row{display:flex;flex-wrap:wrap;gap:8px}
.qa-btn{flex:1 1 calc(33.33% - 6px);min-width:88px;background:var(--card2);border:1.5px solid var(--border);border-radius:13px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s}
.qa-btn:active{transform:scale(.96);background:var(--pink-soft)}
.qa-btn.add-new{border-style:dashed;color:var(--txt3)}
.qa-ico{font-size:19px;display:block;margin-bottom:3px}
.qa-name{font-size:11px;font-weight:800;color:var(--txt);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-amt{font-family:var(--mono);font-size:10px;color:var(--txt2);display:block;margin-top:1px}

/* Goals */
.goal-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.goal-name{font-size:14px;font-weight:800;color:var(--txt)}
.goal-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:99px;margin-top:3px;display:inline-block}
.gt-savings{background:var(--mint-soft);color:#059669}
.gt-debt{background:var(--rose-soft);color:var(--rose)}
.goal-pct{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--txt2)}
.goal-nums{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:11px}
.goal-actions{display:flex;gap:7px;margin-top:11px}
.goal-actions button{flex:1;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px;font-family:var(--font);font-weight:800;font-size:11px;color:var(--txt2);cursor:pointer}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px}
.nav-ico{font-size:21px;filter:grayscale(1) opacity(.45);transition:all .15s}
.nav-lbl{font-size:9px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px}
.nav-item.on .nav-ico{filter:none;transform:translateY(-1px)}
.nav-item.on .nav-lbl{color:var(--pink)}
.nav-add{background:linear-gradient(135deg,var(--pink),var(--lavender));width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:var(--shadow-lg);font-size:26px;color:#fff;border:3px solid var(--bg)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(74,48,72,.4);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));width:100%;max-width:480px;box-shadow:0 -8px 40px rgba(0,0,0,.2);animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{font-size:17px;font-weight:900;text-align:center;margin-bottom:6px}
.modal-sub{font-size:12.5px;color:var(--txt2);text-align:center;font-weight:600;margin-bottom:16px}
.modal-cancel{width:100%;background:var(--bg2);border:none;color:var(--txt2);border-radius:12px;padding:13px;font-family:var(--font);font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}

/* Misc */
.seed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--mint-soft),var(--sky-soft));border:1.5px solid var(--mint);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.seed-text{font-size:12.5px;font-weight:800;color:var(--txt)}
.seed-text small{display:block;font-size:10.5px;font-weight:600;color:var(--txt2);margin-top:1px}
.seed-go{background:var(--mint);color:#fff;border:none;border-radius:10px;padding:9px 13px;font-family:var(--font);font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}
.empty{text-align:center;padding:34px 16px;color:var(--txt3)}
.empty-ico{font-size:38px;margin-bottom:8px}
.empty-h{font-size:14px;font-weight:800;color:var(--txt2);margin-bottom:3px}
.empty-s{font-size:12px;font-weight:600}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:200;box-shadow:var(--shadow-lg);animation:toastIn .3s;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:transl(-50%,10px)}to{opacity:1}}
.section-title{font-size:12px;font-weight:900;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin:4px 2px 10px}
.chart-wrap{position:relative;height:200px;margin-top:6px}
.recap-stat{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bg2)}
.recap-stat:last-child{border-bottom:none}
.recap-lbl{font-size:13px;font-weight:700;color:var(--txt2)}
.recap-val{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--txt)}
.setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:0 24px}
.setup-glyph{font-size:54px;margin-bottom:14px}
.setup-h{font-size:24px;font-weight:900;margin-bottom:6px}
.setup-s{font-size:13px;color:var(--txt2);font-weight:600;margin-bottom:22px;line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px}
.loading-cat{font-size:44px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* ─ Cash flow (sankey) ─ */
.cf-card{background:linear-gradient(150deg,#3a2338,#241426);border:1.5px solid #5a3a55;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-lg)}
.cf-eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;color:#c9a3bd;text-transform:uppercase;letter-spacing:2.5px}
.cf-svg{width:100%;height:auto;display:block;margin-top:10px}
.cf-lbl{font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;fill:#fdf6f9}
.cf-amt{font-family:'DM Mono',monospace;font-size:9.5px;fill:#c9a3bd}
.cf-totals{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #5a3a5588}
.cf-tot-lbl{font-size:9.5px;font-weight:800;color:#c9a3bd;text-transform:uppercase;letter-spacing:.6px}
.cf-tot-val{font-family:var(--mono);font-size:15px;font-weight:500;color:#fdf6f9;letter-spacing:-.5px;margin-top:2px}
/* ─ Money tab ─ */
.person-toggle{display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:3px;margin-bottom:12px}
.person-toggle .seg-opt{padding:7px;border-radius:999px}
.acct{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--bg2)}
.acct:last-child{border-bottom:none}
.acct-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--sky-soft)}
.acct-body{flex:1;min-width:0}
.acct-name{font-size:13px;font-weight:800;color:var(--txt)}
.acct-meta{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:1px}
.acct-bal{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--txt);text-align:right}
.acct-recon{font-size:9.5px;font-weight:800;color:var(--sky);text-align:right;margin-top:1px}
.acct-recon.stale{color:var(--peach)}
.melt-wrap{margin:8px 0 4px}
.melt{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden;display:flex}
.melt-fill{height:100%;background:linear-gradient(90deg,#fda4b8,#fb7185);transition:width .8s cubic-bezier(.4,0,.2,1)}
.melt-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:4px}
.debt{padding:11px 0;border-bottom:1px solid var(--bg2)}
.debt:last-child{border-bottom:none}
.debt-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.debt-name{font-size:13px;font-weight:800;color:var(--txt);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debt-bal{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--rose)}
.debt-proj{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:2px}
.debt-proj b{color:var(--sky);font-weight:800}
.debt-pri{display:inline-block;font-size:8.5px;font-weight:900;background:var(--rose-soft);color:var(--rose);padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.4px}
.debt-actions{display:flex;gap:6px;margin-top:7px}
.debt-actions button{border:1.5px solid var(--border);background:var(--card);border-radius:9px;padding:6px 10px;font-family:var(--font);font-weight:800;font-size:10.5px;color:var(--txt2);cursor:pointer}
.strategy{background:linear-gradient(135deg,var(--sky-soft),var(--lav-soft));border:1.5px solid var(--sky);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.strategy-msg{font-size:12.5px;font-weight:700;color:var(--txt);margin-top:9px;line-height:1.5}
.strategy-msg b{color:var(--sky)}
.ring-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ring-card{flex:0 0 108px;background:var(--card);border:1.5px solid var(--border);border-radius:15px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.ring{position:relative;width:62px;height:62px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--txt)}
.ring-name{font-size:10.5px;font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring-nums{font-family:var(--mono);font-size:9px;color:var(--txt3);margin-top:1px}
/* ─ Unallocated / plan ─ */
.plan{border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1.5px solid var(--border)}
.plan-title{font-size:13px;font-weight:900;color:var(--txt)}
.plan-sub{font-size:11px;font-weight:600;color:var(--txt2);margin-top:2px}
.plan-amt{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-1px;margin-top:3px}
/* ─ Flows (settings) ─ */
.flow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2)}
.flow:last-child{border-bottom:none}
.flow-body{flex:1;min-width:0}
.flow-name{font-size:13px;font-weight:800;color:var(--txt)}
.flow-meta{font-size:10.5px;color:var(--txt3);font-weight:600;margin-top:1px}
.flow-amt{font-family:var(--mono);font-size:13px;font-weight:500}
.flow-amt.invest{color:var(--mint)}.flow-amt.divest{color:var(--peach)}
.switch{width:38px;height:22px;border-radius:99px;background:#e8d5e3;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.switch.on{background:var(--mint)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:18px}
/* ─ Money date ─ */
.md-step{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--bg2)}
.md-step:last-child{border-bottom:none}
.md-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;cursor:pointer;color:transparent;transition:all .2s}
.md-check.done{background:var(--mint);border-color:var(--mint);color:#fff}
.md-body{flex:1}
.md-title{font-size:13.5px;font-weight:800;color:var(--txt)}
.md-sub{font-size:11px;color:var(--txt2);font-weight:600;margin-top:2px;line-height:1.5}
.md-link{font-size:11px;font-weight:800;color:var(--pink);cursor:pointer;margin-top:4px;display:inline-block}
/* ─ Confetti ─ */
.confetti-host{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(660deg);opacity:.7}}
.milestone-pop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--pink);border-radius:20px;padding:20px 26px;z-index:301;text-align:center;box-shadow:var(--shadow-lg);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.milestone-ico{font-size:38px}
.milestone-h{font-size:16px;font-weight:900;margin-top:4px}
.milestone-s{font-size:12px;color:var(--txt2);font-weight:700;margin-top:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>
<script>
// ─── Config (matches Google Sheets backend schema) ────────────────────────────
const CATS = [
  'Groceries','Dining Out','Entertainment','Transportation',
  'Utilities','Health','Shopping','Personal/Misc',"Patches' Expenses"
];
const ICONS = {
  'Groceries':'🛒','Dining Out':'🍽️','Entertainment':'🎮','Transportation':'🚗',
  'Utilities':'💡','Health':'🏥','Shopping':'🛍️','Personal/Misc':'📦',"Patches' Expenses":'🐱',
  'Recurring':'🔄','Fixed':'🔄','Subscriptions':'📱','Donation':'❤️'
};
const COLORS = {
  'Groceries':'#93c5fd','Dining Out':'#fdba74','Entertainment':'#c4b5fd',
  'Transportation':'#6ee7b7','Utilities':'#fde68a','Health':'#fda4b8',
  'Shopping':'#f0abfc','Personal/Misc':'#f9a8d4',"Patches' Expenses":'#fbcfe8',
  'Recurring':'#d8b4fe','Fixed':'#d8b4fe','Subscriptions':'#e879f9','Donation':'#fda4b8'
};
const DEFAULT_BUDGETS = {
  'Groceries':600,'Dining Out':200,'Entertainment':150,'Transportation':100,
  'Utilities':150,'Health':100,'Shopping':150,'Personal/Misc':100,"Patches' Expenses":75
};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PEOPLE = ['Ateeq','Celeste'];
const ACCT_TYPES = {checking:'🏦 Checking',savings:'🌱 Savings',hysa:'🌱 High-yield savings',retirement:'🌅 Retirement',investment:'📈 Investment',other:'💼 Other'};
const ACCT_ICONS = {checking:'🏦',savings:'🌱',hysa:'🌱',retirement:'🌅',investment:'📈',other:'💼'};

const today = () => new Date().toISOString().split('T')[0];
const f$ = n => '$'+(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0 = n => '$'+Math.round(+n||0).toLocaleString('en-US');
const parseAmt = v => { if(typeof v==='number')return v; return parseFloat(String(v).replace(/[$,]/g,''))||0; };

// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  view:'home', month:new Date().getMonth()+1, year:new Date().getFullYear(),
  txns:[], goals:[], income:[], history:[],
  loading:false, seeded:false, recurringStatus:null,
  scanning:false,
  budgetsOpen: JSON.parse(localStorage.getItem('pp_budgets_open')||'true'),
  budgets: JSON.parse(localStorage.getItem('pp_budgets')||'null') || DEFAULT_BUDGETS,
  qaModal:null, qaForm:{},
  editTx:null,
  url: localStorage.getItem('casalog_url') || 'https://script.google.com/macros/s/AKfycbwytyrjnPRI5lSo8JFj37UHUAMgp7N9wrtdBoAXZIY9vYWn_X1nDenFhYMBKCQAA4CTLg/exec',
  setupUrl:'',
  form:{ desc:'', amount:'', cat:'Groceries', payer:'Ateeq', txType:'One-time', date:today(), notes:'', receiptUrl:'', need:'Need', sub:false },
  incomeForm:{ desc:'', amount:'', source:'Ateeq', date:today(), notes:'' },
  goalForm:{ name:'', target:'', saved:'', date:'', type:'savings', notes:'' },
  accounts:[], debts:[], debtPayments:[], flows:[], contribs:[],
  person: localStorage.getItem('pp_person')||'All',
  strategy: localStorage.getItem('pp_strategy')||'snowball',
  acctFormOpen:false, acctForm:{ name:'', owner:'Both', type:'checking', balance:'', apy:'' },
  debtFormOpen:false, debtForm:{ name:'', owner:'Celeste', balance:'', apr:'', minPayment:'', highPriority:false },
  flowFormOpen:false, flowForm:{ name:'', amount:'', flowType:'invest', owner:'Both', dest:'', day:'1' },
  milestone:null,
};
let _charts = {};

// ─── Quick-adds (local; lightweight) ──────────────────────────────────────────
function getQuickAdds(){ return JSON.parse(localStorage.getItem('pp_quickadds')||'[]'); }
function setQuickAdds(q){ localStorage.setItem('pp_quickadds', JSON.stringify(q)); }

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(params){
  if(!S.url) return null;
  try{
    const r = await fetch(S.url+'?'+new URLSearchParams(params));
    return await r.json();
  }catch(e){ showToast('⚠️ Connection error'); return null; }
}
async function apiPost(body){
  if(!S.url) return null;
  try{
    const r = await fetch(S.url,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}});
    return await r.json();
  }catch(e){ showToast('⚠️ Connection error'); return null; }
}

async function load(){
  S.loading=true; render();
  const all = await api({action:'getAll',month:S.month,year:S.year});
  if(all && all.transactions){
    applyData(all);
  } else {
    // fallback for older backend deployments
    const [tx,gl,inc,ac,db,fl,co] = await Promise.all([
      api({action:'getTransactions',month:S.month,year:S.year}),
      api({action:'getGoals'}),
      api({action:'getIncome',month:S.month,year:S.year}),
      api({action:'getAccounts'}),
      api({action:'getDebts'}),
      api({action:'getFlows'}),
      api({action:'getContributions',month:S.month,year:S.year})
    ]);
    applyData({
      transactions:tx?.transactions||[], goals:gl?.goals||[], income:inc?.income||[],
      accounts:ac?.accounts||[], debts:db?.debts||[], payments:db?.payments||[],
      flows:fl?.flows||[], contributions:co?.contributions||[]
    });
  }
}
function applyData(d){
  S.loading=false;
  S.txns = d.transactions||[];
  S.seeded = S.txns.some(t=>String(t.Notes||'').includes('AUTO_SEED') || String(t.TxType||'').toLowerCase()==='recurring');
  S.goals = d.goals||[];
  S.income = d.income||[];
  S.accounts = d.accounts||[];
  S.debts = d.debts||[];
  S.debtPayments = d.payments||[];
  S.flows = d.flows||[];
  S.contribs = d.contributions||[];
  checkMilestones();
  render();
}

// ─── Computations ─────────────────────────────────────────────────────────────
function txAmount(t){ return parseAmt(t.Amount); }
function isExpense(t){ return true; } // all rows in Transactions are expenses; income is separate sheet

function totalExpenses(){ return S.txns.reduce((s,t)=>s+txAmount(t),0); }
function catTotals(){
  const o={};
  S.txns.forEach(t=>{ const c=t.Category||'Personal/Misc'; o[c]=(o[c]||0)+txAmount(t); });
  return o;
}
// Per-person SPENT (their share). Both = 50/50 split.
function personTotals(){
  let ateeq=0, celeste=0;
  S.txns.forEach(t=>{
    const a=txAmount(t), who=t.PaidBy||'Ateeq';
    if(who==='Both'){ ateeq+=a/2; celeste+=a/2; }
    else if(who==='Celeste') celeste+=a;
    else ateeq+=a;
  });
  return {ateeq,celeste};
}
// Settle-up: who PAID out of pocket vs what they OWE (their share).
// If Ateeq paid for a 'Both' item, Celeste owes him half.
function settleUp(){
  let ateeqPaid=0, celestePaid=0, ateeqOwes=0, celesteOwes=0;
  S.txns.forEach(t=>{
    const a=txAmount(t), who=t.PaidBy||'Ateeq';
    if(who==='Both'){
      // assume logged by Ateeq historically? No — 'Both' means shared cost.
      // Treat 'Both' as already-split (each owes their half, no transfer needed).
      ateeqOwes+=a/2; celesteOwes+=a/2; ateeqPaid+=a/2; celestePaid+=a/2;
    } else if(who==='Celeste'){ celestePaid+=a; celesteOwes+=a; }
    else { ateeqPaid+=a; ateeqOwes+=a; }
  });
  // net = what each paid minus what each owes
  const ateeqNet = ateeqPaid - ateeqOwes;
  return { ateeqPaid, celestePaid, ateeqNet };
}
function incomeTotals(){
  let ateeq=0, celeste=0;
  S.income.forEach(i=>{ const a=parseAmt(i.Amount), src=i.Source||'Ateeq'; if(src==='Celeste')celeste+=a; else ateeq+=a; });
  return { ateeq, celeste, total:ateeq+celeste };
}
function getCatBudgets(){ return S.budgets; }
function goalPct(g){
  const saved=parseAmt(g.Saved), target=parseAmt(g.Target);
  if(g.Type==='debt'){ // debt: Saved = amount paid off toward Target balance
    return target>0?Math.min((saved/target)*100,100):0;
  }
  return target>0?Math.min((saved/target)*100,100):0;
}
function daysUntil(d){ if(!d)return null; const diff=Math.ceil((new Date(d)-new Date())/864e5); return diff>0?diff:null; }

function monthHealth(){
  const exp=totalExpenses(), inc=incomeTotals().total, net=inc-exp;
  if(inc===0 && exp===0) return {emoji:'🐱',title:'Fresh start',sub:'Log something to get going',score:'neutral'};
  if(net>=inc*0.2 && inc>0) return {emoji:'😻',title:'Crushing it',sub:`Saved ${f0(net)} so far this month`,score:'great'};
  if(net>=0) return {emoji:'😺',title:'On track',sub:`${f0(net)} left of this month's income`,score:'good'};
  if(net>-inc*0.15) return {emoji:'🙀',title:'Cutting it close',sub:`${f0(Math.abs(net))} over income`,score:'warn'};
  return {emoji:'😿',title:'Over budget',sub:`${f0(Math.abs(net))} more spent than earned`,score:'bad'};
}

// ─── Render router ────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(!S.url){ app.innerHTML=setupHTML(); bindSetup(); return; }
  if(S.loading){ app.innerHTML=`<div class="loading"><div class="loading-cat">🐱</div><div style="font-weight:800;color:var(--txt2)">Counting pennies…</div></div>`; return; }
  let body='';
  if(S.view==='home') body=homeHTML();
  else if(S.view==='add') body=addHTML();
  else if(S.view==='trends') body=trendsHTML();
  else if(S.view==='money') body=moneyHTML();
  else if(S.view==='settings') body=settingsHTML();
  else if(S.view==='moneydate') body=moneydateHTML();
  else if(S.view==='more') body=moreHTML();
  else if(S.view==='income') body=incomeHTML();
  else if(S.view==='goals') body=goalsHTML();
  else if(S.view==='recap') body=recapHTML();
  app.innerHTML = topbarHTML() + body + navHTML() + (S.qaModal?qaConfirmHTML():'') + (S.milestone?milestoneHTML():'');
  // post-render hooks
  if(S.view==='trends') requestAnimationFrame(drawCharts);
}

function topbarHTML(){
  const showMonth = ['home','trends','income','recap'].includes(S.view);
  return `<div class="topbar">
    <div class="wordmark">Patchin<em>Pennies</em></div>
    ${showMonth?`<div class="month-nav">
      <button onclick="shiftMonth(-1)">‹</button>
      <span class="mlabel">${MONTHS_SHORT[S.month-1]} ${S.year}</span>
      <button onclick="shiftMonth(1)">›</button>
    </div>`:`<div style="font-size:22px">🐱</div>`}
  </div>`;
}

function navHTML(){
  const item=(v,ico,lbl)=>`<button class="nav-item ${S.view===v?'on':''}" onclick="go('${v}')"><span class="nav-ico">${ico}</span><span class="nav-lbl">${lbl}</span></button>`;
  return `<div class="nav">
    ${item('home','🏠','Home')}
    ${item('money','💎','Money')}
    <button class="nav-add" onclick="go('add')">＋</button>
    ${item('recap','📋','Recap')}
    ${item('more','🐾','More')}
  </div>`;
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function homeHTML(){
  const {ateeq,celeste}=personTotals();
  const inc=incomeTotals(), total=totalExpenses(), net=inc.total-total;
  const cats=catTotals(), budgets=getCatBudgets();
  const settle=settleUp();
  const health=monthHealth();
  const healthBg = health.score==='great'?'linear-gradient(135deg,#d1fae5,#dbeafe)':health.score==='good'?'linear-gradient(135deg,#fce7f3,#ede9fe)':health.score==='warn'?'linear-gradient(135deg,#fef3c7,#ffedd5)':health.score==='bad'?'linear-gradient(135deg,#ffe4e6,#fce7f3)':'linear-gradient(135deg,#fce7f3,#ede9fe)';

  const patchesBudget = budgets["Patches' Expenses"]||75;
  const patchesSpent = cats["Patches' Expenses"]||0;

  const netColor = net>=0?'var(--mint)':'var(--rose)';
  const netSign = net>=0?'+':'';

  // Quick-adds
  const qas=getQuickAdds();
  const qaButtons = qas.map((q,i)=>`<div class="qa-btn" onclick="openQA(${i})"><span class="qa-ico">${q.icon||ICONS[q.cat]||'📦'}</span><span class="qa-name">${q.name}</span><span class="qa-amt">${f$(q.amount)}</span></div>`).join('');
  const qaAdd = qas.length<6?`<div class="qa-btn add-new" onclick="newQuickAdd()"><span class="qa-ico">＋</span><span class="qa-name">Add</span></div>`:'';

  // Budget bars
  const budgetBars = CATS.map(cat=>{
    const spent=cats[cat]||0, budget=budgets[cat]||0;
    const pct=budget>0?Math.min((spent/budget)*100,100):0;
    const cls=budget===0?'none':pct<70?'safe':pct<90?'warn':'danger';
    return `<div><div class="bud-row"><span class="bud-name">${ICONS[cat]||'📋'} ${cat}</span><span class="bud-nums">${f0(spent)}${budget>0?' / '+f0(budget):''}</span></div><div class="track"><div class="track-fill ${cls}" style="width:${pct}%"></div></div></div>`;
  }).join('');

  // Settle-up card (only if there's an imbalance worth showing)
  let settleCard='';
  if(Math.abs(settle.ateeqNet)>=1){
    const ateeqAhead = settle.ateeqNet>0;
    settleCard=`<div class="settle">
      <div class="settle-msg">${ateeqAhead?'Celeste owes Ateeq':'Ateeq owes Celeste'}</div>
      <div class="settle-amt">${f0(Math.abs(settle.ateeqNet))}</div>
      <div class="settle-sub">Based on who paid for shared costs this month</div>
      <button class="settle-btn" onclick="settleConfirm(${Math.abs(settle.ateeqNet).toFixed(2)}, ${ateeqAhead})">Settle up 💸</button>
    </div>`;
  }

  // recent transactions (latest 6)
  const recent=[...S.txns].sort((a,b)=>String(b.Date).localeCompare(String(a.Date))).slice(0,6);
  const recentList = recent.length?recent.map(t=>txRowHTML(t)).join(''):`<div class="empty"><div class="empty-ico">🐾</div><div class="empty-h">No spending yet</div><div class="empty-s">Tap ＋ to log your first one</div></div>`;

  const seedBar=!S.seeded?`<div class="seed-bar"><div class="seed-text">Recurring not logged yet 🌱<small>Rent, internet, Spotify, Patches' food</small></div><button class="seed-go" onclick="seed()">Add now</button></div>`:'';

  return `
    ${seedBar}
    <div class="health" style="background:${healthBg}">
      <div class="health-ico">${health.emoji}</div>
      <div><div class="health-title">${health.title}</div><div class="health-sub">${health.sub}</div></div>
    </div>

    ${planCardHTML()}

    <div class="total-card">
      <div class="total-eyebrow">Total Spent · ${MONTHS[S.month-1]}</div>
      <div class="total-amount">${f$(total)}</div>
      <div class="total-sub">${S.txns.length} transaction${S.txns.length!==1?'s':''} · ${netSign}${f0(Math.abs(net))} net 🐾</div>
    </div>

    <div class="person-cards">
      <div class="person-card">
        <div class="pc-name">🧔 Ateeq</div>
        <div class="pc-spent">${f0(ateeq)}</div>
        <div class="pc-remaining good">spent this month</div>
      </div>
      <div class="person-card">
        <div class="pc-name">👩 Celeste</div>
        <div class="pc-spent">${f0(celeste)}</div>
        <div class="pc-remaining good">spent this month</div>
      </div>
      <div class="person-card patches">
        <div><div class="pc-name">🐱 Patches</div><div class="pc-spent">${f0(patchesSpent)}</div></div>
        <div style="text-align:right"><div class="pc-remaining ${patchesSpent>patchesBudget?'bad':patchesSpent>patchesBudget*.7?'warn':'good'}">${patchesBudget-patchesSpent>=0?f0(patchesBudget-patchesSpent)+' left':f0(patchesSpent-patchesBudget)+' over'}</div></div>
      </div>
    </div>

    ${settleCard}

    ${qas.length||true?`<div class="card" style="padding:13px">
      <div class="card-title-row" style="margin-bottom:10px"><span class="card-title">⚡ Quick Add</span></div>
      <div class="qa-row">${qaButtons}${qaAdd}</div>
    </div>`:''}

    <div class="card">
      <div class="card-title-row">
        <span class="card-title">📊 Budgets</span>
        <button class="card-toggle" onclick="toggleBudgets()">${S.budgetsOpen?'▲ Hide':'▼ Show'}</button>
      </div>
      ${S.budgetsOpen?budgetBars:`<div style="font-size:12px;color:var(--txt3);font-weight:600">Tap show to see category budgets</div>`}
    </div>

    <div class="card">
      <div class="card-title-row"><span class="card-title">🧾 Recent</span>${S.txns.length>6?`<button class="card-toggle" onclick="go('recap')">See all</button>`:''}</div>
      ${recentList}
    </div>
  `;
}

function txRowHTML(t){
  const cat=t.Category||'Personal/Misc';
  const who=t.PaidBy||'Ateeq';
  const isRecur=String(t.TxType||'').toLowerCase()==='recurring';
  const badge = who==='Both'?`<span class="tx-badge badge-both">Split</span>`:isRecur?`<span class="tx-badge badge-recur">Auto</span>`:'';
  const dt=String(t.Date||'').slice(5).replace('-','/');
  return `<div class="tx" onclick="editTx('${t.ID}')">
    <div class="tx-ico" style="background:${COLORS[cat]||'#f0d6e8'}33">${ICONS[cat]||'📦'}</div>
    <div class="tx-body"><div class="tx-desc">${esc(t.Description||'—')}${badge}</div><div class="tx-meta">${cat} · ${who} · ${dt}</div></div>
    <div class="tx-amt">${f$(txAmount(t))}</div>
  </div>`;
}

// ─── ADD ──────────────────────────────────────────────────────────────────────
function addHTML(){
  const f=S.form, scanning=S.scanning;
  const catPills=CATS.map((c,i)=>`<div class="cpill ${f.cat===c?'on':''}" onclick="setForm('cat','${c.replace(/'/g,"\\'")}')"><span class="ci">${ICONS[c]}</span>${c}</div>`).join('');
  const payerSeg=['Ateeq','Celeste','Both'].map(p=>`<div class="seg-opt ${f.payer===p?'on':''}" onclick="setForm('payer','${p}')">${p}</div>`).join('');
  const typeSeg=['One-time','Recurring'].map(p=>`<div class="seg-opt ${f.txType===p?'on':''}" onclick="setForm('txType','${p}')">${p}</div>`).join('');
  return `
    <div class="section-title">Log an expense</div>
    <div class="card">
      <div class="fgroup">
        <button class="receipt-btn" onclick="triggerReceipt()" ${scanning?'disabled':''}>
          ${scanning?`<span class="receipt-spin"></span> Reading receipt…`:f.receiptUrl?`✅ Receipt attached`:`📷 Scan a receipt`}
        </button>
        <input type="file" id="receiptInput" accept="image/*" capture="environment" style="display:none" onchange="handleReceipt(this)">
      </div>

function drawCharts(){
  Object.values(_charts).forEach(c=>{try{c.destroy()}catch{}}); _charts={};
  const cats=catTotals();
  const entries=Object.entries(cats).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const catCanvas=document.getElementById('catChart');
  if(catCanvas&&entries.length){
    _charts.cat=new Chart(catCanvas,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:entries.map(e=>COLORS[e[0]]||'#f0d6e8'),borderWidth:2,borderColor:'#fff'}]},options:{plugins:{legend:{position:'bottom',labels:{font:{family:'Nunito',weight:'700',size:10},padding:9,boxWidth:11,usePointStyle:true}}},cutout:'62%',maintainAspectRatio:false}});
  }
  const trendCanvas=document.getElementById('trendChart');
  if(trendCanvas){
    // build last 6 months from current month going back, using whatever we have (this month live; others 0 if not loaded)
    const labels=[],exp=[],inc=[];
    for(let i=5;i>=0;i--){
      let m=S.month-i, y=S.year;
      while(m<=0){m+=12;y--;}
      labels.push(MONTHS_SHORT[m-1]);
      if(m===S.month&&y===S.year){ exp.push(totalExpenses()); inc.push(incomeTotals().total); }
      else { exp.push(null); inc.push(null); }
    }
    _charts.trend=new Chart(trendCanvas,{type:'line',data:{labels,datasets:[
      {label:'Spent',data:exp,borderColor:'#f472b6',backgroundColor:'#f472b622',fill:true,tension:.4,spanGaps:true,pointRadius:4,pointBackgroundColor:'#f472b6'},
      {label:'Income',data:inc,borderColor:'#34d399',backgroundColor:'#34d39911',fill:true,tension:.4,spanGaps:true,pointRadius:4,pointBackgroundColor:'#34d399'}
    ]},options:{plugins:{legend:{position:'bottom',labels:{font:{family:'Nunito',weight:'700',size:10},usePointStyle:true,boxWidth:9}}},scales:{y:{ticks:{font:{family:'DM Mono',size:9},callback:v=>'$'+v},grid:{color:'#f0d6e833'}},x:{ticks:{font:{family:'Nunito',weight:'700',size:10}},grid:{display:false}}},maintainAspectRatio:false}});
  }
  const pc=document.getElementById('personChart');
  if(pc){
    const {ateeq,celeste}=personTotals(); const patches=cats["Patches' Expenses"]||0;
    _charts.person=new Chart(pc,{type:'bar',data:{labels:['Ateeq','Celeste','Patches'],datasets:[{data:[ateeq,celeste,patches],backgroundColor:['#60a5fa','#a78bfa','#fbcfe8'],borderRadius:8,barThickness:38}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{font:{family:'DM Mono',size:9},callback:v=>'$'+v},grid:{color:'#f0d6e833'}},x:{ticks:{font:{family:'Nunito',weight:'800',size:11}},grid:{display:false}}},maintainAspectRatio:false}});

}

// ─── Cash flow sankey ────────────────────────────────────────────────────────
function sankeyHTML(){
  const income=incomeTotals().total;
  const invested=S.contribs.filter(c=>c.FlowType==='invest').reduce((s,c)=>s+c.Amount,0);
  const debtPaid=S.debtPayments.filter(pm=>{const p=String(pm.Date).split('-');return +p[0]===S.year&&+p[1]===S.month;}).reduce((s,pm)=>s+pm.Amount,0);
  const cats=Object.entries(catTotals()).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  // group small categories into "Everything else" so ribbons stay readable
  const MAXB=5;
  const branches=[];
  if(invested>0) branches.push({name:'Invested & saved',amt:invested,color:'#34d399'});
  if(debtPaid>0) branches.push({name:'Debt payoff',amt:debtPaid,color:'#60a5fa'});
  const big=cats.slice(0,MAXB), rest=cats.slice(MAXB);
  big.forEach(([c,v])=>branches.push({name:c,amt:v,color:COLORS[c]||'#f9a8d4'}));
  const restSum=rest.reduce((s,[,v])=>s+v,0);
  if(restSum>0) branches.push({name:'Everything else',amt:restSum,color:'#b89aad'});
  const outSum=branches.reduce((s,b)=>s+b.amt,0);
  if(!outSum) return '';
  const leftover=income-outSum;
  if(income>0&&leftover>0.5) branches.push({name:'Unspent',amt:leftover,color:'#fbbf24'});
  const total=Math.max(income,outSum);
  if(total<=0) return '';

  // geometry
  const W=340, x1=16, x2=228, labelX=236, gap=8, minT=5, pad=8;
  const flowPx=Math.max(branches.length*26, 150); // vertical pixels available for thickness
  const scale=flowPx/total;
  const th=branches.map(b=>Math.max(b.amt*scale,minT));
  const H=pad*2+th.reduce((s,t)=>s+t,0)+gap*(branches.length-1);
  // source bar spans the summed thickness, centered
  const srcH=th.reduce((s,t)=>s+t,0);
  const srcY=(H-srcH)/2;
  let sy=srcY, ty=pad;
  const defs=[], ribbons=[], labels=[];
  branches.forEach((b,i)=>{
    const t=th[i], mid=(x1+6+x2)/2;
    const ys0=sy, ys1=sy+t, yt0=ty, yt1=ty+t;
    defs.push(`<linearGradient id="cfg${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635" stop-opacity=".55"/><stop offset="1" stop-color="${b.color}" stop-opacity=".9"/></linearGradient>`);
    ribbons.push(`<path d="M${x1+6},${ys0} C${mid},${ys0} ${mid},${yt0} ${x2},${yt0} L${x2},${yt1} C${mid},${yt1} ${mid},${ys1} ${x1+6},${ys1} Z" fill="url(#cfg${i})"/>`);
    ribbons.push(`<rect x="${x2}" y="${yt0}" width="3.5" height="${t}" rx="1.5" fill="${b.color}"/>`);
    const pct=Math.round((b.amt/total)*100);
    const lblY=yt0+t/2;
    labels.push(`<text class="cf-lbl" x="${labelX}" y="${lblY-1}">${esc(b.name.length>17?b.name.slice(0,16)+'…':b.name)}</text>`);
    labels.push(`<text class="cf-amt" x="${labelX}" y="${lblY+10}">${f0(b.amt)} (${pct}%)</text>`);
    sy=ys1; ty=yt1+gap;
  });
  const cashflow=income-totalExpenses()-invested-debtPaid;
  return `<div class="cf-card">
    <div class="cf-eyebrow">Cash flow · ${MONTHS[S.month-1]}</div>
    <svg class="cf-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>${defs.join('')}</defs>
      <rect x="${x1}" y="${srcY}" width="4" height="${srcH}" rx="2" fill="#a3e635"/>
      ${income>0?`<text class="cf-amt" x="${x1}" y="${Math.max(srcY-6,9)}">In: ${f0(income)}</text>`:''}
      ${ribbons.join('')}
      ${labels.join('')}
    </svg>
    <div class="cf-totals">
      <div><div class="cf-tot-lbl">Total income</div><div class="cf-tot-val">${f0(income)}</div></div>
      <div><div class="cf-tot-lbl">Total expenses</div><div class="cf-tot-val">${f0(totalExpenses())}</div></div>
      <div style="text-align:right"><div class="cf-tot-lbl">Cash flow / mo</div><div class="cf-tot-val" style="color:${cashflow>=0?'#6ee7b7':'#fda4b8'}">${cashflow>=0?'+':'−'}${f0(Math.abs(cashflow))}</div></div>
    </div>
  </div>`;
}

// ─── Plan (every dollar has a job) ───────────────────────────────────────────
function planTotals(){
  const budgetTotal=Object.values(S.budgets).reduce((s,v)=>s+(+v||0),0);
  const flowInvest=S.flows.filter(f=>f.Active&&f.FlowType==='invest').reduce((s,f)=>s+f.Amount,0);
  const debtMins=S.debts.filter(d=>d.Balance>0).reduce((s,d)=>s+d.MinPayment,0);
  const income=incomeTotals().total;
  return {income,budgetTotal,flowInvest,debtMins,unalloc:income-(budgetTotal+flowInvest+debtMins)};
}
function planCardHTML(){
  const p=planTotals();
  if(p.income===0) return '';
  const u=Math.round(p.unalloc);
  let bg,title,sub,color;
  if(Math.abs(u)<1){ bg='linear-gradient(135deg,var(--mint-soft),var(--sky-soft))'; title='Every dollar has a job 🎉'; sub='Income fully allocated across budgets, savings & debt'; color='var(--mint)'; }

  else { bg='linear-gradient(135deg,var(--rose-soft),var(--pink-soft))'; title='Plan exceeds income'; sub='Budgets + flows + debt payments are more than this month\'s income'; color='var(--rose)'; }
  return `<div class="plan" style="background:${bg}" onclick="go('settings')">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><div class="plan-title">${title}</div><div class="plan-sub">${sub}</div></div>
      <div class="plan-amt" style="color:${color}">${u>0?'+':''}${f0(u)}</div>
    </div>
  </div>`;
}

function byPerson(list){ return S.person==='All'?list:list.filter(x=>(x.Owner||'Both')===S.person||(x.Owner||'Both')==='Both'); }
function debtPace(d){
  const cutoff=new Date(Date.now()-90*864e5);
  const paid90=S.debtPayments.filter(pm=>pm.DebtID===d.ID&&new Date(pm.Date)>=cutoff).reduce((s,pm)=>s+pm.Amount,0);
  return Math.max(paid90/3, d.MinPayment||0);
}
function debtProjHTML(d){
  if(d.Balance<=0) return `<div class="debt-proj" style="color:var(--mint);font-weight:800">Paid off 🎉</div>`;
  const pace=debtPace(d);
  if(pace<=0) return `<div class="debt-proj">Set a monthly payment to see a payoff date</div>`;
  const months=Math.ceil(d.Balance/pace);
  const dt=new Date(); dt.setMonth(dt.getMonth()+months);
  return `<div class="debt-proj">At ~${f0(pace)}/mo · debt-free <b>${MONTHS_SHORT[dt.getMonth()]} ${dt.getFullYear()}</b></div>`;
}
function strategyNext(){
  const open=byPerson(S.debts).filter(d=>d.Balance>0);
  if(!open.length) return null;
  const sorted=[...open].sort((a,b)=> S.strategy==='avalanche'
    ? (b.APR-a.APR)||(a.Balance-b.Balance)
    : (a.Balance-b.Balance));
  return sorted[0];
}

      <circle cx="31" cy="31" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(pct,100)/100)}" style="transition:stroke-dashoffset .8s"/></svg>

// ─── Milestones & confetti ────────────────────────────────────────────────────
function debtPctPaid(d){ return d.StartBalance>0?Math.min(((d.StartBalance-d.Balance)/d.StartBalance)*100,100):0; }
function checkMilestones(){
  const store=JSON.parse(localStorage.getItem('pp_milestones')||'null');
  const fresh=store===null; const st=store||{};
  const thresholds=[25,50,75,100]; let hit=null;
  const consider=(id,pct,name,isDebt)=>{
    const last=st[id];
    if(last!=null&&!fresh){
      for(const t of thresholds){ if(pct>=t&&last<t){ hit={t,name,isDebt}; } }
    }
    st[id]=pct;
  };
  S.goals.filter(g=>g.Type!=='debt').forEach(g=>consider('g_'+g.ID,goalPct(g),g.Name,false));
  S.debts.forEach(d=>consider('d_'+d.ID,debtPctPaid(d),d.Name,true));
  localStorage.setItem('pp_milestones',JSON.stringify(st));
  if(hit){
    S.milestone = hit.t===100
      ? {ico:hit.isDebt?'🎊':'🏆', h:hit.isDebt?'DEBT CRUSHED!':'Goal complete!', s:hit.name+(hit.isDebt?' is fully paid off':' — you did it, you two')}
      : {ico:hit.isDebt?'💪':'🌟', h:hit.t+'% '+(hit.isDebt?'paid off':'there'), s:hit.name};
    confettiBurst();
    setTimeout(()=>{ S.milestone=null; render(); }, 3200);
  }
}
function milestoneHTML(){
  const m=S.milestone;
  return `<div class="milestone-pop" onclick="S.milestone=null;render()">
    <div class="milestone-ico">${m.ico}</div><div class="milestone-h">${esc(m.h)}</div><div class="milestone-s">${esc(m.s)}</div>
  </div>`;
}
function confettiBurst(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host=document.createElement('div'); host.className='confetti-host'; document.body.appendChild(host);
  const cols=['#f472b6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb7185'];
  for(let i=0;i<28;i++){
    const p=document.createElement('div'); p.className='confetti';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.4+Math.random()*.9)+'s';
    p.style.animationDelay=(Math.random()*.3)+'s';
    host.appendChild(p);
  }
  setTimeout(()=>host.remove(),2600);
}

function setIncomeForm(k,v){ S.incomeForm[k]=v; if(k==='source') render(); }
function setGoalForm(k,v){ S.goalForm[k]=v; if(k==='type') render(); }

function showToast(msg){
  const host=document.getElementById('toast-host');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; host.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

async function submitTx(){
  const f=S.form;
  if(!f.amount||isNaN(parseFloat(f.amount))){ showToast('⚠️ Enter an amount'); return; }
  if(!f.desc.trim()){ showToast('⚠️ Add a description'); return; }
  const btn=document.getElementById('saveBtn'); if(btn)btn.disabled=true;
  const d=await api({action:'addTransaction',date:f.date,description:f.desc,category:f.cat,paidBy:f.payer,amount:f.amount,txType:f.txType,notes:f.notes,receiptUrl:f.receiptUrl,need:f.need,sub:f.sub?'yes':''});
  if(btn)btn.disabled=false;
  if(d?.success){
    showToast('✅ Added!');
    S.form={ desc:'',amount:'',cat:f.cat,payer:f.payer,txType:'One-time',date:today(),notes:'',receiptUrl:'',need:'Need',sub:false };
    go('home'); load();
  } else showToast('⚠️ '+(d?.error?String(d.error).slice(0,40):'Failed — run setup() in Apps Script'));
}

async function submitIncome(){
  const f=S.incomeForm;
  if(!f.amount||isNaN(parseFloat(f.amount))){ showToast('⚠️ Enter an amount'); return; }
  const btn=document.getElementById('incBtn'); if(btn)btn.disabled=true;
  const d=await api({action:'addIncome',date:f.date,description:f.desc||'Income',source:f.source,amount:f.amount,notes:f.notes});
  if(btn)btn.disabled=false;
  if(d?.success){ showToast('✅ Income added!'); S.incomeForm={desc:'',amount:'',source:f.source,date:today(),notes:''}; load(); }
  else showToast('⚠️ '+(d?.error?String(d.error).slice(0,40):'Failed — run setup()'));
}
async function deleteIncome(id){ if(!confirm('Delete this income entry?'))return; const d=await api({action:'deleteIncome',id}); if(d?.success){showToast('🗑 Deleted');load();} }

async function submitGoal(){
  const f=S.goalForm;
  if(!f.name.trim()||!f.target||isNaN(parseFloat(f.target))){ showToast('⚠️ Name + target needed'); return; }
  const btn=document.getElementById('goalBtn'); if(btn)btn.disabled=true;

async function deleteGoal(id){ if(!confirm('Delete this goal?'))return; const d=await api({action:'deleteGoal',goalId:id}); if(d?.success){showToast('🗑 Deleted');const g=await api({action:'getGoals'});S.goals=g?.goals||[];render();} }

// ─── Money actions ───────────────────────────────────────────────────────────
function setPerson(p){ S.person=p; localStorage.setItem('pp_person',p); render(); }
function setStrategy(s){ S.strategy=s; localStorage.setItem('pp_strategy',s); render(); }
async function reconcile(id,name,cur){
  const v=prompt(`What does the bank say "${name}" holds right now?`, cur||'');
  if(v===null||v===''||isNaN(parseFloat(v))) return;
  const d=await api({action:'reconcileAccount',id,balance:v});
  if(d?.success){
    const dr=Math.round((d.drift||0)*100)/100;
    showToast(dr===0?'✓ Balance confirmed':`✓ Reconciled · drift ${dr>0?'+':''}${f0(dr)}`);
    load();
  }
}
async function submitAccount(){
  const f=S.acctForm;
  if(!f.name.trim()){ showToast('⚠️ Name the account'); return; }
  const d=await api({action:'addAccount',name:f.name,owner:f.owner,type:f.type,balance:f.balance||'0',apy:f.apy||'0'});
  if(d?.success){ showToast('🏦 Account added'); S.acctForm={name:'',owner:'Both',type:'checking',balance:'',apy:''}; S.acctFormOpen=false; load(); }
}
async function submitDebt(){
  const f=S.debtForm;
  if(!f.name.trim()||!f.balance||isNaN(parseFloat(f.balance))){ showToast('⚠️ Name + balance needed'); return; }
  const d=await api({action:'addDebt',name:f.name,owner:f.owner,balance:f.balance,apr:f.apr||'0',minPayment:f.minPayment||'0',highPriority:f.highPriority?'yes':'no'});
  if(d?.success){ showToast('💳 Debt added'); S.debtForm={name:'',owner:'Celeste',balance:'',apr:'',minPayment:'',highPriority:false}; S.debtFormOpen=false; load(); }
}
async function payDebt(id,name){
  const v=prompt(`Payment toward "${name}":`,''); if(!v||isNaN(parseFloat(v)))return;
  const who=prompt('Who paid? (Ateeq / Celeste / Both)','Both')||'Both';
  const d=await api({action:'logDebtPayment',debtId:id,amount:v,paidBy:who});
  if(d?.success){ showToast(d.paidOff?'🎊 DEBT PAID OFF!':'💸 Payment logged'); load(); }
}
async function editDebt(id){
  const dbt=S.debts.find(x=>x.ID===id); if(!dbt)return;
  const apr=prompt(`APR % for "${dbt.Name}" (for avalanche ranking):`,dbt.APR||''); if(apr===null)return;
  const mp=prompt('Planned monthly payment:',dbt.MinPayment||''); if(mp===null)return;
  const hp=confirm('Mark as HIGH priority? (OK = yes, Cancel = no)');
  const d=await api({action:'updateDebt',id,apr:apr||'0',minPayment:mp||'0',highPriority:hp?'yes':'no'});
  if(d?.success){ showToast('✏️ Debt updated'); load(); }
}
async function removeDebt(id){ if(!confirm('Delete this debt and its payment history?'))return; const d=await api({action:'deleteDebt',id}); if(d?.success){showToast('🗑 Deleted');load();} }
async function submitFlow(){
  const f=S.flowForm;
  if(!f.name.trim()||!f.amount||isNaN(parseFloat(f.amount))){ showToast('⚠️ Name + amount needed'); return; }
  const accountId=f.dest.startsWith('a:')?f.dest.slice(2):'';
  const goalId=f.dest.startsWith('g:')?f.dest.slice(2):'';
  const d=await api({action:'addFlow',name:f.name,flowType:f.flowType,amount:f.amount,owner:f.owner,accountId,goalId,day:f.day||'1'});
  if(d?.success){ showToast('🔁 Recurring flow added'); S.flowForm={name:'',amount:'',flowType:'invest',owner:'Both',dest:'',day:'1'}; load(); }
}
async function toggleFlow(id,active){
  const d=await api({action:'updateFlow',id,active:active?'no':'yes'});
  if(d?.success){ showToast(active?'⏸ Paused':'▶️ Active'); load(); }
}
async function removeFlow(id){ if(!confirm('Delete this recurring flow?'))return; const d=await api({action:'deleteFlow',id}); if(d?.success){showToast('🗑 Deleted');load();} }
async function contribute(goalId,name){
  const v=prompt(`Add to "${name}":`,''); if(!v||isNaN(parseFloat(v)))return;
  let accountId='';
  if(S.accounts.length){
    const list=S.accounts.map((a,i)=>`${i+1} = ${a.Name}`).join('\n');
    const pick=prompt(`Which account is it sitting in? (blank = none)\n${list}`,'');
    const idx=parseInt(pick)-1;
    if(!isNaN(idx)&&S.accounts[idx]) accountId=S.accounts[idx].ID;
  }
  const d=await api({action:'addContribution',flowType:'invest',amount:v,goalId,accountId,owner:'Both',notes:'Manual — '+name});
  if(d?.success){ showToast('🌱 '+f0(parseFloat(v))+' saved!'); load(); }
}

async function seed(){

  if(d?.success){ showToast('✅ Recurring added'); load(); }

// Receipt scanning via Claude vision (through backend proxy is ideal; here direct)
function triggerReceipt(){ document.getElementById('receiptInput').click(); }
async function handleReceipt(input){
  const file=input.files[0]; if(!file)return;
  S.scanning=true; render();
  try{
    const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    // Save to Drive via backend
    const up=await apiPost({action:'saveReceipt',base64,filename:file.name||'receipt.jpg',mediaType:file.type||'image/jpeg'});
    if(up?.url) S.form.receiptUrl=up.url;
    // Read amount via Claude
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:base64}},{type:'text',text:'Read this receipt. Respond ONLY with JSON, no markdown: {"amount": number, "description": "store name", "category": one of [Groceries,Dining Out,Entertainment,Transportation,Utilities,Health,Shopping,Personal/Misc]}'}]}]})});
    const data=await resp.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    if(parsed.amount) S.form.amount=String(parsed.amount);
    if(parsed.description) S.form.desc=parsed.description;
    if(parsed.category&&CATS.includes(parsed.category)) S.form.cat=parsed.category;
    showToast('✅ Receipt read!');
  }catch(e){ showToast('⚠️ Could not read receipt'); }
  S.scanning=false; render();
}
